version: '3.8'

services:
  aci_server:
    build: ./aci_server
    ports:
      - "8000:8000"
    volumes:
      - ./aci_server:/app
    env_file:
      - ./aci_server/.env
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  api_generator:
    build: ./api_generator
    ports:
      - "8001:8001"
    volumes:
      - ./api_generator:/app
    env_file:
      - ./api_generator/.env
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]