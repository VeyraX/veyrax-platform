version: '3.8'

services:
  aci_server:
    build: ./aci_server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./aci_server:/app
      - ./.env:/app/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - WHATSAPP_API_BASE_URL=http://host.docker.internal:8080/api
    depends_on:
      - redis
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]


  celery_worker1:
    build: ./aci_server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./aci_server:/app
      - ./.env:/app/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/app
      - API_URL=http://host.docker.internal:8000
      - WORKER_ID=1
    depends_on:
      - redis
      - aci_server
    working_dir: /app
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--concurrency=1", "--hostname=worker1@%h"]

  celery_worker2:
    build: ./aci_server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./aci_server:/app
      - ./.env:/app/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/app
      - API_URL=http://host.docker.internal:8000
      - WORKER_ID=2
    depends_on:
      - redis
      - aci_server
    working_dir: /app
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--concurrency=1", "--hostname=worker2@%h"]

  celery_worker3:
    build: ./aci_server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./aci_server:/app
      - ./.env:/app/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/app
      - API_URL=http://host.docker.internal:8000
      - WORKER_ID=3
    depends_on:
      - redis
      - aci_server
    working_dir: /app
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--concurrency=1", "--hostname=worker3@%h"]

  celery_worker4:
    build: ./aci_server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./aci_server:/app
      - ./.env:/app/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/app
      - API_URL=http://host.docker.internal:8000
      - WORKER_ID=4
    depends_on:
      - redis
      - aci_server
    working_dir: /app
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "--concurrency=1", "--hostname=worker4@%h"]

  celery_flower:
    build: ./aci_server
    ports:
      - "5555:5555"
    volumes:
      - ./aci_server:/app
      - ./.env:/app/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      - redis
      - celery_worker1
      - celery_worker2
      - celery_worker3
      - celery_worker4
    working_dir: /app
    command: ["celery", "-A", "celery_app", "flower", "--port=5555", "--address=0.0.0.0", "--persistent=True", "--max_tasks=10000"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data: