http://airtable.com/developers/web/api/create-ediscovery-export:
- endpoint: https://api.airtable.com/v0/meta/enterpriseAccounts/{enterpriseAccountId}/exports
  name: Create eDiscovery Export
  authorization: Bearer token
  examples:
    input_json: "{\n  \"baseId\": \"appLkNDICXNqxSDhG\",\n  \"includeCsvFormat\": true,\n  \"shouldSendEmailOnCompletion\"\
      : true\n}\n"
    output_json: "{\n  \"createdTime\": \"2021-01-01T00:00:00.000Z\",\n  \"id\": \"etkJkReGfIaW8DZq5\",\n  \"request\": {\n\
      \    \"baseId\": \"appLkNDICXNqxSDhG\",\n    \"includeCsvFormat\": true,\n    \"shouldSendEmailOnCompletion\": true\n\
      \  },\n  \"state\": \"processing\",\n  \"user\": {\n    \"email\": \"foo@bar.com\",\n    \"id\": \"usrL2PNC5o3H4lBEi\"\
      ,\n    \"name\": \"Barry Allen\"\n  }\n}\n"
  request_parameters:
    path:
      enterpriseAccountId: string
    body:
      baseId: string
      includeCsvFormat: optional<boolean>
      shouldSendEmailOnCompletion: optional<boolean>
  response_parameters:
    id: string
    data:
      expirationTime: string
      jsonDownloadUrl: string
      csvZipDownloadUrl: optional<string>
    error: optional<string>
    state: enum("pending", "processing", "error", "done")
    createdTime: string
    user:
      id: string
      email: string
      name: string
    request:
      baseId: string
      includeCsvFormat: boolean
      shouldSendEmailOnCompletion: boolean
  error_responses:
    404:
      error:
        type: NOT_FOUND
