https://www.airtable.com/developers/web/api/list-records:
- endpoint: https://api.airtable.com/v0/{baseId}/{tableIdOrName}
  name: List Records
  authorization: Bearer token
  examples:
    input_json: "{\n  \"baseId\": \"app1234567890\",\n  \"tableIdOrName\": \"Table 1\",\n  \"query_parameters\": {\n    \"\
      timeZone\": \"America/Los_Angeles\",\n    \"userLocale\": \"en\",\n    \"pageSize\": 50,\n    \"maxRecords\": 200,\n\
      \    \"offset\": \"itr1234567890\",\n    \"view\": \"Grid view\",\n    \"sort\": [\n      {\n        \"field\": \"Name\"\
      ,\n        \"direction\": \"asc\"\n      }\n    ],\n    \"filterByFormula\": \"FIND('San Francisco', {City})\",\n  \
      \  \"cellFormat\": \"json\",\n    \"fields\": [\"Name\", \"Address\", \"Visited\"],\n    \"returnFieldsByFieldId\":\
      \ false,\n    \"recordMetadata\": [\"commentCount\"]\n  }\n}\n"
    output_json: "{\n  \"status_code\": 200,\n  \"data\": {\n    \"records\": [\n      {\n        \"id\": \"rec560UJdUtocSouk\"\
      ,\n        \"createdTime\": \"2022-09-12T21:03:48.000Z\",\n        \"fields\": {\n          \"Address\": \"333 Post\
      \ St\",\n          \"Name\": \"Union Square\",\n          \"Visited\": true\n        }\n      },\n      {\n        \"\
      id\": \"rec3lbPRG4aVqkeOQ\",\n        \"createdTime\": \"2022-09-12T21:03:48.000Z\",\n        \"fields\": {\n      \
      \    \"Address\": \"1 Ferry Building\",\n          \"Name\": \"Ferry Building\"\n        }\n      }\n    ],\n    \"\
      offset\": \"itr1234567891\"\n  },\n  \"message\": null,\n  \"component\": {\n    \"name\": \"AirtableListRecords\"\n\
      \  }\n}"
