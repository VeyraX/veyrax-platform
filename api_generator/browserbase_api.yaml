https://airtable.com/developers/web/api: null
https://www.airtable.com/developers/web/api/errors: null
https://www.airtable.com/developers/web/api/scopes:
- endpoint: https://airtable.com/developers/web/api/list-records
  name: List Records
  authorization: Bearer token
  examples:
    input_json: "{\n  \"base_id\": \"app123456\",\n  \"table_name\": \"Table 1\"\n}\n"
    output_json: "{\n  \"status_code\": 200,\n  \"records\": [\n    {\n      \"id\": \"rec123456\",\n      \"fields\": {\n\
      \        \"Name\": \"John Doe\",\n        \"Email\": \"john.doe@example.com\"\n      },\n      \"createdTime\": \"2023-10-01T12:00:00.000Z\"\
      \n    },\n    {\n      \"id\": \"rec789012\",\n      \"fields\": {\n        \"Name\": \"Jane Smith\",\n        \"Email\"\
      : \"jane.smith@example.com\"\n      },\n      \"createdTime\": \"2023-10-02T12:00:00.000Z\"\n    }\n  ]\n}\n"
- endpoint: https://airtable.com/developers/web/api/get-record
  name: Get Record
  authorization: Bearer token
  examples:
    input_json: "{\n  \"base_id\": \"app123456\",\n  \"table_name\": \"Table 1\",\n  \"record_id\": \"rec123456\"\n}\n"
    output_json: "{\n  \"status_code\": 200,\n  \"record\": {\n    \"id\": \"rec123456\",\n    \"fields\": {\n      \"Name\"\
      : \"John Doe\",\n      \"Email\": \"john.doe@example.com\"\n    },\n    \"createdTime\": \"2023-10-01T12:00:00.000Z\"\
      \n  }\n}\n"
- endpoint: https://airtable.com/developers/web/api/create-records
  name: Create Records
  authorization: Bearer token
  examples:
    input_json: "{\n  \"base_id\": \"app123456\",\n  \"table_name\": \"Table 1\",\n  \"records\": [\n    {\n      \"fields\"\
      : {\n        \"Name\": \"Alice Johnson\",\n        \"Email\": \"alice.johnson@example.com\"\n      }\n    }\n  ]\n}\n"
    output_json: "{\n  \"status_code\": 201,\n  \"records\": [\n    {\n      \"id\": \"rec345678\",\n      \"fields\": {\n\
      \        \"Name\": \"Alice Johnson\",\n        \"Email\": \"alice.johnson@example.com\"\n      },\n      \"createdTime\"\
      : \"2023-10-03T12:00:00.000Z\"\n    }\n  ]\n}\n"
- endpoint: https://airtable.com/developers/web/api/delete-record
  name: Delete Record
  authorization: Bearer token
  examples:
    input_json: "{\n  \"base_id\": \"app123456\",\n  \"table_name\": \"Table 1\",\n  \"record_id\": \"rec123456\"\n}\n"
    output_json: "{\n  \"status_code\": 200,\n  \"deleted\": true,\n  \"id\": \"rec123456\"\n}\n"
- endpoint: https://airtable.com/developers/web/api/update-record
  name: Update Record
  authorization: Bearer token
  examples:
    input_json: "{\n  \"base_id\": \"app123456\",\n  \"table_name\": \"Table 1\",\n  \"record_id\": \"rec123456\",\n  \"fields\"\
      : {\n    \"Email\": \"new.email@example.com\"\n  }\n}\n"
    output_json: "{\n  \"status_code\": 200,\n  \"record\": {\n    \"id\": \"rec123456\",\n    \"fields\": {\n      \"Name\"\
      : \"John Doe\",\n      \"Email\": \"new.email@example.com\"\n    },\n    \"createdTime\": \"2023-10-01T12:00:00.000Z\"\
      \n  }\n}"
