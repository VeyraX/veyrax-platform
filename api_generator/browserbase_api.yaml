https://www.airtable.com/developers/web/api/manage-user:
- endpoint: https://api.airtable.com/v0/meta/enterpriseAccounts/{enterpriseAccountId}/users/{userId}
  name: Manage User
  authorization: Bearer token
  examples:
    input_json: "{\n  \"enterpriseAccountId\": \"ent123\",\n  \"userId\": \"user456\",\n  \"email\": \"foo@bar.com\",\n  \"\
      firstName\": \"Foo\",\n  \"lastName\": \"Baz\",\n  \"state\": \"provisioned\"\n}\n"
    output_json: "{\n  \"status_code\": 204,\n  \"data\": null\n}\n"
  request_parameters:
    path:
      enterpriseAccountId: string
      userId: string
    body:
      email: optional<string>
      firstName: optional<string>
      lastName: optional<string>
      state: optional<"provisioned" | "deactivated">
  response:
    success:
      status_code: 204
      data: null
    errors:
    - status_code: 403
      error:
        message: Cannot perform action on self
        type: INVALID_PERMISSIONS
    - status_code: 403
      error:
        message: User does not belong to the enterprise email domain
        type: INVALID_PERMISSIONS
    - status_code: 403
      error:
        message: State modification is not enabled for FLA enterprise accounts
        type: INVALID_PERMISSIONS
    - status_code: 403
      error:
        message: User is not managed by the enterprise account
        type: INVALID_PERMISSIONS
    - status_code: 422
      error:
        message: Email already in use
        type: EMAIL_ALREADY_IN_USE
    - status_code: 422
      error:
        message: Target email domain not owned by this enterprise account
        type: TARGET_EMAIL_DOMAIN_NOT_OWNED_BY_ENTERPRISE
    - status_code: 422
      error:
        message: Service Account must be on verified enterprise email domain
        type: SERVICE_ACCOUNT_MUST_BE_ON_VERIFIED_DOMAIN
    - status_code: 422
      error:
        message: Cannot change email when two factor authentication is enabled
        type: CANNOT_CHANGE_EMAIL_WHILE_TWO_FACTOR_ENABLED
