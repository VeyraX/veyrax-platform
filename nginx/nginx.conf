server {
    listen 80;
    server_name veyraxapp.com www.veyraxapp.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name veyraxapp.com www.veyraxapp.com;

    client_max_body_size 50M;
    
    ssl_certificate /etc/letsencrypt/live/veyraxapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veyraxapp.com/privkey.pem;
    
    location / {
        proxy_pass http://aci_server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name flower.veyraxapp.com;
    
    ssl_certificate /etc/letsencrypt/live/veyraxapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veyraxapp.com/privkey.pem;
    
    location / {
        auth_basic "Restricted Content";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://celery_flower:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
