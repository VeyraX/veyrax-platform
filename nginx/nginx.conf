server {
    listen 80;
    server_name veyraxapp.com www.veyraxapp.com flower.veyraxapp.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

log_format response_time '$time_local | $request_method $request_uri | $status | ${request_time}s | upstream: ${upstream_response_time}s';

server {
    listen 443 ssl;
    server_name veyraxapp.com www.veyraxapp.com;

    access_log /var/log/nginx/response_time.log response_time;
    
    client_max_body_size 50M;

    underscores_in_headers on;
    
    ssl_certificate /etc/letsencrypt/live/veyraxapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veyraxapp.com/privkey.pem;
    
    location ~ ^/(docs|redoc|openapi.json)$ {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        proxy_pass http://aci_server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header VEYRAX_API_KEY $http_veyrax_api_key;
    }

    location / {
        proxy_pass http://aci_server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header VEYRAX_API_KEY $http_veyrax_api_key;
        
        proxy_connect_timeout 120s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

server {
    listen 443 ssl;
    server_name flower.veyraxapp.com;

    ssl_certificate /etc/letsencrypt/live/flower.veyraxapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flower.veyraxapp.com/privkey.pem;

    access_log /var/log/nginx/flower_response_time.log response_time;

    location / {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        proxy_pass http://REDACTED_HOST:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_connect_timeout 120s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
