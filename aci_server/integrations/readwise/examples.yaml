routes:
  - endpoint: /readwise/save
    examples:
      - scenario: "Save a new document"
        description: "Save a new article to Readwise Reader"
        input_json: |
          {
            "url": "https://example.com/article/",
            "title": "Example Article",
            "author": "John Doe",
            "summary": "A summary of the article",
            "tags": ["tag1", "tag2"]
          }
        output_json: |
          {
            "data": {
              "id": "01abcdef1234567890",
              "url": "https://read.readwise.io/new/read/01abcdef1234567890"
            },
            "component": {
              "name": "ReadwiseDocumentCard"
            }
          }

  - endpoint: /readwise/list
    examples:
      - scenario: "List documents"
        description: "List documents with optional filtering"
        input_json: |
          {
            "location": "new",
            "category": "article",
            "withHtmlContent": false
          }
        output_json: |
          {
            "data": {
              "count": 2,
              "nextPageCursor": "01gm6kjzabcd609yepjrmcgz8a",
              "results": [
                {
                  "id": "01gwfvp9pyaabcdgmx14f6ha0",
                  "url": "https://readiwise.io/feed/read/01gwfvp9pyaabcdgmx14f6ha0",
                  "source_url": "https://www.example.com/article1",
                  "title": "Example Article 1",
                  "author": "Jane Smith",
                  "source": "Reader RSS",
                  "category": "article",
                  "location": "new",
                  "tags": {},
                  "site_name": "Example Site",
                  "word_count": 819,
                  "created_at": "2023-03-26T21:02:51.618751+00:00",
                  "updated_at": "2023-03-26T21:02:55.453827+00:00",
                  "notes": "",
                  "published_date": "2023-03-22",
                  "summary": "A summary of the article...",
                  "image_url": "https://example.com/image.jpg",
                  "parent_id": null,
                  "reading_progress": 0.15
                }
              ]
            },
            "component": {
              "name": "ReadwiseDocumentListCard"
            }
          }

  - endpoint: /readwise/update
    examples:
      - scenario: "Update a document"
        description: "Update document details"
        input_json: |
          {
            "title": "Updated Title",
            "location": "later",
            "summary": "Updated summary"
          }
        output_json: |
          {
            "data": {
              "id": "01abcdef1234567890",
              "url": "https://read.readwise.io/new/read/01abcdef1234567890"
            },
            "component": {
              "name": "ReadwiseDocumentCard"
            }
          }

  - endpoint: /readwise/delete
    examples:
      - scenario: "Delete a document"
        description: "Delete a document from Readwise Reader"
        input_json: |
          {}
        output_json: |
          {
            "data": {
              "success": true,
              "message": "Document deleted successfully"
            }
          }
