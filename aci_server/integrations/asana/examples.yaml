        output_json: |
          {
            "data": {
              "items": [
                {
                  "gid": "77777",
                  "name": "Increase website traffic",
                  "due_on": "2024-12-31",
                  "status": "on_track",
                  "owner": {
                    "gid": "5555",
                    "name": "John Doe",
                    "email": "john.doe@example.com"
                  },
                  "metric": {
                    "current_number_value": 80000,
                    "target_number_value": 100000,
                    "unit": "visitors"
                  }
                }
              ],
              "offset": null
