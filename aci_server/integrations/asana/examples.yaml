                  "is_organization": true
                }
              ],
              "offset": "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9"
            },
            "component": {
              "name": "AsanaWorkspaceList"
            }
          }

  - endpoint: /asana/get_workspace
