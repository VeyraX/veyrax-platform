routes:
  - endpoint: /asana/get_tasks
    examples:
      - scenario: "Get Workspace Tasks"
        description: "Retrieve tasks from workspace with optional filtering"
        input_json: |
          {
            "workspace_id": "12345",
            "project_id": "67890",
            "assignee": "5555",
            "completed_since": "2024-01-01",
            "limit": 10,
            "offset": null
          }
        output_json: |
          {
            "data": {
              "items": [
                {
                  "gid": "1111",
                  "name": "Complete project proposal",
                  "completed": false,
                  "due_on": "2024-03-31",
                  "notes": "Include all requirements and cost estimates",
                  "assignee": {
                    "gid": "5555",
                    "name": "John Doe",
                    "email": "john.doe@example.com"
                  },
                  "workspace": {
                    "gid": "12345",
                    "name": "Marketing Team"
                  },
                  "projects": [
                    {
                      "gid": "67890",
                      "name": "Q1 Planning"
                    }
                  ]
                }
              ],
              "offset": "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9"
            },
            "component": {
              "name": "AsanaTaskList"
            }
          }

  - endpoint: /asana/get_task
    examples:
      - scenario: "Get Task Details"
        description: "Retrieve detailed information for a specific task"
        input_json: |
          {
            "task_id": "1111"
          }
        output_json: |
          {
            "data": {
              "gid": "1111",
              "name": "Complete project proposal",
              "completed": false,
              "due_on": "2024-03-31",
              "notes": "Include all requirements and cost estimates",
              "assignee": {
                "gid": "5555",
                "name": "John Doe",
                "email": "john.doe@example.com"
              },
              "workspace": {
                "gid": "12345",
                "name": "Marketing Team"
              },
              "projects": [
                {
                  "gid": "67890",
                  "name": "Q1 Planning"
                }
              ]
            },
            "component": {
              "name": "AsanaTaskDetail"
            }
          }

  - endpoint: /asana/create_task
    examples:
      - scenario: "Create New Task"
        description: "Create a new task in a project"
        input_json: |
          {
            "task": {
              "name": "Review client feedback",
              "notes": "Address all points in the latest client email",
              "due_on": "2024-03-15",
              "workspace": "12345",
              "projects": ["67890"],
              "assignee": "5555"
            }
          }
        output_json: |
          {
            "data": {
              "gid": "2222",
              "name": "Review client feedback",
              "completed": false,
              "due_on": "2024-03-15",
              "notes": "Address all points in the latest client email",
              "assignee": {
                "gid": "5555",
                "name": "John Doe",
                "email": "john.doe@example.com"
              },
              "workspace": {
                "gid": "12345",
                "name": "Marketing Team"
              },
              "projects": [
                {
                  "gid": "67890",
                  "name": "Q1 Planning"
                }
              ]
            },
            "component": {
              "name": "AsanaTaskDetail"
            }
          }

  - endpoint: /asana/update_task
    examples:
      - scenario: "Update Task Status"
        description: "Mark a task as completed"
        input_json: |
          {
            "task_id": "1111",
            "task_update": {
              "completed": true
            }
          }
        output_json: |
          {
            "data": {
              "gid": "1111",
              "name": "Complete project proposal",
              "completed": true,
              "due_on": "2023-12-31",
              "notes": "Include all requirements and cost estimates"
            },
            "component": {
              "name": "AsanaTaskDetail"
            }
          }

  - endpoint: /asana/delete_task
    examples:
      - scenario: "Delete Task"
        description: "Remove a task that is no longer needed"
        input_json: |
          {
            "task_id": "1111"
          }
        output_json: |
          {
            "data": {
              "gid": "1111"
            }
          }

  - endpoint: /asana/get_subtasks
    examples:
      - scenario: "Get Task Subtasks"
        description: "Retrieve all subtasks for a parent task"
        input_json: |
          {
            "task_id": "1111"
          }
        output_json: |
          {
            "data": {
              "items": [
                {
                  "gid": "3333",
                  "name": "Research competitors",
                  "completed": true,
                  "parent": "1111"
                },
                {
                  "gid": "4444",
                  "name": "Draft cost estimates",
                  "completed": false,
                  "parent": "1111"
                }
              ],
              "offset": null
            },
            "component": {
              "name": "AsanaTaskList"
            }
          }

  - endpoint: /asana/create_subtask
    examples:
      - scenario: "Create Subtask"
        description: "Add a subtask to an existing task"
        input_json: |
          {
            "parent_task_id": "1111",
            "subtask": {
              "name": "Prepare presentation slides",
              "notes": "Include key points and visuals",
              "due_on": "2023-12-15"
            }
          }
        output_json: |
          {
            "data": {
              "gid": "5555",
              "name": "Prepare presentation slides",
              "completed": false,
              "due_on": "2023-12-15",
              "notes": "Include key points and visuals",
              "parent": "1111"
            },
            "component": {
              "name": "AsanaTaskDetail"
            }
          }

  - endpoint: /asana/get_workspaces
    examples:
