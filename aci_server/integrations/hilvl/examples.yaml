  - endpoint: /hilvl/add_tags
    examples:
      - scenario: "Add tags to contact"
        description: "Add one or more tags to a contact"
        input_json: |
          {
            "contact_id": "contact456",
            "tags": ["vip", "follow-up", "sales-opportunity"]
          }
        output_json: |
          {
            "data": {
              "success": true,
              "tagsAdded": ["vip", "follow-up", "sales-opportunity"],
              "contact": {
                "id": "contact456",
                "tags": ["customer", "premium", "vip", "follow-up", "sales-opportunity"]
              }
            }
          }

  - endpoint: /hilvl/remove_tags
    examples:
      - scenario: "Remove tags from contact"
        description: "Remove one or more tags from a contact"
        input_json: |
          {
            "contact_id": "contact456",
            "tags": ["premium"]
          }
        output_json: |
          {
            "data": {
              "success": true,
              "tagsRemoved": ["premium"],
              "contact": {
                "id": "contact456",
                "tags": ["customer", "vip", "follow-up", "sales-opportunity"]
              }
            }
          }

