routes:
  - endpoint: /hilvl/get_business
    examples:
      - scenario: "Retrieve business details"
        description: "Get detailed information about a specific business"
        input_json: |
          {
            "business_id": "b12345"
          }
        output_json: |
          {
            "data": {
              "business": {
                "id": "b12345",
                "name": "Sample Business",
                "locationId": "loc123",
                "phone": "+12345678901",
                "email": "business@example.com"
              }
            }
          }

  - endpoint: /hilvl/get_businesses_by_location
    examples:
      - scenario: "List businesses by location"
        description: "Get all businesses associated with a specific location"
        input_json: |
          {
            "location_id": "loc123"
          }
        output_json: |
          {
            "data": {
              "businesses": [
                {
                  "id": "b12345",
                  "name": "Sample Business",
                  "locationId": "loc123",
                  "phone": "+12345678901",
                  "email": "business@example.com"
                },
                {
                  "id": "b67890",
                  "name": "Another Business",
                  "locationId": "loc123",
                  "phone": "+19876543210",
                  "email": "another@example.com"
                }
              ]
            }
          }

  - endpoint: /hilvl/create_business
    examples:
      - scenario: "Create a new business"
        description: "Create a new business with full details"
        input_json: |
          {
            "name": "New Business",
            "locationId": "loc123",
            "phone": "+12345678901",
            "email": "new@example.com",
            "website": "https://www.example.com",
            "address": "123 Main St",
            "city": "New York",
            "state": "NY",
            "postalCode": "10001",
            "country": "USA",
            "description": "This is a new business"
          }
        output_json: |
          {
            "data": {
              "success": true,
              "buiseness": {
                "id": "b54321",
                "name": "New Business",
                "locationId": "loc123",
                "phone": "+12345678901",
                "email": "new@example.com",
                "website": "https://www.example.com",
                "address": "123 Main St",
                "city": "New York",
                "state": "NY",
                "postalCode": "10001",
                "country": "USA",
                "description": "This is a new business"
              }
            }
          }

  - endpoint: /hilvl/update_business
    examples:
      - scenario: "Update business information"
        description: "Update specific fields of an existing business"
        input_json: |
          {
            "business_id": "b12345",
            "name": "Updated Business Name",
            "phone": "+19876543210",
            "email": "updated@example.com"
          }
        output_json: |
          {
            "data": {
              "success": true,
              "buiseness": {
                "id": "b12345",
                "name": "Updated Business Name",
                "locationId": "loc123",
                "phone": "+19876543210",
                "email": "updated@example.com"
              }
            }
          }

  - endpoint: /hilvl/delete_business
    examples:
      - scenario: "Delete a business"
        description: "Permanently remove a business from the system"
        input_json: |
          {
            "business_id": "b12345"
          }
        output_json: |
          {
            "data": {
              "success": true
            }
          }

  - endpoint: /hilvl/get_calendars
    examples:
      - scenario: "List calendars for location"
        description: "Get all calendars associated with a specific location"
        input_json: |
          {
            "location_id": "loc123",
            "show_drafted": true
          }
        output_json: |
          {
            "data": {
              "calendars": [
                {
                  "id": "cal123",
                  "name": "Sales Team Calendar",
                  "description": "Calendar for scheduling sales team meetings",
                  "locationId": "loc123",
                  "isActive": true,
                  "slotDuration": 30,
                  "slotDurationUnit": "mins",
                  "eventColor": "#039be5",
                  "appoinmentPerSlot": 1,
                  "autoConfirm": true
                },
                {
                  "id": "cal456",
                  "name": "Customer Support Calendar",
                  "description": "Calendar for scheduling customer support calls",
                  "locationId": "loc123",
                  "isActive": true,
                  "slotDuration": 60,
                  "slotDurationUnit": "mins",
                  "eventColor": "#4caf50",
                  "appoinmentPerSlot": 1,
                  "autoConfirm": true
                }
              ]
            }
          }

  - endpoint: /hilvl/get_calendar
    examples:
      - scenario: "Retrieve calendar details"
        description: "Get detailed information about a specific calendar"
        input_json: |
          {
            "calendar_id": "cal123"
          }
        output_json: |
          {
            "data": {
              "calendar": {
                "id": "cal123",
                "name": "Sales Team Calendar",
                "description": "Calendar for scheduling sales team meetings",
                "locationId": "loc123",
                "isActive": true,
                "eventColor": "#039be5",
                "slotDuration": 30,
                "slotDurationUnit": "mins",
                "slotInterval": 30,
                "slotIntervalUnit": "mins",
                "appoinmentPerSlot": 1,
                "openHours": [
                  {
                    "daysOfTheWeek": [1, 2, 3, 4, 5],
                    "hours": [
                      {
                        "openHour": 9,
                        "openMinute": 0,
                        "closeHour": 17,
                        "closeMinute": 0
                      }
                    ]
                  }
                ],
                "autoConfirm": true,
                "allowReschedule": true,
                "allowCancellation": true
              }
            }
          }

  - endpoint: /hilvl/create_calendar
    examples:
      - scenario: "Create a new calendar"
        description: "Create a new calendar with availability settings"
        input_json: |
          {
            "name": "Marketing Team Calendar",
            "locationId": "loc123",
            "description": "Calendar for scheduling marketing team meetings",
            "slotDuration": 45,
            "slotDurationUnit": "mins",
            "eventColor": "#ff9800",
            "openHours": [
              {
                "daysOfTheWeek": [1, 2, 3, 4, 5],
                "hours": [
                  {
                    "openHour": 9,
                    "openMinute": 0,
                    "closeHour": 17,
                    "closeMinute": 0
                  }
                ]
              }
            ],
            "autoConfirm": true,
            "allowReschedule": true,
            "allowCancellation": true
          }
        output_json: |
          {
            "data": {
              "success": true,
              "calendar": {
                "id": "cal789",
                "name": "Marketing Team Calendar",
                "locationId": "loc123",
                "description": "Calendar for scheduling marketing team meetings",
                "isActive": true,
                "slotDuration": 45,
                "slotDurationUnit": "mins",
                "eventColor": "#ff9800",
                "openHours": [
                  {
                    "daysOfTheWeek": [1, 2, 3, 4, 5],
                    "hours": [
                      {
                        "openHour": 9,
                        "openMinute": 0,
                        "closeHour": 17,
                        "closeMinute": 0
                      }
                    ]
                  }
                ],
                "autoConfirm": true,
                "allowReschedule": true,
                "allowCancellation": true
              }
            }
          }

  - endpoint: /hilvl/update_calendar
    examples:
      - scenario: "Update calendar settings"
        description: "Update settings for an existing calendar"
        input_json: |
          {
            "calendar_id": "cal123",
            "name": "Updated Sales Calendar",
            "description": "Updated description for the sales calendar",
            "slotDuration": 60,
            "eventColor": "#673ab7"
          }
        output_json: |
          {
            "data": {
              "success": true,
              "calendar": {
                "id": "cal123",
                "name": "Updated Sales Calendar",
                "description": "Updated description for the sales calendar",
                "locationId": "loc123",
                "isActive": true,
                "slotDuration": 60,
                "slotDurationUnit": "mins",
                "eventColor": "#673ab7",
                "autoConfirm": true
              }
            }
          }

  - endpoint: /hilvl/delete_calendar
    examples:
      - scenario: "Delete a calendar"
        description: "Permanently remove a calendar from the system"
        input_json: |
          {
            "calendar_id": "cal123"
          }
        output_json: |
          {
            "data": {
              "success": true
            }
          }

  - endpoint: /hilvl/get_free_slots
    examples:
      - scenario: "Get available time slots"
        description: "Get all available time slots for a calendar within a date range"
        input_json: |
          {
            "calendar_id": "cal123",
            "start_date": "2023-06-01",
            "end_date": "2023-06-07",
            "timezone": "America/New_York"
          }
        output_json: |
          {
            "data": {
              "_dates_": {
                "slots": [
                  "2023-06-01T09:00:00-04:00",
                  "2023-06-01T09:30:00-04:00",
                  "2023-06-01T10:00:00-04:00",
                  "2023-06-01T10:30:00-04:00",
                  "2023-06-01T11:00:00-04:00",
                  "2023-06-02T14:00:00-04:00",
                  "2023-06-02T14:30:00-04:00",
                  "2023-06-02T15:00:00-04:00",
                  "2023-06-05T13:00:00-04:00",
                  "2023-06-05T13:30:00-04:00"
                ]
              }
            }
          }

  - endpoint: /hilvl/create_block_slot
    examples:
      - scenario: "Block calendar time slot"
        description: "Block a time slot on a calendar to prevent scheduling"
        input_json: |
          {
            "locationId": "loc123",
            "title": "Team Meeting",
            "startTime": "2023-06-01T10:00:00-04:00",
            "endTime": "2023-06-01T11:30:00-04:00",
            "calendarId": "cal123"
          }
        output_json: |
          {
            "data": {
              "slot": {
                "id": "block123",
                "locationId": "loc123",
                "title": "Team Meeting",
                "startTime": "2023-06-01T10:00:00-04:00",
                "endTime": "2023-06-01T11:30:00-04:00",
                "calendarId": "cal123"
              }
            }
          }

  - endpoint: /hilvl/get_contact
