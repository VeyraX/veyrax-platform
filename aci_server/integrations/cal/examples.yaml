routes:
  - endpoint: /cal/get_bookings
    examples:
      - scenario: "Get upcoming bookings"
        description: "Get a list of upcoming bookings with filters"
        input_json: |
          {
            "status": "upcoming",
            "take": 5,
            "sortStart": "asc"
          }
        output_json: |
          {
            "data": {
              "bookings": [
                {
                  "id": 123,
                  "uid": "booking_uid_123",
                  "title": "Consultation",
                  "description": "Learn how to integrate scheduling into marketplace.",
                  "hosts": [
                    {
                      "id": 1,
                      "name": "Jane Doe",
                      "email": "jane@example.com",
                      "username": "jane",
                      "timeZone": "America/Los_Angeles"
                    }
                  ],
                  "status": "accepted",
                  "start": "2024-08-13T15:30:00Z",
                  "end": "2024-08-13T16:30:00Z",
                  "duration": 60,
                  "eventTypeId": 50,
                  "eventType": {
                    "id": 1,
                    "slug": "consultation"
                  },
                  "createdAt": "2024-08-01T15:30:00Z",
                  "updatedAt": "2024-08-01T15:30:00Z",
                  "attendees": [
                    {
                      "name": "John Doe",
                      "email": "john.doe@example.com",
                      "timeZone": "America/New_York"
                    }
                  ]
                }
              ]
            },
            "component": {
              "name": "CalBookingList"
            }
          }

