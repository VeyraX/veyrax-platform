  - endpoint: /cal/update_schedule
    examples:
      - scenario: "Update a schedule"
        description: "Modify an existing schedule"
        input_json: |
          {
            "scheduleId": 254,
            "name": "One-on-one coaching",
            "timeZone": "Europe/Rome",
            "availability": [
              {
                "days": [
                  "Monday",
                  "Tuesday"
                ],
                "startTime": "09:00",
                "endTime": "10:00"
              }
            ],
            "isDefault": true,
            "overrides": [
              {
                "date": "2024-05-20",
                "startTime": "12:00",
                "endTime": "14:00"
              }
            ]
          }
        output_json: |
          {
            "data": {
              "id": 254,
              "ownerId": 478,
              "name": "One-on-one coaching",
              "timeZone": "Europe/Rome",
              "availability": [
                {
                  "days": [
                    "Monday",
                    "Tuesday"
                  ],
                  "startTime": "09:00",
                  "endTime": "10:00"
                }
              ],
              "isDefault": true,
              "overrides": [
