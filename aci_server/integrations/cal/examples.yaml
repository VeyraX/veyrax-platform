  - endpoint: /cal/get_profile
    examples:
      - scenario: "Get user profile"
        description: "Get details about the authenticated user"
        input_json: |
          {}
        output_json: |
          {
            "data": {
              "id": 123,
              "username": "jane",
              "email": "jane@example.com",
              "timeFormat": 12,
              "defaultScheduleId": 456,
              "weekStart": "Monday",
              "timeZone": "America/Los_Angeles",
              "organizationId": 789,
              "organization": {
                "isPlatform": true,
                "id": 789
              }
            },
            "component": {
              "name": "CalUserProfile"
            }
          }

  - endpoint: /cal/get_schedules
    examples:
      - scenario: "Get all schedules"
        description: "Get a list of all schedules for the authenticated user"
        input_json: |
          {}
        output_json: |
          {
            "data": {
              "schedules": [
                {
                  "id": 254,
                  "ownerId": 478,
                  "name": "Catch up hours",
