      - scenario: "Invalid City Name"
        description: "Attempts to retrieve weather forecast for a non-existent city"
        input_json: |
          {
            "city": "NonExistentCity",
            "country": "XY"
          }
        output_json: |
          {
            "status_code": 404,
            "data": null,
            "message": "City 'NonExistentCity' not found in country 'XY'",
            "component": null
          }

