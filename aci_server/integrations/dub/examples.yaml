            "component": {
              "name": "DubLinksCard"
            }
          }

  - endpoint: /dub/bulk_update_links
    examples:
      - scenario: "Bulk Update Links"
        description: "Updates multiple short links with the same data in a single request"
        input_json: |
          {
            "data": {
              "title": "Updated Title",
              "description": "Updated description for all links"
            },
            "linkIds": [
              "clk1abcde000tmlj9123456",
              "clk1fghij000tmlj9789012"
            ]
          }
        output_json: |
          {
            "data": {
              "items": [
                {
                  "id": "clk1abcde000tmlj9123456",
                  "domain": "dub.sh",
                  "key": "page1",
                  "url": "https://example.com/page1",
                  "title": "Updated Title",
                  "description": "Updated description for all links",
                  "shortLink": "dub.sh/page1",
                  "updatedAt": "2023-08-05T12:33:44Z"
                },
                {
                  "id": "clk1fghij000tmlj9789012",
                  "domain": "dub.sh",
                  "key": "page2",
                  "url": "https://example.com/page2",
                  "title": "Updated Title",
                  "description": "Updated description for all links",
                  "shortLink": "dub.sh/page2",
                  "updatedAt": "2023-08-05T12:33:44Z"
                }
              ]
            },
            "component": {
              "name": "DubLinksCard"
            }
          }

  - endpoint: /dub/bulk_delete_links
