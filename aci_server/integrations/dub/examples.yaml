        output_json: |
          {
            "data": {
              "success": true,
              "click_id": "clk5abcde000zzz123456",
              "customer_id": "cust_jd123456"
            },
            "component": {
              "name": "DubTrackingResult"
            }
          }

  - endpoint: /dub/track_sale
    examples:
      - scenario: "Track Sale Conversion"
        description: "Tracks a sale conversion with revenue information"
        input_json: |
          {
            "eventName": "purchase",
