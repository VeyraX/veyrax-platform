routes:
  - endpoint: /dub/create_link
    examples:
      - scenario: "Create a Short Link"
        description: "Creates a new short link with a destination URL"
        input_json: |
          {
            "url": "https://example.com/very/long/path/to/resource",
            "domain": "dub.sh",
            "key": "example-page",
            "title": "Example Page",
            "description": "This is an example page"
          }
        output_json: |
          {
            "data": {
              "id": "clj8xesfd000tmlj9cba9b3k8",
              "domain": "dub.sh",
              "key": "example-page",
              "url": "https://example.com/very/long/path/to/resource",
              "title": "Example Page",
              "description": "This is an example page",
              "shortLink": "dub.sh/example-page",
              "clicks": 0,
              "createdAt": "2023-08-01T12:30:45Z",
              "updatedAt": "2023-08-01T12:30:45Z"
            },
            "component": {
              "name": "DubLinkCard"
            }
          }

  - endpoint: /dub/update_link
    examples:
      - scenario: "Update an Existing Link"
        description: "Updates the properties of an existing short link"
        input_json: |
          {
            "link_id": "clj8xesfd000tmlj9cba9b3k8",
            "url": "https://example.com/updated/path",
            "title": "Updated Example Page",
            "description": "This is an updated example page"
          }
        output_json: |
          {
            "data": {
              "id": "clj8xesfd000tmlj9cba9b3k8",
              "domain": "dub.sh",
              "key": "example-page",
              "url": "https://example.com/updated/path",
              "title": "Updated Example Page",
              "description": "This is an updated example page",
              "shortLink": "dub.sh/example-page",
              "clicks": 5,
              "createdAt": "2023-08-01T12:30:45Z",
              "updatedAt": "2023-08-02T15:45:22Z"
            },
            "component": {
              "name": "DubLinkCard"
            }
          }

  - endpoint: /dub/upsert_link
    examples:
      - scenario: "Create or Update a Link"
        description: "Creates a new link or updates an existing one with the same key"
        input_json: |
          {
            "domain": "dub.sh",
            "key": "upsert-example",
            "url": "https://example.com/upsert/example"
          }
        output_json: |
          {
            "data": {
              "id": "clj8xesfd000tmlj9cxyz123",
              "domain": "dub.sh",
              "key": "upsert-example",
              "url": "https://example.com/upsert/example",
              "shortLink": "dub.sh/upsert-example",
              "clicks": 0,
              "createdAt": "2023-08-03T10:15:30Z",
              "updatedAt": "2023-08-03T10:15:30Z"
            },
            "component": {
              "name": "DubLinkCard"
            }
          }

  - endpoint: /dub/delete_link
    examples:
      - scenario: "Delete a Link"
        description: "Deletes an existing short link"
        input_json: |
          {
            "link_id": "clj8xesfd000tmlj9cba9b3k8"
          }
        output_json: |
          {
            "data": {
              "id": "clj8xesfd000tmlj9cba9b3k8",
              "domain": "dub.sh",
              "key": "example-page",
              "url": "https://example.com/updated/path",
              "shortLink": "dub.sh/example-page"
            },
            "component": {
              "name": "DubLinkCard"
            }
          }

  - endpoint: /dub/get_link
    examples:
      - scenario: "Get Link Information"
        description: "Retrieves information about a specific short link"
        input_json: |
