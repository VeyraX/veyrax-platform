      - scenario: "Track Lead Conversion"
        description: "Tracks a lead conversion from a link click"
        input_json: |
          {
            "click": {
              "id": "clk5abcde000zzz123456"
            },
            "customer": {
              "name": "John Doe",
              "email": "john.doe@example.com",
              "avatar": "https://example.com/avatars/johndoe.jpg",
              "externalId": "cust_123456"
