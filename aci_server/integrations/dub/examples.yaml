  - endpoint: /dub/bulk_create_links
    examples:
      - scenario: "Bulk Create Links"
        description: "Creates multiple short links in a single request"
        input_json: |
          {
            "links": [
              {
                "url": "https://example.com/page1",
                "domain": "dub.sh",
                "key": "page1"
              },
              {
                "url": "https://example.com/page2",
                "domain": "dub.sh",
                "key": "page2"
              }
            ]
          }
        output_json: |
          {
            "data": {
              "items": [
                {
                  "id": "clk1abcde000tmlj9123456",
                  "domain": "dub.sh",
                  "key": "page1",
                  "url": "https://example.com/page1",
                  "shortLink": "dub.sh/page1",
                  "createdAt": "2023-08-05T11:22:33Z"
                },
                {
                  "id": "clk1fghij000tmlj9789012",
                  "domain": "dub.sh",
                  "key": "page2",
                  "url": "https://example.com/page2",
                  "shortLink": "dub.sh/page2",
                  "createdAt": "2023-08-05T11:22:33Z"
                }
              ]
