routes:
  - endpoint: /docusign/create_envelope
    examples:
      - scenario: "Create and Send Document for Email Signing"
        description: "Create an envelope that will be sent via email for signing"
        input_json: |
          {
            "documents": [
              {
                "document_base64": "",
                "name": "Example Document",
                "file_extension": "pdf"
              }
            ],
            "signers": [
              {
                "email": "signer@example.com",
                "name": "John Doe",
                "routing_order": 1
              }
            ],
            "email_subject": "Please sign this document",
            "email_body": "Please review and sign the attached document"
          }
        output_json: |
          {
            "data": {
              "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p",
              "status": "sent",
              "created_datetime": "2024-04-02T10:00:00Z"
            }
          }
      
      - scenario: "Create Envelope for Embedded Signing"
        description: "Create an envelope for embedded signing (no email sent, requires create_view call)"
        input_json: |
          {
            "documents": [
              {
                "document_content": "AGREEMENT\n\nThis agreement is made on April 2, 2024\n\nBetween:\nCompany X ('the Company')\n\nAnd:\nJohn Doe ('the Signatory')\n\n1. Purpose\nThis is a test document.\n\n2. Signature\n\n_________________\nJohn Doe\nDate: _____________",
                "name": "Agreement.txt",
                "file_extension": "txt"
              }
            ],
            "signers": [
              {
                "email": "signer@example.com",
                "name": "John Doe",
                "routing_order": 1,
                "client_user_id": "1"
              }
            ],
            "email_subject": "Please sign this document",
            "email_body": "Please review and sign the document"
          }
        output_json: |
          {
            "data": {
              "envelope_id": "2b3c4d5e-6f7g-8h9i-0j1k-2l3m4n5o6p7q",
              "status": "sent",
              "created_datetime": "2024-04-02T10:00:00Z"
            }
          }

  - endpoint: /docusign/get_envelope
    examples:
      - scenario: "Get Envelope Status"
        description: "Retrieve the status of a sent envelope"
        input_json: |
          {
            "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p"
          }
        output_json: |
          {
            "data": {
              "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p",
              "status": "completed",
              "created_datetime": "2024-04-02T10:00:00Z",
              "sent_datetime": "2024-04-02T10:00:05Z",
              "completed_datetime": "2024-04-02T11:30:00Z"
            }
          }

  - endpoint: /docusign/get_document
    examples:
      - scenario: "Download Signed Document as Base64"
        description: "Download a signed document from an envelope in base64 format"
        input_json: |
          {
            "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p",
            "document_id": "1",
            "return_format": "base64"
          }
        output_json: |
          {
            "data": {
              "document_base64": "JVBERi0xLjcKCjEgMCBvYmogICUgZW50...",
              "name": "document_1.pdf",
              "file_extension": "pdf",
              "document_id": "1"
            }
          }

      - scenario: "Download Signed Document as Text"
        description: "Download a signed document from an envelope in text format (if possible)"
        input_json: |
          {
            "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p",
            "document_id": "1",
            "return_format": "text"
          }
        output_json: |
          {
            "data": {
              "document_content": "AGREEMENT\n\nThis agreement is made...",
              "name": "document_1.pdf",
              "file_extension": "pdf",
              "document_id": "1"
            }
          }

  - endpoint: /docusign/create_view
    examples:
      - scenario: "Get Embedded Signing URL"
        description: "Get a URL for embedded signing experience (requires envelope created with client_user_id)"
        input_json: |
          {
            "envelope_id": "2b3c4d5e-6f7g-8h9i-0j1k-2l3m4n5o6p7q",
            "return_url": "https://example.com/after-signing",
            "email": "signer@example.com",
            "name": "John Doe",
            "client_user_id": "1"
          }
        output_json: |
          {
            "data": {
              "url": "https://demo.docusign.net/signing/xyz123..."
            }
          }

  - endpoint: /docusign/get_form
    examples:
      - scenario: "Get Form Data"
        description: "Retrieve form data from a completed envelope"
        input_json: |
          {
            "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p"
          }
        output_json: |
          {
            "data": {
              "form_data": {
                "formData": [
                  {
                    "name": "signature_1",
                    "value": "John Doe",
                    "originalValue": "John Doe"
                  },
                  {
                    "name": "date_signed",
                    "value": "2024-04-02",
                    "originalValue": "2024-04-02"
                  }
                ]
              }
            }
          }

  - endpoint: /docusign/get_me
    examples:
      - scenario: "Get User Information"
        description: "Retrieve current user's DocuSign account information"
        input_json: |
          {}
        output_json: |
          {
            "data": {
              "sub": "564f7988-0823-4848-b5ea-2bc6f98cbcef",
              "name": "John Doe",
              "given_name": "John",
              "family_name": "Doe",
              "email": "john.doe@example.com",
              "accounts": [
                {
                  "account_id": "12345678-1234-1234-1234-123456789012",
                  "is_default": true,
                  "account_name": "John Doe's Account",
                  "base_uri": "https://demo.docusign.net/restapi/v2.1"
                }
              ]
            }
          }

  - endpoint: /docusign/get_envelopes
    examples:
      - scenario: "Get All Envelopes"
        description: "Get list of all envelopes without filters"
        input_json: |
          {}
        output_json: |
          {
            "data": {
              "envelopes": [
                {
                  "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p",
                  "status": "completed",
                  "created_datetime": "2024-04-02T10:00:00Z",
                  "sent_datetime": "2024-04-02T10:00:05Z",
                  "completed_datetime": "2024-04-02T11:30:00Z"
                },
                {
                  "envelope_id": "2b3c4d5e-6f7g-8h9i-0j1k-2l3m4n5o6p7q",
                  "status": "sent",
                  "created_datetime": "2024-04-02T12:00:00Z",
                  "sent_datetime": "2024-04-02T12:00:05Z"
                }
              ]
            }
          }

      - scenario: "Get Filtered Envelopes"
        description: "Get envelopes filtered by date and status"
        input_json: |
          {
            "from_date": "2024-04-01",
            "status": "completed"
          }
        output_json: |
          {
            "data": {
              "envelopes": [
                {
                  "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p",
                  "status": "completed",
                  "created_datetime": "2024-04-02T10:00:00Z",
                  "sent_datetime": "2024-04-02T10:00:05Z",
                  "completed_datetime": "2024-04-02T11:30:00Z"
                }
              ]
            }
          }

      - scenario: "Get All Recent Envelopes"
        description: "Get list of all envelopes from the last 30 days"
        input_json: |
          {
            "from_date": "2024-03-01T00:00:00Z"
          }
        output_json: |
          {
            "data": {
              "envelopes": [
                {
                  "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p",
                  "status": "completed",
                  "created_datetime": "2024-03-15T10:00:00Z",
                  "sent_datetime": "2024-03-15T10:00:05Z",
                  "completed_datetime": "2024-03-15T11:30:00Z"
                },
                {
                  "envelope_id": "2b3c4d5e-6f7g-8h9i-0j1k-2l3m4n5o6p7q",
                  "status": "sent",
                  "created_datetime": "2024-03-20T12:00:00Z",
                  "sent_datetime": "2024-03-20T12:00:05Z"
                }
              ]
            }
          }

      - scenario: "Get Filtered Envelopes by Status"
        description: "Get completed envelopes from a specific date"
        input_json: |
          {
            "from_date": "2024-03-01T00:00:00Z",
            "status": "completed"
          }
        output_json: |
          {
            "data": {
              "envelopes": [
                {
                  "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p",
                  "status": "completed",
                  "created_datetime": "2024-03-15T10:00:00Z",
                  "sent_datetime": "2024-03-15T10:00:05Z",
                  "completed_datetime": "2024-03-15T11:30:00Z"
                }
              ]
            }
          }

      - scenario: "Get Specific Envelopes by IDs"
        description: "Get envelopes by their IDs"
        input_json: |
          {
            "from_date": "2024-03-01T00:00:00Z",
            "envelope_ids": [
              "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p",
              "2b3c4d5e-6f7g-8h9i-0j1k-2l3m4n5o6p7q"
            ]
          }
        output_json: |
          {
            "data": {
              "envelopes": [
                {
                  "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p",
                  "status": "completed",
                  "created_datetime": "2024-03-15T10:00:00Z",
                  "sent_datetime": "2024-03-15T10:00:05Z",
                  "completed_datetime": "2024-03-15T11:30:00Z"
                },
                {
                  "envelope_id": "2b3c4d5e-6f7g-8h9i-0j1k-2l3m4n5o6p7q",
                  "status": "sent",
                  "created_datetime": "2024-03-20T12:00:00Z",
                  "sent_datetime": "2024-03-20T12:00:05Z"
                }
              ]
            }
          }
