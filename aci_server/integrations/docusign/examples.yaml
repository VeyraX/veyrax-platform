routes:
  - endpoint: /docusign/create_envelope
    examples:
      - scenario: "Create and Send Document for Signing"
        description: "Create an envelope with a document and send it for signing"
        input_json: |
          {
            "documents": [
              {
                "document_base64": "",
                "name": "Example Document",
                "file_extension": "pdf"
              }
            ],
            "signers": [
              {
                "email": "signer@example.com",
                "name": "John Doe",
                "routing_order": 1
              }
            ],
            "email_subject": "Please sign this document",
            "email_body": "Please review and sign the attached document"
          }
        output_json: |
          {
            "data": {
              "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p",
              "status": "sent",
              "created_datetime": "2024-04-02T10:00:00Z"
            }
          }

  - endpoint: /docusign/get_envelope
    examples:
      - scenario: "Get Envelope Status"
        description: "Retrieve the status of a sent envelope"
        input_json: |
          {
            "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p"
          }
        output_json: |
          {
            "data": {
              "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p",
              "status": "completed",
              "created_datetime": "2024-04-02T10:00:00Z",
              "sent_datetime": "2024-04-02T10:00:05Z",
              "completed_datetime": "2024-04-02T11:30:00Z"
            }
          }

  - endpoint: /docusign/get_document
    examples:
      - scenario: "Download Signed Document"
        description: "Download a signed document from an envelope"
        input_json: |
          {
            "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p",
            "document_id": "1"
          }
        output_json: |
          {
            "data": {
              "document_base64": "JVBERi0xLjcKCjEgMCBvYmogICUgZW50...",
              "name": "document_1.pdf",
              "file_extension": "pdf",
              "document_id": "1"
            }
          }

  - endpoint: /docusign/create_view
    examples:
      - scenario: "Get Embedded Signing URL"
        description: "Get a URL for embedded signing experience"
        input_json: |
          {
            "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p",
            "return_url": "https://example.com/after-signing",
            "email": "signer@example.com",
            "name": "John Doe"
          }
        output_json: |
          {
            "data": {
              "url": "https://demo.docusign.net/signing/xyz123..."
            }
          }

  - endpoint: /docusign/get_form
    examples:
      - scenario: "Get Form Data"
        description: "Retrieve form data from a completed envelope"
        input_json: |
          {
            "envelope_id": "1a2b3c4d-5e6f-7g8h-9i0j-1k2l3m4n5o6p"
          }
        output_json: |
          {
            "data": {
              "form_data": {
                "formData": [
                  {
                    "name": "signature_1",
                    "value": "John Doe",
                    "originalValue": "John Doe"
                  },
                  {
                    "name": "date_signed",
                    "value": "2024-04-02",
                    "originalValue": "2024-04-02"
                  }
                ]
              }
            }
          }

  - endpoint: /docusign/get_me
    examples:
      - scenario: "Get User Information"
        description: "Retrieve current user's DocuSign account information"
        input_json: |
          {}
        output_json: |
          {
            "data": {
              "sub": "564f7988-0823-4848-b5ea-2bc6f98cbcef",
              "name": "John Doe",
              "given_name": "John",
              "family_name": "Doe",
              "email": "john.doe@example.com",
              "accounts": [
                {
                  "account_id": "12345678-1234-1234-1234-123456789012",
                  "is_default": true,
                  "account_name": "John Doe's Account",
                  "base_uri": "https://demo.docusign.net/restapi/v2.1"
                }
              ]
            }
          }
