routes:
  - endpoint: /figma/get_file
    examples:
      - scenario: "Get Figma File"
        description: "Retrieve a complete Figma file with all its contents"
        input_json: |
          {
            "file_key": "FP8DuLSYjG9AoQBJcGYJD5"
          }
        output_json: |
          {
            "data": {
              "key": "FP8DuLSYjG9AoQBJcGYJD5",
              "name": "Design System",
              "thumbnail_url": "https://s3-alpha.figma.com/thumbnails/12345-abcdef.png",
              "last_modified": "2024-03-15T10:30:00Z",
              "version": "123456789",
              "document": {
                "id": "0:1",
                "name": "Document",
                "type": "DOCUMENT",
                "children": [
                  {
                    "id": "1:2",
                    "name": "Page 1",
                    "type": "CANVAS"
                  }
                ]
              }
            },
            "component": {
              "name": "FigmaFileDetail"
            }
          }

  - endpoint: /figma/get_file_nodes
    examples:
      - scenario: "Get Specific Nodes"
        description: "Retrieve specific nodes from a Figma file"
        input_json: |
          {
            "file_key": "FP8DuLSYjG9AoQBJcGYJD5",
            "node_ids": ["1:2", "1:3"]
          }
        output_json: |
          {
            "data": {
              "nodes": {
                "1:2": {
                  "document": {
                    "id": "1:2",
                    "name": "Button Component",
                    "type": "COMPONENT",
                    "absoluteBoundingBox": {
                      "x": 0,
                      "y": 0,
                      "width": 200,
                      "height": 50
                    }
                  }
                },
                "1:3": {
                  "document": {
                    "id": "1:3",
                    "name": "Card Component",
                    "type": "COMPONENT",
                    "absoluteBoundingBox": {
                      "x": 0,
                      "y": 100,
                      "width": 300,
                      "height": 200
                    }
                  }
                }
              }
            },
            "component": {
              "name": "FigmaNodeList"
            }
          }

  - endpoint: /figma/get_image
    examples:
      - scenario: "Export Node as Image"
        description: "Export specific nodes as images"
        input_json: |
          {
            "file_key": "FP8DuLSYjG9AoQBJcGYJD5",
            "node_ids": ["1:2"],
            "format": "png",
            "scale": 2
          }
        output_json: |
          {
            "data": {
              "1:2": "https://s3-alpha.figma.com/img/1234/5678/abcdef1234567890.png"
            },
            "component": {
              "name": "FigmaImageList"
            }
          }

