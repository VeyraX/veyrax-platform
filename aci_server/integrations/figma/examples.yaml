  - endpoint: /figma/get_all_nodes
    examples:
      - scenario: "Get All Nodes"
        description: "Retrieve all nodes from a Figma file by recursively traversing the document structure"
        input_json: |
          {
            "file_key": "FP8DuLSYjG9AoQBJcGYJD5"
          }
        output_json: |
          {
            "data": {
              "nodes": {
                "0:1": {
                  "document": {
                    "id": "0:1",
                    "name": "Document",
                    "type": "DOCUMENT",
                    "children": [
                      {
                        "id": "1:2",
                        "name": "Page 1",
                        "type": "CANVAS"
                      }
                    ]
                  }
                },
                "1:2": {
                  "document": {
                    "id": "1:2",
                    "name": "Page 1",
                    "type": "CANVAS",
                    "children": [
                      {
                        "id": "2:3",
                        "name": "Frame 1",
                        "type": "FRAME"
                      }
                    ]
                  }
                },
                "2:3": {
                  "document": {
                    "id": "2:3",
                    "name": "Frame 1",
                    "type": "FRAME",
                    "absoluteBoundingBox": {
                      "x": 0,
                      "y": 0,
                      "width": 400,
                      "height": 300
                    },
                    "children": [
                      {
                        "id": "3:4",
                        "name": "Text",
                        "type": "TEXT"
                      },
                      {
                        "id": "3:5",
                        "name": "Rectangle",
                        "type": "RECTANGLE"
                      }
                    ]
                  }
                },
                "3:4": {
                  "document": {
                    "id": "3:4",
                    "name": "Text",
                    "type": "TEXT",
                    "characters": "Hello World",
                    "style": {
                      "fontFamily": "Inter",
                      "fontSize": 24,
                      "fontWeight": 400
                    },
                    "absoluteBoundingBox": {
                      "x": 20,
                      "y": 20,
                      "width": 120,
                      "height": 30
                    }
                  }
                },
                "3:5": {
                  "document": {
                    "id": "3:5",
                    "name": "Rectangle",
                    "type": "RECTANGLE",
                    "absoluteBoundingBox": {
                      "x": 20,
                      "y": 60,
                      "width": 200,
                      "height": 100
                    },
                    "fills": [
                      {
                        "type": "SOLID",
                        "color": {
                          "r": 0.2,
                          "g": 0.4,
                          "b": 0.8,
                          "a": 1
                        }
                      }
                    ]
                  }
                }
              }
            },
            "component": {
              "name": "FigmaNodeList"
            }
          }

