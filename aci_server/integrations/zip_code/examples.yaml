routes:
  - endpoint: /zip_code/get_by_zipcode
    examples:
      - scenario: "US Zip Code"
        description: "Get information for Beverly Hills, CA"
        input_json: |
          {
            "country": "US",
            "postal_code": "90210"
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "post code": "90210",
              "country": "United States",
              "country abbreviation": "US",
              "places": [
                {
                  "place name": "Beverly Hills",
                  "longitude": "-118.4065",
                  "state": "California",
                  "state abbreviation": "CA",
                  "latitude": "34.0901"
                }
              ]
            },
            "message": null,
            "component": {
              "name": "ZipCodeResponseView"
            }
          }

      - scenario: "Canadian Postal Code"
        description: "Get information for a Canadian postal code"
        input_json: |
          {
            "country": "CA",
            "postal_code": "M5S"
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "post code": "M5S",
              "country": "Canada",
              "country abbreviation": "CA",
              "places": [
                {
                  "place name": "Central Toronto (University of Toronto)",
                  "longitude": "-79.3956",
                  "state": "Ontario",
                  "state abbreviation": "ON",
                  "latitude": "43.6629"
                }
              ]
            },
            "message": null,
            "component": {
              "name": "ZipCodeResponseView"
            }
          }

