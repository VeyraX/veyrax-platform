              "post code": "02178",
              "country": "United States", 
              "country abbreviation": "US",
              "places": [
                {
                  "place name": "Belmont",
                  "longitude": "-71.1785",
                  "state": "Massachusetts",
                  "state abbreviation": "MA",
                  "latitude": "42.3976"
                }
              ]
            },
            "message": null,
            "component": {
