        description: "Get information for a German postal code"
        input_json: |
          {
            "country": "DE",
            "postal_code": "10115"
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "post code": "10115",
              "country": "Germany",
              "country abbreviation": "DE",
              "places": [
                {
                  "place name": "Berlin",
                  "longitude": "13.3833",
                  "state": "Berlin",
                  "state abbreviation": "BE",
                  "latitude": "52.5167"
                }
              ]
            },
            "message": null,
            "component": {
              "name": "ZipCodeResponseView"
            }
          }

