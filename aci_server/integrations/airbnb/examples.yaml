routes:
  - endpoint: "/airbnb/search"
    examples:
      - scenario: "Search for listings in New York"
        description: "Search for Airbnb listings in New York City for 2 adults"
        input_json: |
          {
            "location": "New York, NY",
            "checkin": "2023-07-15",
            "checkout": "2023-07-20",
            "adults": 2,
            "children": 0,
            "infants": 0,
            "pets": 0,
            "min_price": 100,
            "max_price": 300
          }
        output_json: |
          {
            "data": {
              "search_url": "https://www.airbnb.com/s/New%20York%2C%20NY/homes?checkin=2023-07-15&checkout=2023-07-20&adults=2&price_min=100&price_max=300",
              "listings": [
                {
                  "id": "12345678",
                  "name": "Cozy Apartment in Manhattan",
                  "title": "Cozy Apartment in Manhattan",
                  "url": "https://www.airbnb.com/rooms/12345678",
                  "coordinate": {
                    "latitude": 40.7128,
                    "longitude": -74.0060
                  },
                  "structured_content": {
                    "primaryLine": {
                      "body": "Entire apartment"
                    },
                    "secondaryLine": {
                      "body": "2 beds"
                    }
                  },
                  "avg_rating": "4.85 out of 5 stars",
                  "price_info": {
                    "primaryLine": {
                      "accessibilityLabel": "$250 per night"
                    },
                    "secondaryLine": {
                      "accessibilityLabel": "$1,250 total"
                    }
                  }
                },
                {
                  "id": "87654321",
                  "name": "Modern Loft in Brooklyn",
                  "title": "Modern Loft in Brooklyn",
                  "url": "https://www.airbnb.com/rooms/87654321",
                  "coordinate": {
                    "latitude": 40.6782,
                    "longitude": -73.9442
                  },
                  "structured_content": {
                    "primaryLine": {
                      "body": "Entire loft"
                    },
                    "secondaryLine": {
                      "body": "1 bed"
                    }
                  },
                  "avg_rating": "4.92 out of 5 stars",
                  "price_info": {
                    "primaryLine": {
                      "accessibilityLabel": "$195 per night"
                    },
                    "secondaryLine": {
                      "accessibilityLabel": "$975 total"
                    }
                  }
                }
              ],
              "pagination_info": {
                "hasNextPage": true,
                "nextPageCursor": "eyJzZWN0aW9uX29mZnNldCI6MCwiaXRlbXNfb2Zmc2V0IjoyMCwid"
              }
            },
            "component": {
              "name": "AirbnbSearchResults"
            }
          }
      - scenario: "Search with Google Maps Place ID"
        description: "Search for Airbnb listings using a Google Maps Place ID for San Francisco"
        input_json: |
          {
            "location": "San Francisco",
            "place_id": "ChIJIQBpAG2ahYAR_6128GcTUEo",
            "checkin": "2023-08-10",
            "checkout": "2023-08-15",
            "adults": 1
          }
        output_json: |
          {
            "data": {
              "search_url": "https://www.airbnb.com/s/San%20Francisco/homes?place_id=ChIJIQBpAG2ahYAR_6128GcTUEo&checkin=2023-08-10&checkout=2023-08-15&adults=1",
              "listings": [
                {
                  "id": "56789012",
                  "name": "Stylish Studio in Mission District",
                  "title": "Stylish Studio in Mission District",
