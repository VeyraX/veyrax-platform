                {
                  "id": "POLICIES_DEFAULT",
                  "type": "policies",
                  "content": {
                    "title": "House rules",
                    "houseRulesSections": {
                      "title": "Rules to follow",
                      "items": {
                        "title": "No smoking, Small pets allowed, No parties or events, Check-in after 2:00 PM"
                      }
                    }
                  }
                }
              ]
            },
            "component": {
              "name": "AirbnbListingDetails"
            }
          }
