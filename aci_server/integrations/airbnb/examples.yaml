  - endpoint: "/airbnb/listing_details"
    examples:
      - scenario: "Get details for a specific listing"
        description: "Get detailed information about an Airbnb listing in Manhattan"
        input_json: |
          {
            "id": "12345678",
            "checkin": "2023-07-15",
            "checkout": "2023-07-20",
            "adults": 2
          }
        output_json: |
          {
            "data": {
              "listing_url": "https://www.airbnb.com/rooms/12345678?check_in=2023-07-15&check_out=2023-07-20&adults=2",
              "details": [
                {
                  "id": "DESCRIPTION_DEFAULT",
                  "type": "description",
                  "content": {
                    "htmlDescription": {
                      "htmlText": "<p>Enjoy this beautiful apartment in the heart of Manhattan. Close to restaurants, shopping, and major attractions.</p>"
                    }
                  }
                },
                {
                  "id": "LOCATION_DEFAULT",
                  "type": "location",
                  "content": {
                    "lat": 40.7128,
                    "lng": -74.0060,
                    "title": "Manhattan, New York",
                    "subtitle": "Great location, 95% of recent guests gave the location a 5-star rating"
                  }
                },
                {
                  "id": "AMENITIES_DEFAULT",
                  "type": "amenities",
                  "content": {
                    "title": "What this place offers",
                    "seeAllAmenitiesGroups": {
                      "title": "All amenities",
                      "amenities": {
                        "title": "Kitchen, Wifi, Free street parking, TV, Air conditioning, Washer, Dryer"
                      }
                    }
                  }
                },
                {
                  "id": "HIGHLIGHTS_DEFAULT",
                  "type": "highlights",
                  "content": {
                    "highlights": {
                      "title": "Entire home, Free cancellation before July 10, Self check-in"
                    }
                  }
                },
                {
                  "id": "POLICIES_DEFAULT",
                  "type": "policies",
                  "content": {
                    "title": "House rules",
                    "houseRulesSections": {
                      "title": "Rules to follow",
                      "items": {
                        "title": "No smoking, No pets, No parties or events, Check-in after 3:00 PM"
                      }
                    }
                  }
                }
              ]
            },
            "component": {
              "name": "AirbnbListingDetails"
            }
          }
      - scenario: "Get listing details for family stay"
        description: "Get details for a family-friendly listing with multiple guests"
        input_json: |
          {
            "id": "87654321",
            "checkin": "2023-08-01",
            "checkout": "2023-08-08",
            "adults": 2,
            "children": 2,
            "infants": 1
          }
        output_json: |
          {
            "data": {
              "listing_url": "https://www.airbnb.com/rooms/87654321?check_in=2023-08-01&check_out=2023-08-08&adults=2&children=2&infants=1",
              "details": [
                {
                  "id": "DESCRIPTION_DEFAULT",
                  "type": "description",
                  "content": {
                    "htmlDescription": {
                      "htmlText": "<p>Spacious family-friendly home with backyard. Perfect for families with children.</p>"
                    }
                  }
                },
                {
                  "id": "LOCATION_DEFAULT",
                  "type": "location",
                  "content": {
                    "lat": 40.6782,
                    "lng": -73.9442,
                    "title": "Brooklyn, New York",
                    "subtitle": "Quiet residential neighborhood, close to parks and playgrounds"
                  }
                },
                {
                  "id": "AMENITIES_DEFAULT",
                  "type": "amenities",
                  "content": {
                    "title": "What this place offers",
                    "seeAllAmenitiesGroups": {
                      "title": "All amenities",
                      "amenities": {
                        "title": "Kitchen, Wifi, Free street parking, TV, Air conditioning, Washer, Dryer, Crib, High chair, Backyard"
                      }
                    }
                  }
                },
                {
                  "id": "HIGHLIGHTS_DEFAULT",
                  "type": "highlights",
                  "content": {
                    "highlights": {
                      "title": "Entire home, Family-friendly, Free cancellation before July 25"
