          {
            "fiat": "uah",
            "crypto": "usdt",
            "trade_type": "sell",
            "page": 1
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "offers": [
                {
                  "exchange": "bybit",
                  "order_id": "12741896509679648768",
                  "trade_type": "SELL",
                  "price": 41.35,
                  "available_amount": 50.22,
                  "min_amount": 500,
                  "max_amount": 2000,
                  "payment_methods": ["Monobank", "PrivatBank"],
                  "trader": {
                    "nickname": "BybitTrader1",
                    "completion_rate": 99.5,
                    "orders_count": 120
                  },
                  "payment_timeout": 15,
                  "metadata": {
                    "base_currency": "USDT",
                    "quote_currency": "UAH"
                  }
                },
                {
                  "exchange": "bybit",
                  "order_id": "12742205789652930560",
                  "trade_type": "SELL",
                  "price": 41.4,
                  "available_amount": 200,
                  "min_amount": 1000,
