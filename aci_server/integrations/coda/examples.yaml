              "id": "page-2468135790"
            },
            "component": {
              "name": "CodaActionResponse"
            }
          }

  - endpoint: /coda/update_page
    examples:
      - scenario: "Update Page Details"
        description: "Update details for an existing page"
        input_json: |
          {
            "doc_id": "doc_1234567890",
            "page_id": "page-1234567890",
            "name": "Project Overview",
            "subtitle": "Updated project overview and objectives",
            "icon_name": "star"
