            "data": {
              "items": [
                {
                  "id": "page-1234567890",
                  "type": "page",
                  "href": "https://coda.io/apis/v1/docs/doc_1234567890/pages/page-1234567890",
                  "browser_link": "https://coda.io/d/_ddoc_1234567890#_ppage-1234567890",
                  "name": "Overview",
                  "subtitle": "Project overview and goals",
                  "content_type": "canvas",
                  "is_hidden": false
                },
                {
                  "id": "page-0987654321",
                  "type": "page",
                  "href": "https://coda.io/apis/v1/docs/doc_1234567890/pages/page-0987654321",
                  "browser_link": "https://coda.io/d/_ddoc_1234567890#_ppage-0987654321",
                  "name": "Tasks",
