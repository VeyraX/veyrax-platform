routes:
  - endpoint: /coda/list_docs
    examples:
      - scenario: "List All Docs"
        description: "Retrieve a list of all accessible Coda docs"
        input_json: |
          {
            "limit": 10,
            "page_token": null,
            "is_owner": true,
            "query": null
          }
        output_json: |
          {
            "data": {
              "items": [
                {
                  "id": "doc_1234567890",
                  "type": "doc",
                  "href": "https://coda.io/apis/v1/docs/doc_1234567890",
                  "browser_link": "https://coda.io/d/_ddoc_1234567890",
                  "name": "Project Tracker",
                  "created_at": "2024-03-15T09:30:00.000Z",
                  "updated_at": "2024-03-20T14:45:00.000Z"
                },
                {
                  "id": "doc_0987654321",
                  "type": "doc",
                  "href": "https://coda.io/apis/v1/docs/doc_0987654321",
                  "browser_link": "https://coda.io/d/_ddoc_0987654321",
                  "name": "Marketing Campaign",
                  "created_at": "2024-03-10T11:20:00.000Z",
                  "updated_at": "2024-03-19T16:15:00.000Z"
                }
              ],
              "href": "https://coda.io/apis/v1/docs",
              "next_page_token": "token_abcdef123456"
            },
            "component": {
              "name": "CodaDocList"
            }
          }

  - endpoint: /coda/get_doc
    examples:
      - scenario: "Get Doc Details"
        description: "Retrieve details for a specific doc"
        input_json: |
          {
            "doc_id": "doc_1234567890"
          }
        output_json: |
          {
            "data": {
              "id": "doc_1234567890",
              "type": "doc",
              "href": "https://coda.io/apis/v1/docs/doc_1234567890",
              "browser_link": "https://coda.io/d/_ddoc_1234567890",
              "name": "Project Tracker",
              "created_at": "2024-03-15T09:30:00.000Z",
              "updated_at": "2024-03-20T14:45:00.000Z",
              "icon": {
                "name": "clipboard",
                "type": "emoji"
              },
              "workspace": {
                "id": "ws-abcdef123456",
                "type": "workspace",
                "name": "My Workspace"
              }
            },
            "component": {
              "name": "CodaDocDetail"
            }
          }

  - endpoint: /coda/list_pages
