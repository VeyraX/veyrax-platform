  - endpoint: /coda/get_export_status
    examples:
      - scenario: "Check Export Status"
        description: "Check the status of a page export"
        input_json: |
          {
            "doc_id": "doc_1234567890",
            "page_id": "page-1234567890",
            "request_id": "export-abcdef123456"
