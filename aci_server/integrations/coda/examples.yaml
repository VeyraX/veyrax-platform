  - endpoint: /coda/create_page
    examples:
      - scenario: "Create New Page"
        description: "Create a new page in a doc"
        input_json: |
          {
            "doc_id": "doc_1234567890",
            "name": "Resources",
            "subtitle": "Project resources and links",
            "icon_name": "bookmark"
