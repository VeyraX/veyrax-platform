                  "typeVersion": 1,
                  "position": [300, 200],
                  "parameters": {
                    "url": "https://api.example.com/data",
                    "method": "GET",
                    "authentication": "none"
                  }
                },
                {
                  "id": "node3",
                  "name": "Data Processing",
                  "type": "n8n-nodes-base.function",
                  "typeVersion": 1,
                  "position": [500, 200],
                  "parameters": {
                    "functionCode": "return {json: {processed: true, data: $input.all()[0].json}};"
                  }
                }
              ],
              "connections": {
                "node1": [
                  {
                    "node": "node2",
                    "type": "main",
                    "index": 0
                  }
                ],
                "node2": [
                  {
                    "node": "node3",
                    "type": "main",
                    "index": 0
                  }
                ]
              }
            }
