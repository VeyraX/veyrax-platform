          {
            "id": "3",
            "workflow": {
              "name": "Enhanced Data Synchronization",
              "nodes": [
                {
                  "id": "node1",
                  "name": "Schedule Trigger",
                  "type": "n8n-nodes-base.cron",
                  "typeVersion": 1,
                  "position": [100, 200],
                  "parameters": {
                    "triggerTimes": {
                      "item": [
                        {
