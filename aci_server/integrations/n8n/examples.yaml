routes:
  # Users routes
  - endpoint: /n8n/list_users
    examples:
      - scenario: "List All Users"
        description: "Retrieve a list of all n8n users"
        input_json: |
          {
            "cursor": null
          }
        output_json: |
          {
            "data": {
              "data": [
                {
                  "id": "user1",
                  "email": "admin@example.com",
                  "firstName": "Admin",
                  "lastName": "User",
                  "isPending": false,
                  "role": "global:owner",
                  "createdAt": "2023-01-15T10:00:00Z",
                  "updatedAt": "2023-05-20T14:35:12Z"
                },
                {
                  "id": "user2",
                  "email": "editor@example.com",
                  "firstName": "Editor",
                  "lastName": "User",
                  "isPending": false,
                  "role": "global:member",
                  "createdAt": "2023-02-10T11:20:00Z",
                  "updatedAt": "2023-04-15T09:30:45Z"
