              ],
              "nextCursor": "nextUserPageCursor123"
            },
            "component": {
              "name": "N8nUsersList"
            }
          }

  - endpoint: /n8n/get_user
    examples:
      - scenario: "Get User Details"
        description: "Retrieve details of a specific user by ID"
        input_json: |
          {
            "id": "user1"
          }
        output_json: |
          {
            "data": {
              "id": "user1",
              "email": "admin@example.com",
              "firstName": "Admin",
              "lastName": "User",
              "isPending": false,
              "role": "global:owner",
