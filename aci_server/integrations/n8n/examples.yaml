      - scenario: "Create New Workflow"
        description: "Create a new workflow with specified nodes and connections"
        input_json: |
          {
            "workflow": {
              "name": "Data Synchronization",
              "nodes": [
                {
                  "id": "node1",
                  "name": "Schedule Trigger",
                  "type": "n8n-nodes-base.cron",
                  "typeVersion": 1,
                  "position": [100, 200],
                  "parameters": {
                    "triggerTimes": {
                      "item": [
                        {
                          "mode": "everyDay"
                        }
                      ]
                    }
                  }
                },
                {
                  "id": "node2",
                  "name": "HTTP Request",
                  "type": "n8n-nodes-base.httpRequest",
                  "typeVersion": 1,
                  "position": [300, 200],
                  "parameters": {
                    "url": "https://api.example.com/data",
                    "method": "GET",
                    "authentication": "none"
                  }
                }
              ],
              "connections": {
                "node1": [
                  {
                    "node": "node2",
                    "type": "main",
                    "index": 0
                  }
                ]
              }
            }
          }
        output_json: |
          {
            "data": {
              "id": "3",
              "name": "Data Synchronization",
              "active": false,
              "createdAt": "2023-06-22T09:15:45Z",
              "updatedAt": "2023-06-22T09:15:45Z",
              "nodes": [
                {
                  "id": "node1",
                  "name": "Schedule Trigger",
                  "type": "n8n-nodes-base.cron",
                  "typeVersion": 1,
                  "position": [100, 200],
                  "parameters": {
                    "triggerTimes": {
                      "item": [
                        {
                          "mode": "everyDay"
                        }
                      ]
                    }
                  }
                },
                {
                  "id": "node2",
                  "name": "HTTP Request",
                  "type": "n8n-nodes-base.httpRequest",
                  "typeVersion": 1,
                  "position": [300, 200],
                  "parameters": {
                    "url": "https://api.example.com/data",
                    "method": "GET",
                    "authentication": "none"
                  }
                }
              ],
              "connections": {
                "node1": [
