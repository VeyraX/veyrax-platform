  # Executions routes
  - endpoint: /n8n/list_executions
    examples:
      - scenario: "List Workflow Executions"
        description: "Retrieve execution history for a workflow"
        input_json: |
          {
            "cursor": null,
            "workflowId": "1"
          }
        output_json: |
          {
            "data": {
              "data": [
                {
                  "id": "exec1",
                  "finished": true,
                  "mode": "manual",
                  "startedAt": "2023-06-20T15:30:22Z",
                  "stoppedAt": "2023-06-20T15:30:45Z",
                  "workflowId": "1",
                  "data": {
                    "resultData": {
                      "runData": {
                        "node1": [
                          {
                            "data": {
                              "subject": "Important Message",
                              "from": "sender@example.com"
                            }
                          }
                        ]
                      }
                    }
                  }
                },
                {
                  "id": "exec2",
                  "finished": true,
                  "mode": "manual",
                  "startedAt": "2023-06-21T09:15:10Z",
                  "stoppedAt": "2023-06-21T09:15:25Z",
                  "workflowId": "1",
                  "data": {
                    "resultData": {
                      "runData": {
                        "node1": [
                          {
                            "data": {
                              "subject": "Another Message",
                              "from": "other@example.com"
                            }
                          }
                        ]
                      }
                    }
                  }
                }
              ],
              "nextCursor": "nextExecPageCursor123"
            },
            "component": {
              "name": "N8nExecutionsList"
            }
          }

  - endpoint: /n8n/get_execution
    examples:
      - scenario: "Get Execution Details"
        description: "Retrieve details of a specific execution by ID"
        input_json: |
          {
            "id": "exec1"
          }
        output_json: |
          {
            "data": {
              "id": "exec1",
              "finished": true,
              "mode": "manual",
              "startedAt": "2023-06-20T15:30:22Z",
              "stoppedAt": "2023-06-20T15:30:45Z",
              "workflowId": "1",
              "data": {
                "resultData": {
                  "runData": {
                    "node1": [
                      {
                        "data": {
                          "subject": "Important Message",
                          "from": "sender@example.com"
                        }
                      }
                    ],
                    "node2": [
                      {
                        "data": {
                          "processedContent": "Processed message content",
                          "tags": ["important", "inbox"]
