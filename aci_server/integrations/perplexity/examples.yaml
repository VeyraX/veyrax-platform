          {
            "messages": [{"role": "user", "content": "Write a short poem about technology"}],
            "model": "sonar",
            "max_tokens": 200,
            "temperature": 0.8,
            "stream": true
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "id": "cmpl-stream123456",
              "model": "sonar",
              "object": "completion.chunk",
              "created": 1677862000,
              "citations": [],
              "choices": [
                {
                  "index": 0,
                  "delta": {
                    "role": "assistant",
                    "content": "Digital Dreams\n\nSilicon veins and electric hearts,\nWhere human thought and lightning parts.\nPixels dance across the screen,\nBridging worlds, the space between.\n\nFingerprints on glass and steel,\nInvisible threads that make us feel\nConnected to the distant stars,\nThrough circuits, codes, and avatar.\n\nIn this realm of ones and zeros,\nWe build our future, craft our heroes.\nTechnology: our tool, our art—\nAn extension of the human heart."
                  },
                  "finish_reason": "stop"
                }
              ],
              "usage": {
                "prompt_tokens": 9,
                "completion_tokens": 98,
                "total_tokens": 107
              }
            },
            "message": null,
            "component": {
              "name": "PerplexityResponseView"
            }
          } 