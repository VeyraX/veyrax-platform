routes:
  - endpoint: /motion/create_comment
    examples:
      - scenario: "Create Task Comment"
        description: "Create a new comment on an existing task"
        input_json: |
          {
            "taskId": "task_1234567890",
            "content": "This is a test comment with **bold text** and *italics*."
          }
        output_json: |
          {
            "data": {
              "id": "comment_1234567890",
              "taskId": "task_1234567890",
              "content": "<p>This is a test comment with <strong>bold text</strong> and <em>italics</em>.</p>",
              "createdAt": "2024-03-20T14:30:00.000Z",
              "creator": {
                "id": "user_1234567890",
                "name": "John Doe",
                "email": "john.doe@example.com"
              }
            },
            "component": {
              "name": "MotionCommentCard"
            }
          }

  - endpoint: /motion/get_comments
    examples:
      - scenario: "Get Task Comments"
        description: "Retrieve all comments for a specific task"
        input_json: |
          {
            "taskId": "task_1234567890"
          }
        output_json: |
          {
            "data": {
              "meta": {
                "nextCursor": "cursor_abcdefg",
                "pageSize": 2
              },
              "comments": [
                {
                  "id": "comment_1234567890",
                  "taskId": "task_1234567890",
                  "content": "<p>This is the first comment.</p>",
                  "createdAt": "2024-03-20T14:30:00.000Z",
                  "creator": {
                    "id": "user_1234567890",
                    "name": "John Doe",
                    "email": "john.doe@example.com"
                  }
                },
                {
                  "id": "comment_0987654321",
                  "taskId": "task_1234567890",
                  "content": "<p>This is a reply to the first comment.</p>",
                  "createdAt": "2024-03-20T15:00:00.000Z",
                  "creator": {
                    "id": "user_0987654321",
                    "name": "Jane Smith",
                    "email": "jane.smith@example.com"
                  }
                }
              ]
            },
            "component": {
              "name": "MotionCommentsList"
            }
          }

  - endpoint: /motion/create_project
    examples:
      - scenario: "Create New Project"
        description: "Create a new project in a workspace"
        input_json: |
          {
            "name": "New Marketing Campaign",
            "workspaceId": "workspace_1234567890",
            "description": "<p>This project will focus on the Q2 marketing campaign.</p>",
            "dueDate": "2024-06-30T23:59:59.999Z",
            "labels": ["marketing", "q2"],
            "priority": "HIGH"
          }
        output_json: |
          {
            "data": {
              "id": "project_1234567890",
              "name": "New Marketing Campaign",
              "description": "<p>This project will focus on the Q2 marketing campaign.</p>",
              "workspaceId": "workspace_1234567890",
              "status": {
                "name": "Not Started",
                "isDefaultStatus": true,
                "isResolvedStatus": false
              }
            },
            "component": {
              "name": "MotionProjectCard"
            }
          }

  - endpoint: /motion/get_project
