                "name": "Marketing Team",
                "teamId": "team_1234567890",
                "type": "team",
                "labels": [
                  {
                    "name": "priority"
                  },
                  {
                    "name": "meeting"
                  }
                ],
                "statuses": [
                  {
                    "name": "Not Started", 
                    "isDefaultStatus": true,
                    "isResolvedStatus": false
                  },
                  {
                    "name": "In Progress",
                    "isDefaultStatus": false,
                    "isResolvedStatus": false
                  }
                ]
              },
              "creator": {
                "id": "user_1234567890",
                "name": "John Doe",
                "email": "john.doe@example.com"
              },
              "assignee": {
                "id": "user_1234567890",
                "name": "John Doe",
                "email": "john.doe@example.com"
              },
              "status": {
