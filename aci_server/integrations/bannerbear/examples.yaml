  - endpoint: /sessions
    examples:
      - scenario: "Create a Session"
        description: "Creates an editor session for a template"
        input_json: |
          {
            "template": "TEMPLATE_UID",
            "mode": "preview"
          }
        output_json: |
          {
            "status_code": 202,
            "uid": "rpdmzYDgW0o9GEwJA5",
