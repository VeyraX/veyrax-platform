routes:
  - endpoint: /auth
    examples:
      - scenario: "Check Authorization"
        description: "Checks whether the provided Bannerbear API key is valid"
        input_json: |
          {}
        output_json: |
          {
            "status_code": 200,
            "message": "Authorized",
            "project": "My Project Name"
          }

  - endpoint: /account
    examples:
      - scenario: "Retrieve Account Status"
        description: "Retrieves account quotas, plan details, and current usage"
        input_json: |
          {}
        output_json: |
          {
            "status_code": 200,
            "created_at": "2019-10-22T09:49:45.265Z",
            "uid": "jJWBKNELpQPvbX5R93Gk",
            "paid_plan_name": "Bannerbear Automate",
            "api_usage": 391,
            "api_quota": 1000,
            "current_project": {
              "name": "My Project Name",
              "templates": 42
            }
          }

  - endpoint: /images
    examples:
      - scenario: "Create an Image"
        description: "Creates a new image using the specified template and modifications"
        input_json: |
          {
            "template": "YOUR_TEMPLATE_UID",
            "modifications": [
              {
                "name": "title",
                "text": "Hello World"
              },
              {
                "name": "avatar",
                "image_url": "https://www.example.com/avatar.jpg"
              }
            ],
            "metadata": "Record ID: 123"
          }
        output_json: |
          {
            "status_code": 202,
            "uid": "kG39R5XbvPQpLENKBWJj",
            "status": "pending",
            "image_url": null,
            "template": "YOUR_TEMPLATE_UID",
            "modifications": [
              {
                "name": "title",
                "text": "Hello World"
              },
              {
                "name": "avatar",
                "image_url": "https://www.example.com/avatar.jpg"
              }
            ],
            "created_at": "2025-03-27T10:00:00.000Z"
          }

  - endpoint: /images/:uid
    examples:
      - scenario: "Retrieve an Image"
        description: "Retrieves details of a specific image by UID"
        input_json: |
          {
            "uid": "kG39R5XbvPQpLENKBWJj"
          }
        output_json: |
          {
            "status_code": 200,
            "image": {
              "uid": "kG39R5XbvPQpLENKBWJj",
              "status": "completed",
              "image_url": "https://cdn.bannerbear.com/images/kG39R5XbvPQpLENKBWJj.jpg",
              "template": "6A37YJe5qNDmpvWKP0",
              "width": 1000,
              "height": 1000,
              "modifications": [
                {
                  "name": "title",
                  "text": "Hello World"
                },
                {
                  "name": "avatar",
                  "image_url": "https://www.example.com/avatar.jpg"
                }
              ],
              "created_at": "2025-03-27T10:01:00.000Z"
            }
          }

  - endpoint: /images (list)
    examples:
      - scenario: "List All Images"
        description: "Lists images with optional pagination"
        input_json: |
          {
            "page": 1,
            "limit": 25
          }
        output_json: |
          {
            "status_code": 200,
            "images": [
              {
                "uid": "kG39R5XbvPQpLENKBWJj",
                "status": "completed",
                "image_url": "https://cdn.bannerbear.com/images/kG39R5XbvPQpLENKBWJj.jpg",
                "created_at": "2025-03-27T10:02:00.000Z"
              },
              {
                "uid": "aB123Xyz9PQpABCD123",
                "status": "completed",
                "image_url": "https://cdn.bannerbear.com/images/aB123Xyz9PQpABCD123.jpg",
                "created_at": "2025-03-27T10:03:00.000Z"
              }
            ]
          }

  - endpoint: /videos
    examples:
      - scenario: "Create a Video"
        description: "Creates a new video with input media and modifications"
        input_json: |
          {
            "video_template": "YOUR_VIDEO_TEMPLATE_UID",
            "input_media_url": "https://www.example.com/video.mp4",
            "modifications": [
              {
                "name": "title",
                "text": "My Video Title"
              }
            ],
            "metadata": "Video Record 456"
          }
        output_json: |
          {
            "status_code": 202,
            "uid": "8G39Z5x3bLPqXE59R2",
            "status": "pending",
            "video_url": null,
            "render_type": "overlay",
            "created_at": "2025-03-27T10:04:00.000Z"
          }

  - endpoint: /videos/:uid
    examples:
      - scenario: "Retrieve a Video"
        description: "Retrieves details of a specific video by UID"
        input_json: |
          {
            "uid": "8G39Z5x3bLPqXE59R2"
          }
        output_json: |
          {
            "status_code": 200,
            "video": {
              "uid": "8G39Z5x3bLPqXE59R2",
              "status": "completed",
              "video_url": "https://cdn.bannerbear.com/videos/8G39Z5x3bLPqXE59R2.mp4",
              "render_type": "overlay",
              "percent_rendered": 100,
              "width": 1000,
              "height": 1000,
              "modifications": [
                {
                  "name": "title",
                  "text": "My Video Title"
                }
              ],
              "created_at": "2025-03-27T10:05:00.000Z"
            }
          }

  - endpoint: /videos (update)
    examples:
      - scenario: "Update a Video"
        description: "Updates video transcription/approval settings"
        input_json: |
          {
            "uid": "8G39Z5x3bLPqXE59R2",
            "transcription": [
              "This is a replaced line 1",
              "This is a replaced line 2"
            ],
            "approved": true
          }
        output_json: |
          {
            "status_code": 200,
            "video": {
              "uid": "8G39Z5x3bLPqXE59R2",
              "status": "rendering",
              "video_url": null,
              "transcription": [
                "This is a replaced line 1",
                "This is a replaced line 2"
              ],
              "approved": true,
              "updated_at": "2025-03-27T10:06:00.000Z"
            }
          }

  - endpoint: /videos (list)
    examples:
      - scenario: "List All Videos"
        description: "Lists videos with optional pagination"
        input_json: |
          {
            "page": 1
          }
        output_json: |
          {
            "status_code": 200,
            "videos": [
              {
                "uid": "8G39Z5x3bLPqXE59R2",
                "status": "completed",
                "video_url": "https://cdn.bannerbear.com/videos/8G39Z5x3bLPqXE59R2.mp4",
                "created_at": "2025-03-27T10:07:00.000Z"
              },
              {
                "uid": "dH456n9x8PQrcDZB12",
                "status": "pending",
                "video_url": null,
                "created_at": "2025-03-27T10:08:00.000Z"
              }
            ]
          }

  - endpoint: /collections
    examples:
      - scenario: "Create a Collection"
        description: "Creates a collection for multiple templates at once"
        input_json: |
          {
            "template_set": "YOUR_TEMPLATE_SET_UID",
            "modifications": [
              {
                "name": "text_container",
                "text": "Hello Collection"
              }
            ],
            "metadata": "Batch ID: 789"
          }
        output_json: |
          {
            "status_code": 202,
            "uid": "rZdpMYmAnDB1zb3kXL",
            "status": "pending",
            "image_urls": null,
            "template_set": "YOUR_TEMPLATE_SET_UID",
            "created_at": "2025-03-27T10:09:00.000Z"
          }

  - endpoint: /collections/:uid
    examples:
      - scenario: "Retrieve a Collection"
        description: "Retrieves details of a specific collection by UID"
        input_json: |
          {
            "uid": "rZdpMYmAnDB1zb3kXL"
          }
        output_json: |
          {
            "status_code": 200,
            "collection": {
              "uid": "rZdpMYmAnDB1zb3kXL",
              "status": "completed",
              "template_set": "YOUR_TEMPLATE_SET_UID",
              "image_urls": {
                "template_xxx_image_url": "https://cdn.bannerbear.com/...",
                "template_yyy_image_url": "https://cdn.bannerbear.com/..."
              },
              "created_at": "2025-03-27T10:10:00.000Z"
            }
          }

  - endpoint: /collections (list)
    examples:
      - scenario: "List All Collections"
        description: "Lists collections with optional pagination"
        input_json: |
          {
            "page": 1
          }
        output_json: |
          {
            "status_code": 200,
            "collections": [
              {
                "uid": "rZdpMYmAnDB1zb3kXL",
                "status": "completed",
                "created_at": "2025-03-27T10:11:00.000Z"
              },
              {
                "uid": "mP13qZwDx003abcXYZ",
                "status": "pending",
                "created_at": "2025-03-27T10:12:00.000Z"
              }
            ]
          }

  - endpoint: /animated_gifs
    examples:
      - scenario: "Create an Animated GIF"
        description: "Creates an animated GIF from multiple frames"
        input_json: |
          {
            "template": "YOUR_GIF_TEMPLATE_UID",
            "frames": [
              [
                {
                  "name": "layer1",
                  "text": "Frame 1 text"
                }
              ],
              [
                {
                  "name": "layer1",
                  "text": "Frame 2 text"
                }
              ]
            ],
            "fps": 1,
            "loop": true
          }
        output_json: |
          {
            "status_code": 202,
            "uid": "a46YPx8Z65pwmKrdGE",
            "status": "pending",
            "image_url": null,
            "created_at": "2025-03-27T10:13:00.000Z"
          }

  - endpoint: /animated_gifs/:uid
    examples:
      - scenario: "Retrieve an Animated GIF"
        description: "Retrieves details of a specific animated GIF by UID"
        input_json: |
          {
            "uid": "a46YPx8Z65pwmKrdGE"
          }
        output_json: |
          {
            "status_code": 200,
            "animated_gif": {
              "uid": "a46YPx8Z65pwmKrdGE",
              "status": "completed",
              "image_url": "https://cdn.bannerbear.com/animated_gifs/a46YPx8Z65pwmKrdGE.gif",
              "fps": 1,
              "loop": true,
              "frames": [
                [
                  {
                    "name": "layer1",
                    "text": "Frame 1 text"
                  }
                ],
                [
                  {
                    "name": "layer1",
                    "text": "Frame 2 text"
                  }
                ]
              ],
              "created_at": "2025-03-27T10:14:00.000Z"
            }
          }

  - endpoint: /animated_gifs (list)
    examples:
      - scenario: "List All Animated GIFs"
        description: "Lists animated GIFs with optional pagination"
        input_json: |
          {
            "page": 1
          }
        output_json: |
          {
            "status_code": 200,
            "animated_gifs": [
              {
                "uid": "a46YPx8Z65pwmKrdGE",
                "status": "completed",
                "image_url": "https://cdn.bannerbear.com/animated_gifs/a46YPx8Z65pwmKrdGE.gif"
              },
              {
                "uid": "xB123Y9ZgQ09RS7VVV",
                "status": "pending",
                "image_url": null
              }
            ]
          }

  - endpoint: /screenshots
    examples:
      - scenario: "Create a Screenshot"
        description: "Creates a screenshot of a public webpage"
        input_json: |
          {
            "url": "https://www.apple.com",
            "width": 1200,
            "height": 3000,
            "mobile": false
          }
        output_json: |
          {
            "status_code": 202,
            "uid": "xwbeAQqO70Y3oyd2WY",
            "status": "pending",
            "screenshot_image_url": null,
            "created_at": "2025-03-27T10:15:00.000Z"
          }

  - endpoint: /screenshots/:uid
    examples:
      - scenario: "Retrieve a Screenshot"
        description: "Retrieves details of a specific screenshot by UID"
        input_json: |
          {
            "uid": "xwbeAQqO70Y3oyd2WY"
          }
        output_json: |
          {
            "status_code": 200,
            "screenshot": {
              "uid": "xwbeAQqO70Y3oyd2WY",
              "status": "completed",
              "screenshot_image_url": "https://cdn.bannerbear.com/screenshots/xwbeAQqO70Y3oyd2WY.png",
              "width": 1200,
              "height": 3000,
              "created_at": "2025-03-27T10:16:00.000Z"
            }
          }

  - endpoint: /screenshots (list)
    examples:
      - scenario: "List All Screenshots"
        description: "Lists screenshots with optional pagination"
        input_json: |
          {
            "page": 1
          }
        output_json: |
          {
            "status_code": 200,
            "screenshots": [
              {
                "uid": "xwbeAQqO70Y3oyd2WY",
                "status": "completed",
                "screenshot_image_url": "https://cdn.bannerbear.com/screenshots/xwbeAQqO70Y3oyd2WY.png"
              },
              {
                "uid": "abcd1234wxyz5678",
                "status": "pending",
                "screenshot_image_url": null
              }
            ]
          }

  - endpoint: /templates
    examples:
      - scenario: "Create a Template"
        description: "Creates a new blank template in Bannerbear"
        input_json: |
          {
            "name": "My Template",
            "width": 1000,
            "height": 900,
            "tags": ["Tag1", "Tag2"]
          }
        output_json: |
          {
            "status_code": 202,
            "uid": "04PK8K2bctXHjqB97O",
            "name": "My Template",
            "width": 1000,
            "height": 900,
            "tags": ["Tag1", "Tag2"],
            "created_at": "2025-03-27T10:17:00.000Z"
          }

  - endpoint: /templates?source=:uid
    examples:
      - scenario: "Duplicate a Template"
        description: "Duplicates an existing template by UID"
        input_json: |
          {
            "source": "SOURCE_TEMPLATE_UID"
          }
        output_json: |
          {
            "status_code": 202,
            "uid": "NEW_TEMPLATE_UID",
            "name": "Copy of Source Template",
            "width": 1000,
            "height": 1000,
            "created_at": "2025-03-27T10:18:00.000Z"
          }

  - endpoint: /templates/:uid
    examples:
      - scenario: "Retrieve a Template"
        description: "Retrieves details of a specific template by UID"
        input_json: |
          {
            "uid": "04PK8K2bctXHjqB97O"
          }
        output_json: |
          {
            "status_code": 200,
            "template": {
              "uid": "04PK8K2bctXHjqB97O",
              "name": "My Template",
              "width": 1000,
              "height": 900,
              "tags": ["Tag1", "Tag2"],
              "preview_url": "https://cdn.bannerbear.com/templates/04PK8K2bctXHjqB97O.png",
              "created_at": "2025-03-27T10:19:00.000Z"
            }
          }

  - endpoint: /templates/:uid (update)
    examples:
      - scenario: "Update a Template"
        description: "Updates certain attributes of an existing template"
        input_json: |
          {
            "tags": ["TagA","TagB"],
            "name": "My Updated Template",
            "width": 1200,
            "height": 630
          }
        output_json: |
          {
            "status_code": 200,
            "template": {
              "uid": "04PK8K2bctXHjqB97O",
              "name": "My Updated Template",
              "width": 1200,
              "height": 630,
              "tags": ["TagA","TagB"],
              "updated_at": "2025-03-27T10:20:00.000Z"
            }
          }

  - endpoint: /templates (list)
    examples:
      - scenario: "List All Templates"
        description: "Lists templates with optional pagination or filtering"
        input_json: |
          {
            "page": 1,
            "limit": 25
          }
        output_json: |
          {
            "status_code": 200,
            "templates": [
              {
                "uid": "04PK8K2bctXHjqB97O",
                "name": "My Template",
                "width": 1200,
                "height": 630,
                "tags": ["TagA","TagB"]
              },
              {
                "uid": "aB123Xyz9PQZZZ9BBB",
                "name": "Another Template",
                "width": 1000,
                "height": 1000,
                "tags": []
              }
            ]
          }

  - endpoint: /templates/import
    examples:
      - scenario: "Import Templates"
        description: "Imports templates from the public library or publicly shared ones"
        input_json: |
          {
            "publications": [
              "ao9gyzedjlb3bw0j7m",
              "ewmqrbyd5vqoj9xz7z"
            ]
          }
        output_json: |
          {
            "status_code": 202,
            "imported": [
              {
                "uid": "ImportedTemplate1",
                "name": "Template from publication ao9gyzedjlb3bw0j7m"
              },
              {
                "uid": "ImportedTemplate2",
                "name": "Template from publication ewmqrbyd5vqoj9xz7z"
              }
            ]
          }

  - endpoint: /template_sets
    examples:
      - scenario: "Create a Template Set"
        description: "Creates a new template set with specified template UIDs"
        input_json: |
          {
            "name": "My Template Set",
            "templates": [
              "p4KnlWBbK1V5OQGgm1",
              "r6anBGWDA1EDO38124"
            ]
          }
        output_json: |
          {
            "status_code": 202,
            "uid": "VymBYa7gMjW6JQ2njM",
            "name": "My Template Set",
            "templates": [
              "p4KnlWBbK1V5OQGgm1",
              "r6anBGWDA1EDO38124"
            ],
            "created_at": "2025-03-27T10:21:00.000Z"
          }

  - endpoint: /template_sets/:uid
    examples:
      - scenario: "Update a Template Set"
        description: "Updates an existing template set by clearing it then adding new templates"
        input_json: |
          {
            "uid": "VymBYa7gMjW6JQ2njM",
            "templates": [
              "p4KnlWBbK1V5OQGgm1"
            ],
            "name": "My Updated Template Set"
          }
        output_json: |
          {
            "status_code": 200,
            "template_set": {
              "uid": "VymBYa7gMjW6JQ2njM",
              "name": "My Updated Template Set",
              "templates": [
                "p4KnlWBbK1V5OQGgm1"
              ],
              "updated_at": "2025-03-27T10:22:00.000Z"
            }
          }

  - endpoint: /template_sets/:uid (retrieve)
    examples:
      - scenario: "Retrieve a Template Set"
        description: "Retrieves details of a specific template set by UID"
        input_json: |
          {
            "uid": "VymBYa7gMjW6JQ2njM"
          }
        output_json: |
          {
            "status_code": 200,
            "template_set": {
              "uid": "VymBYa7gMjW6JQ2njM",
              "name": "My Template Set",
              "available_modifications": [
                {
                  "name": "avatar",
                  "image_url": null
                }
              ],
              "templates": [
                {
                  "uid": "p4KnlWBbK1V5OQGgm1",
                  "name": "Template #1"
                }
              ],
              "created_at": "2025-03-27T10:23:00.000Z"
            }
          }

  - endpoint: /template_sets (list)
    examples:
      - scenario: "List All Template Sets"
        description: "Lists template sets with optional pagination"
        input_json: |
          {
            "page": 1
          }
        output_json: |
          {
            "status_code": 200,
            "template_sets": [
              {
                "uid": "VymBYa7gMjW6JQ2njM",
                "name": "My Template Set",
                "templates": [
