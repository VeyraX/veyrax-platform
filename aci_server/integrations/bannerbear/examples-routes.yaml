- endpoint: https://api.bannerbear.com/v2/images
  name: Create an Image
  authorization: Bearer token
  examples:
    input_json: |-
      {
        "template": "YOUR_TEMPLATE_UID",
        "modifications": [
          {
            "name": "title",
            "text": "Hello World"
          },
          {
            "name": "avatar",
            "image_url": "https://www.example.com/avatar.jpg"
          }
        ],
        "metadata": "Record ID: 123"
      }
    output_json: |-
