        "status_code": 202,
        "uid": "kG39R5XbvPQpLENKBWJj",
        "status": "pending",
        "image_url": null,
        "template": "YOUR_TEMPLATE_UID",
        "modifications": [
          {
            "name": "title",
            "text": "Hello World"
          },
          {
            "name": "avatar",
            "image_url": "https://www.example.com/avatar.jpg"
          }
        ],
        "created_at": "2025-03-27T10:00:00.000Z"
      }

