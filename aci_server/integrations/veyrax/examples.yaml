routes:
  - endpoint: /veyrax/save_memory
    examples:
      - scenario: "Save memory with tool"
        description: "Save text to memory with a specified tool"
        input_json: |
          {
            "memory": "This is important information to remember",
            "tool": "chat_assistant"
          }
        output_json: |
          {
            "data": {
              "success": true,
              "message": "Memory saved successfully",
              "id": "123e4567-e89b-12d3-a456-426614174000"
            },
            "component": null
          }
  
  - endpoint: /veyrax/get_memory
    examples:
      - scenario: "Get all memories"
        description: "Get all memories for the current user"
        input_json: |
          {
          }
        output_json: |
          {
            "data": {
              "items": [
                {
                  "id": "123e4567-e89b-12d3-a456-426614174000",
                  "memory": "This is important information to remember",
                  "tool": "chat_assistant",
                  "user_id": "user-123",
                  "created_at": "2023-03-08T14:30:00Z"
                },
                {
                  "id": "123e4567-e89b-12d3-a456-426614174001",
                  "memory": "Another important piece of information",
                  "tool": "document_processor",
                  "user_id": "user-123",
                  "created_at": "2023-03-07T10:15:00Z"
                }
              ],
              "count": 2
            },
            "component": null
          }
  
  - endpoint: /veyrax/update_memory
    examples:
      - scenario: "Update memory text"
        description: "Update the text of an existing memory"
        input_json: |
          {
            "id": "123e4567-e89b-12d3-a456-426614174000",
            "memory": "Updated information to remember"
          }
        output_json: |
          {
            "data": {
              "success": true,
              "message": "Memory updated successfully",
              "id": "123e4567-e89b-12d3-a456-426614174000"
            },
            "component": null
          }
  
  - endpoint: /veyrax/delete_memory
    examples:
      - scenario: "Delete memory"
        description: "Delete an existing memory"
        input_json: |
          {
            "id": "123e4567-e89b-12d3-a456-426614174000"
          }
        output_json: |
          {
            "data": {
              "success": true,
              "message": "Memory deleted successfully",
              "id": "123e4567-e89b-12d3-a456-426614174000"
            },
            "component": null
          }
      