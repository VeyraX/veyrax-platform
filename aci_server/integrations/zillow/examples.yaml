routes:
  - endpoint: /zillow/get_property
    examples:
      - scenario: "Get Property by ZPID"
        description: "Retrieve property details using a Zillow Property ID"
        input_json: |
          {
            "zpid": 197832
          }
        output_json: |
          {
            "data": {
              "zpid": 197832,
              "streetAddress": "123 Example St",
              "zipcode": "12345",
              "city": "Los Angeles",
              "state": "CA",
              "latitude": 34.052235,
              "longitude": -118.243683,
              "price": 750000,
              "homeStatus": "FOR_SALE",
              "homeType": "SINGLE_FAMILY",
              "livingArea": 2000,
              "livingAreaUnits": "sqft",
              "bedrooms": 3,
              "bathrooms": 2,
              "yearBuilt": 1980,
              "url": "https://www.zillow.com/homedetails/123-Example-St-Los-Angeles-CA-12345/197832_zpid/",
              "imgSrc": "https://photos.zillowstatic.com/fp/example-image.jpg",
              "description": "Beautiful single family home in Los Angeles with 3 bedrooms and 2 bathrooms.",
              "timeOnZillow": "30 days",
              "monthlyHoaFee": 150,
              "currency": "USD",
              "address": {
                "city": "Los Angeles",
                "state": "CA",
                "streetAddress": "123 Example St",
                "zipcode": "12345"
              }
            },
            "component": {
              "name": "PropertyDetails"
            }
          }
      
      - scenario: "Get Property by URL"
        description: "Retrieve property details using a Zillow property URL"
        input_json: |
          {
            "property_url": "https://www.zillow.com/homedetails/101-California-Ave-UNIT-506-Santa-Monica-CA-90403/20485717_zpid/"
          }
        output_json: |
          {
            "data": {
              "zpid": 20485717,
              "streetAddress": "101 California Ave UNIT 506",
              "zipcode": "90403",
              "city": "Santa Monica",
              "state": "CA",
              "latitude": 34.0195,
              "longitude": -118.4912,
              "price": 1250000,
              "homeStatus": "FOR_SALE",
              "homeType": "CONDO",
              "livingArea": 1200,
              "livingAreaUnits": "sqft",
              "bedrooms": 2,
              "bathrooms": 2,
              "yearBuilt": 2005,
