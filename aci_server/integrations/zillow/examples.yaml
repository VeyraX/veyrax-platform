  - endpoint: /zillow/search_properties
    examples:
      - scenario: "Search Properties in Los Angeles"
        description: "Search for houses for sale in Los Angeles"
        input_json: |
          {
            "location": "Los Angeles, CA",
            "status_type": "ForSale",
            "home_type": "Houses"
          }
        output_json: |
          {
            "data": {
              "results": {
                "props": [
                  {
                    "zpid": "20477746",
                    "address": "443 Euclid St, Santa Monica, CA 90402",
                    "bedrooms": 4,
                    "bathrooms": 3,
                    "price": 4495000,
                    "homeStatus": null,
                    "homeType": null,
                    "livingArea": 2683,
                    "lotAreaValue": 7501.032,
                    "lotAreaUnit": "sqft",
                    "latitude": 34.034992,
                    "longitude": -118.49976,
                    "imgSrc": "https://photos.zillowstatic.com/fp/fcb17e90b0a065b9e0a7eea321e24b40-p_e.jpg",
                    "hasImage": true,
                    "currency": "USD",
                    "country": "USA",
                    "dateSold": null,
                    "daysOnZillow": -1,
                    "propertyType": "SINGLE_FAMILY",
                    "listingStatus": "FOR_SALE"
                  }
                ],
                "resultsPerPage": 40,
                "totalPages": 1,
                "totalResultCount": 1,
                "currentPage": 1
              }
            },
            "component": {
              "name": "PropertySearchResults"
            }
          }
      
      - scenario: "Search Properties with Filters"
        description: "Search for properties with specific price and bedroom filters"
        input_json: |
          {
            "location": "Los Angeles, CA",
            "status_type": "ForSale",
            "home_type": "Houses",
            "minPrice": 1000000,
            "maxPrice": 2000000,
            "bedsMin": 3,
            "bathsMin": 2
