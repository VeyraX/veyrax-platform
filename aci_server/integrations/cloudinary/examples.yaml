  - endpoint: /cloudinary/get_asset_details
    examples:
      - scenario: "Get Image Details"
        description: "Get details for a specific image"
        input_json: |
          {
            "public_id": "olympic_flag",
            "resource_type": "image",
            "colors": true
          }
        output_json: |
          {
            "data": {
              "public_id": "olympic_flag",
              "version": 1627998723,
              "width": 1920,
              "height": 1080,
              "format": "jpg",
              "resource_type": "image",
              "created_at": "2023-08-03T14:52:03Z",
              "tags": ["olympic", "flag"],
              "bytes": 123456,
              "type": "upload",
              "url": "http://res.cloudinary.com/demo/image/upload/v1627998723/olympic_flag.jpg",
              "secure_url": "https://res.cloudinary.com/demo/image/upload/v1627998723/olympic_flag.jpg",
              "colors": ["#0081C8", "#FCB131", "#000000", "#00A651", "#EE334E", "#FFFFFF"]
            },
            "component": {
              "name": "CloudinaryAssetCard"
            }
          }
      - scenario: "Get Video Details"
        description: "Get details for a specific video"
        input_json: |
          {
            "public_id": "sample_video",
            "resource_type": "video"
          }
        output_json: |
          {
            "data": {
              "public_id": "sample_video",
              "version": 1627998980,
              "width": 1280,
              "height": 720,
              "format": "mp4",
              "resource_type": "video",
              "created_at": "2023-08-03T14:56:20Z",
              "tags": ["sample", "video", "bunny"],
              "bytes": 1048576,
              "type": "upload",
              "url": "http://res.cloudinary.com/demo/video/upload/v1627998980/sample_video.mp4",
              "secure_url": "https://res.cloudinary.com/demo/video/upload/v1627998980/sample_video.mp4",
              "duration": 30.53,
              "bit_rate": 273741,
              "frame_rate": 24,
              "audio": {
                "codec": "aac",
                "bit_rate": "128117",
                "frequency": 44100,
                "channels": 2,
                "channel_layout": "stereo"
              },
              "video": {
                "pix_format": "yuv420p",
                "codec": "h264",
                "level": 31,
                "bit_rate": "145594"
              }
            },
            "component": {
              "name": "CloudinaryAssetCard"
            }
          }

  - endpoint: /cloudinary/delete_asset
    examples:
      - scenario: "Delete Image"
        description: "Delete an image and invalidate CDN cache"
        input_json: |
          {
            "public_id": "olympic_flag",
            "resource_type": "image",
            "invalidate": true
          }
        output_json: |
          {
            "data": {
              "result": "ok"
            },
            "component": {
              "name": "CloudinaryDeleteResult"
            }
          }

  - endpoint: /cloudinary/rename_asset
    examples:
      - scenario: "Rename Image"
        description: "Rename an image (change its public ID)"
        input_json: |
          {
            "from_public_id": "olympic_flag",
            "to_public_id": "flags/olympic_flag_2023",
            "resource_type": "image",
            "invalidate": true
          }
        output_json: |
          {
            "data": {
              "result": "ok"
            },
            "component": {
              "name": "CloudinaryRenameResult"
            }
          } 