  - endpoint: /notion/update_page
    examples:
      - scenario: "Update an Existing Page"
        description: "Updates properties of an existing page"
        input_json: |
          {
            "page_id": "page123",
            "page_update": {
              "properties": {
                "title": {
                  "title": [
                    {
                      "type": "text",
                      "text": {
                        "content": "Updated Website Redesign"
                      }
                    }
                  ]
                },
                "Status": {
                  "select": {
                    "name": "Completed"
                  }
                }
              }
            }
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "id": "page123",
              "title": "Updated Website Redesign",
              "properties": {
                "Name": {
                  "id": "title",
                  "type": "title",
                  "title": [
                    {
