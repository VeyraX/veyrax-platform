          {
            "database_id": "db123456",
            "filter": {
              "property": "Status",
              "select": {
                "equals": "To Do"
              }
            },
            "sorts": [
              {
                "property": "Deadline",
                "direction": "ascending"
              }
            ],
            "start_cursor": null,
            "page_size": 10
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "items": [
                {
