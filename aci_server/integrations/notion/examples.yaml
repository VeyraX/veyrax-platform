  - endpoint: /notion/create_page
    examples:
      - scenario: "Create a New Page"
        description: "Creates a new page with specified properties"
        input_json: |
          {
            "page": {
              "parent": {
                "type": "page_id",
                "page_id": "parent_page_123"
              },
              "properties": {
                "title": {
                  "title": [
                    {
                      "text": {
                        "content": "New Project Proposal"
                      }
                    }
                  ]
                }
              },
              "children": [
                {
                  "object": "block",
                  "type": "paragraph",
                  "paragraph": {
                    "rich_text": [
                      {
                        "type": "text",
                        "text": {
                          "content": "This is a new project proposal with important details."
                        }
                      }
                    ]
                  }
                }
              ]
            }
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "id": "new_page_456",
              "title": "New Project Proposal",
              "properties": {
                "title": {
                  "id": "title",
                  "type": "title",
                  "title": [
                    {
                      "type": "text",
                      "text": {
                        "content": "New Project Proposal"
                      },
                      "plain_text": "New Project Proposal"
                    }
                  ]
                }
              },
              "created_time": "2023-05-22T15:30:45.000Z",
              "last_edited_time": "2023-05-22T15:30:45.000Z",
              "url": "https://www.notion.so/myworkspace/new_page_456",
              "parent": {
                "type": "page_id",
                "page_id": "parent_page_123"
              }
            },
            "message": null,
            "component": {
              "name": "NotionPageCard"
            }
          }
      - scenario: "Create a Page with People Property"
        description: "Creates a new page with a people property"
        input_json: |
          {
            "page": {
              "parent": {
                "type": "database_id",
                "database_id": "db123456"
              },
              "properties": {
                "Título del Contenido": { 
                  "title": [
                    { "text": { "content": "Nuevo Contenido" } }
                  ] 
                },
                "Tipo de Contenido": { 
                  "select": { "name": "Blog" } 
                },
                "Fecha de Publicación": { 
                  "date": { "start": "2025-03-08" } 
                },
                "Plataforma de Publicación": { 
                  "multi_select": [
                    { "name": "Sitio Web" }
                  ] 
                },
                "Objetivo del Contenido": { 
                  "rich_text": [
                    { "text": { "content": "Informar" } }
                  ] 
                },
                "Público Objetivo": { 
                  "rich_text": [
                    { "text": { "content": "General" } }
                  ] 
                },
                "Palabras Clave": { 
                  "multi_select": [
                    { "name": "SEO" }
                  ] 
                },
                "Responsable": { 
                  "people": [
                    { "id": "user_id_123" }
                  ] 
                },
                "Estado": { 
                  "select": { "name": "En proceso" } 
                },
                "Notas Adicionales": { 
                  "rich_text": [
                    { "text": { "content": "Notas adicionales sobre el contenido." } }
                  ] 
                }
              }
            }
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "id": "new_page_789",
              "title": "Nuevo Contenido",
              "properties": {
                "Título del Contenido": {
                  "id": "title",
                  "type": "title",
                  "title": [
                    {
                      "type": "text",
                      "text": {
                        "content": "Nuevo Contenido"
                      },
                      "plain_text": "Nuevo Contenido"
                    }
                  ]
                },
                "Responsable": {
                  "id": "resp",
                  "type": "people",
                  "people": [
                    {
                      "id": "user_id_123",
                      "name": "John Doe",
                      "avatar_url": "https://secure.notion-static.com/avatar_123.png",
                      "type": "person",
                      "person": {
                        "email": "john.doe@example.com"
                      }
                    }
                  ]
                },
                "Estado": {
                  "id": "stat",
                  "type": "select",
                  "select": {
                    "id": "1",
                    "name": "En proceso",
                    "color": "blue"
                  }
                }
              },
              "created_time": "2023-05-22T16:45:30.000Z",
              "last_edited_time": "2023-05-22T16:45:30.000Z",
              "url": "https://www.notion.so/myworkspace/new_page_789",
              "parent": {
                "type": "database_id",
                "database_id": "db123456"
              }
            },
            "message": null,
            "component": {
              "name": "NotionPageCard"
            }
          }

