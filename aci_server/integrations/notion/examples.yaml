          {
            "page": {
              "parent": {
                "type": "page_id",
                "page_id": "parent_page_123"
              },
              "properties": {
                "title": {
                  "title": [
                    {
                      "text": {
                        "content": "New Project Proposal"
                      }
                    }
                  ]
                }
              },
              "children": [
                {
                  "object": "block",
                  "type": "paragraph",
                  "paragraph": {
                    "rich_text": [
                      {
                        "type": "text",
                        "text": {
                          "content": "This is a new project proposal with important details."
                        }
                      }
                    ]
                  }
                }
              ]
            }
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "id": "new_page_456",
              "title": "New Project Proposal",
              "properties": {
                "title": {
                  "id": "title",
                  "type": "title",
                  "title": [
                    {
                      "type": "text",
                      "text": {
                        "content": "New Project Proposal"
