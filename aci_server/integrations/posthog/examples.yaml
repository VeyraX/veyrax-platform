  - endpoint: /posthog/create_insight
    examples:
      - scenario: "Create New Insight"
        description: "Create a new insight with trend data"
        input_json: |
          {
            "project_id": "12345",
            "name": "New User Growth",
            "description": "Track monthly user growth",
            "query": {
              "kind": "InsightVizNode",
              "source": {
                "kind": "TrendsQuery",
                "interval": "month",
                "series": [
                  {
                    "kind": "EventsNode",
                    "event": "$new_user",
                    "math": "total"
                  }
                ],
                "dateRange": {
                  "date_from": "-6m"
                }
              }
            }
          }
        output_json: |
          {
            "data": {
              "id": 123,
              "short_id": "ghi789",
              "name": "New User Growth",
              "description": "Track monthly user growth",
              "query": {
                "kind": "InsightVizNode",
                "source": {
