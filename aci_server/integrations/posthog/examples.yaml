routes:
  - endpoint: /posthog/execute_query
    examples:
      - scenario: "Execute HogQL Query"
        description: "Query events where current URL contains blog"
        input_json: |
          {
            "project_id": "12345",
            "query": {
              "kind": "HogQLQuery",
              "query": "select properties.$current_url from events where properties.$current_url like '%/blog%' limit 100"
            },
            "async_query": false,
            "refresh": "blocking"
          }
        output_json: |
          {
            "data": {
              "results": [
                {
                  "properties.$current_url": "https://example.com/blog/article-1"
                },
                {
                  "properties.$current_url": "https://example.com/blog/article-2"
                }
              ],
              "columns": ["properties.$current_url"],
              "types": ["String"],
              "hogql": "select properties.$current_url from events where properties.$current_url like '%/blog%' limit 100"
            },
            "component": {
              "name": "PosthogQueryResult",
              "props": {}
            }
          }

  - endpoint: /posthog/get_query
