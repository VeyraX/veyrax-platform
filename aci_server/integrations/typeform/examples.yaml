              "fields": [
                {
                  "id": "field_1",
                  "title": "What is your full name?",
                  "type": "short_text",
                  "ref": "name",
                  "properties": {}
                },
                {
                  "id": "field_2",
                  "title": "How satisfied are you with our service?",
                  "type": "rating",
                  "ref": "satisfaction",
                  "properties": {
                    "steps": 10
                  }
                },
                {
                  "id": "field_3",
                  "title": "Would you recommend our service to others?",
                  "type": "yes_no",
                  "ref": "recommendation",
                  "properties": {}
                }
              ],
              "workspace": {
                "id": "wsp123456",
                "name": "Marketing"
              }
            },
            "component": {
              "name": "TypeformFormDetail"
            }
          }

  - endpoint: /typeform/delete_form
    examples:
      - scenario: "Delete a Form"
        description: "Permanently delete a form from your account"
        input_json: |
          {
            "form_id": "abcDE12345"
          }
        output_json: |
          {
            "data": {},
            "component": {
              "name": "TypeformDeleteResult"
            }
          }