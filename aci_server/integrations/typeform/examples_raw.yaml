  - endpoint: /typeform/update_form_patch
    examples:
      - scenario: "Update Form Title"
        description: "Updates the title of an existing form using a patch operation"
        input_json: |
          {
            "form_id": "abc123",
            "operations": [
              {
                "op": "replace",
                "path": "/title",
                "value": "Updated Customer Feedback Survey"
              }
            ]
          }
        output_json: |
          {
            "status_code": 200,
            "data": null,
            "message": "Form successfully updated",
            "component": null
          }
      - scenario: "Update Form Settings"
        description: "Updates multiple form settings using patch operations"
        input_json: |
          {
            "form_id": "abc123",
            "operations": [
              {
                "op": "replace",
                "path": "/settings/is_public",
                "value": false
              },
              {
                "op": "replace",
                "path": "/settings/meta",
                "value": {
                  "allow_indexing": true,
                  "description": "Updated survey description",
                  "image": {
                    "href": "https://images.typeform.com/images/4bcd3"
                  },
                  "title": "SEO friendly title"
                }
              },
              {
                "op": "replace",
                "path": "/workspace",
                "value": {
                  "href": "https://api.typeform.com/workspaces/a1b2c3"
                }
              }
            ]
          }
        output_json: |
          {
            "status_code": 200,
            "data": null,
            "message": "Form successfully updated",
            "component": null
          }

