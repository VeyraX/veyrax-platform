routes:
  - endpoint: /typeform/get_account_workspaces
    examples:
      - scenario: "List Account Workspaces"
        description: "Retrieves all workspaces within a specific account"
        input_json: |
          {
            "account_id": "ABCD1234",
            "search": null,
            "page": 1,
            "page_size": 10
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "items": [
                {
                  "account_id": "ABCD1234",
                  "forms": [
                    {
                      "count": 12,
                      "href": "https://api.typeform.com/workspaces/a1b2c3/forms"
                    }
                  ],
                  "id": "a1b2c3",
                  "name": "My Workspace",
                  "self": [
                    {
                      "href": "https://api.typeform.com/workspaces/a1b2c3"
                    }
                  ],
                  "shared": false
                }
              ],
              "page_count": 1,
              "total_items": 10
            },
            "message": null,
            "component": {
              "name": "TypeformWorkspaceList"
            }
          }

  - endpoint: /typeform/create_account_workspace
    examples:
      - scenario: "Create Account Workspace"
        description: "Creates a new workspace in a specific account"
        input_json: |
          {
            "account_id": "ABCD1234",
            "name": "My new workspace"
          }
        output_json: |
          {
            "status_code": 201,
            "data": {
              "account_id": "ABCD1234",
              "forms": [],
              "id": "d4e5f6",
              "name": "My new workspace",
              "self": [
                {
                  "href": "https://api.typeform.com/workspaces/d4e5f6"
                }
              ],
              "shared": false,
              "members": []
            },
            "message": null,
            "component": {
              "name": "TypeformWorkspaceCard"
            }
          }

  - endpoint: /typeform/get_workspaces
    examples:
      - scenario: "List All Accessible Workspaces"
        description: "Retrieves all workspaces the user has access to across multiple organizations"
        input_json: |
          {
            "search": null,
            "page": 1,
            "page_size": 10
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "items": [
                {
                  "account_id": "ABCD1234",
                  "forms": [
                    {
                      "count": 12,
                      "href": "https://api.typeform.com/workspaces/a1b2c3/forms"
                    }
                  ],
                  "id": "a1b2c3",
                  "name": "My Workspace",
                  "self": [
                    {
                      "href": "https://api.typeform.com/workspaces/a1b2c3"
                    }
                  ],
                  "shared": false
                },
                {
                  "account_id": "EFGH5678",
                  "forms": [
                    {
                      "count": 5,
                      "href": "https://api.typeform.com/workspaces/g7h8i9/forms"
                    }
                  ],
                  "id": "g7h8i9",
                  "name": "Marketing Workspace",
                  "self": [
                    {
                      "href": "https://api.typeform.com/workspaces/g7h8i9"
                    }
                  ],
                  "shared": true
                }
              ],
              "page_count": 1,
              "total_items": 10
            },
            "message": null,
            "component": {
              "name": "TypeformWorkspaceList"
            }
          }

  - endpoint: /typeform/create_workspace
    examples:
      - scenario: "Create New Workspace"
        description: "Creates a new workspace in the account where the user is an owner"
        input_json: |
          {
            "name": "My new workspace"
          }
        output_json: |
          {
            "status_code": 201,
            "data": {
              "account_id": "ABCD1234",
              "forms": [],
              "id": "j9k0l1",
              "name": "My new workspace",
              "self": [
                {
                  "href": "https://api.typeform.com/workspaces/j9k0l1"
                }
              ],
              "shared": false,
              "members": []
            },
            "message": null,
            "component": {
              "name": "TypeformWorkspaceCard"
            }
          }

  - endpoint: /typeform/delete_workspace
    examples:
      - scenario: "Delete Workspace"
        description: "Deletes an existing workspace"
        input_json: |
          {
            "workspace_id": "a1b2c3"
          }
        output_json: |
          {
            "status_code": 204,
            "data": null,
            "message": "Workspace successfully deleted",
            "component": null
          }

  - endpoint: /typeform/get_workspace
    examples:
      - scenario: "Retrieve Workspace Details"
        description: "Retrieves detailed information about a specific workspace"
        input_json: |
          {
            "workspace_id": "a1b2c3"
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "account_id": "ABCD1234",
              "forms": [
                {
                  "count": 12,
                  "href": "https://api.typeform.com/workspaces/a1b2c3/forms"
                }
              ],
              "id": "a1b2c3",
              "name": "My Workspace",
              "self": [
                {
                  "href": "https://api.typeform.com/workspaces/a1b2c3"
                }
              ],
              "shared": false,
              "members": [
                {
                  "email": "user@example.com",
                  "role": "owner"
                }
              ]
            },
            "message": null,
            "component": {
              "name": "TypeformWorkspaceCard"
            }
          }

  - endpoint: /typeform/update_workspace
    examples:
      - scenario: "Update Workspace Name"
        description: "Updates the name of an existing workspace"
        input_json: |
          {
            "workspace_id": "a1b2c3",
            "operations": [
              {
                "op": "replace",
                "path": "/name",
                "value": "Marketing Workspace"
              }
            ]
          }
        output_json: |
          {
            "status_code": 204,
            "data": null,
            "message": "Workspace successfully updated",
            "component": null
          }
      - scenario: "Add Workspace Member"
        description: "Adds a new member to a workspace"
        input_json: |
          {
            "workspace_id": "a1b2c3",
            "operations": [
              {
                "op": "add",
                "path": "/members",
                "value": {
                  "email": "newmember@example.com",
                  "role": "editor"
                }
              }
            ]
          }
        output_json: |
          {
            "status_code": 204,
            "data": null,
            "message": "Member successfully added to workspace",
            "component": null
          }
      - scenario: "Remove Workspace Member"
        description: "Removes a member from a workspace"
        input_json: |
          {
            "workspace_id": "a1b2c3",
            "operations": [
              {
                "op": "remove",
                "path": "/members",
                "value": {
                  "email": "member@example.com"
                }
              }
            ]
          }
        output_json: |
          {
            "status_code": 204,
            "data": null,
            "message": "Member successfully removed from workspace",
            "component": null
          }

  # Form endpoints
  - endpoint: /typeform/get_forms
    examples:
      - scenario: "List All Forms"
        description: "Retrieves a list of all forms in your Typeform account"
        input_json: |
          {
            "search": null,
            "page": 1,
            "page_size": 10,
            "workspace_id": null,
            "sort_by": "created_at",
            "order_by": "desc"
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "total_items": 25,
              "page_count": 3,
              "items": [
                {
                  "id": "abc123",
                  "title": "Customer Feedback Survey",
                  "self": {
                    "href": "https://api.typeform.com/forms/abc123"
                  },
                  "last_updated_at": "2023-05-15T09:45:22Z",
                  "created_at": "2023-04-10T14:30:00Z",
                  "settings": {
                    "is_public": true,
                    "language": "en"
                  },
                  "workspaces": [
                    {
                      "href": "https://api.typeform.com/workspaces/a1b2c3"
                    }
                  ],
                  "_links": {
                    "display": "https://yourcompany.typeform.com/to/abc123"
                  }
                },
                {
                  "id": "def456",
                  "title": "Employee Satisfaction",
                  "self": {
                    "href": "https://api.typeform.com/forms/def456"
                  },
                  "last_updated_at": "2023-05-10T11:20:15Z",
                  "created_at": "2023-03-22T08:15:30Z",
                  "settings": {
                    "is_public": false,
                    "language": "en"
                  },
                  "workspaces": [
                    {
                      "href": "https://api.typeform.com/workspaces/a1b2c3"
                    }
                  ],
                  "_links": {
                    "display": "https://yourcompany.typeform.com/to/def456"
                  }
                }
              ]
            },
            "message": null,
            "component": {
              "name": "TypeformFormList"
            }
          }

  - endpoint: /typeform/create_form
    examples:
      - scenario: "Create Simple Form"
        description: "Creates a basic form with a few fields"
        input_json: |
          {
            "form_data": {
              "title": "Simple Feedback Form",
              "type": "form",
              "settings": {
                "is_public": true,
                "language": "en"
              },
              "workspace": {
                "href": "https://api.typeform.com/workspaces/a1b2c3"
              },
              "welcome_screens": [
                {
                  "ref": "welcome-screen",
                  "title": "Welcome to our feedback form",
                  "properties": {
                    "description": "We value your opinion!",
                    "show_button": true,
                    "button_text": "Start"
                  }
                }
              ],
              "fields": [
                {
                  "ref": "name_field",
                  "title": "What's your name?",
                  "type": "short_text",
                  "validations": {
                    "required": true
                  }
                },
                {
                  "ref": "email_field",
                  "title": "What's your email address?",
                  "type": "email",
                  "validations": {
                    "required": true
                  }
                },
                {
                  "ref": "rating_field",
                  "title": "How would you rate our service?",
                  "type": "rating",
                  "properties": {
                    "steps": 5,
                    "shape": "star"
                  },
                  "validations": {
                    "required": true
                  }
                }
              ],
              "thankyou_screens": [
                {
                  "ref": "thank-you-screen",
                  "title": "Thanks for your feedback!",
                  "properties": {
                    "show_button": true,
                    "button_text": "Close",
                    "button_mode": "redirect",
                    "redirect_url": "https://www.example.com"
                  }
                }
              ]
            }
          }
        output_json: |
          {
            "status_code": 201,
            "data": {
              "id": "ghi789",
              "title": "Simple Feedback Form",
              "type": "form",
              "self": {
                "href": "https://api.typeform.com/forms/ghi789"
              },
              "_links": {
                "display": "https://yourcompany.typeform.com/to/ghi789"
              }
            },
            "message": "Form successfully created",
            "component": {
              "name": "TypeformFormCard"
            }
          }

