routes:
  - endpoint: /github/repositories
    examples:
      - scenario: "List User Repositories"
        description: "Retrieves a list of repositories for the authenticated user or a specific user"
        input_json: |
          {
            "username": "octocat",
            "type": "owner",
            "sort": "updated",
            "direction": "desc",
            "per_page": 5
          }
