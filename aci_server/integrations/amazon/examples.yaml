  - endpoint: /amazon/get_asin_from_url
    examples:
      - scenario: "Extract ASIN from URL"
        description: "Extract the Amazon ASIN from a product URL"
        input_json: |
          {
            "url": "https://www.amazon.com/dp/B01N5IB20Q"
          }
        output_json: |
          {
            "data": {
              "asin": "B01N5IB20Q"
            }
          }
      
      - scenario: "Extract ASIN from Complex URL"
        description: "Extract the Amazon ASIN from a URL with additional parameters"
        input_json: |
          {
            "url": "https://www.amazon.com/Nintendo-Switch-Neon-Blue-Red-Joy/dp/B01N5IB20Q/ref=sr_1_1?keywords=nintendo+switch&qid=1620149860&sr=8-1"
          }
        output_json: |
          {
            "data": {
              "asin": "B01N5IB20Q"
            }
          } 