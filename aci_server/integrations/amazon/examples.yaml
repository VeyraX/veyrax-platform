routes:
  - endpoint: /amazon/search_items
    examples:
      - scenario: "Basic Product Search"
        description: "Search for products related to a keyword"
        input_json: |
          {
            "keyword": "laptop"
          }
        output_json: |
          {
            "data": {
              "items": [
                {
                  "asin": "B07XVKZHLF",
                  "title": "Dell XPS 13 Laptop",
                  "description": "13.3-inch FHD Display, Intel Core i7, 16GB RAM, 512GB SSD",
                  "image_url": "https://example.com/dell-xps-image.jpg",
                  "feedback_count": "1250",
                  "rating": "4.5",
                  "price": "$1,299.99",
                  "url": "https://www.amazon.com/dp/B07XVKZHLF"
                },
                {
                  "asin": "B08N5KWB9H",
                  "title": "MacBook Air",
                  "description": "13-inch Retina Display, Apple M1 Chip, 8GB RAM, 256GB SSD",
                  "image_url": "https://example.com/macbook-air-image.jpg",
                  "feedback_count": "2100",
                  "rating": "4.8",
                  "price": "$999.99",
                  "url": "https://www.amazon.com/dp/B08N5KWB9H"
                }
              ]
            },
            "component": {
              "name": "AmazonProductCard"
            }
          }
      
