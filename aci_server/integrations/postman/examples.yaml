          }
        output_json: |
          {
            "data": {
              "environment": {
                "id": "c33cdbe9-707f-4e16-b41b-0370756bd462",
                "name": "New Environment",
                "uid": "31963804-c33cdbe9-707f-4e16-b41b-0370756bd462",
                "owner": null,
                "values": [
                  {
                    "key": "baseUrl",
                    "value": "https://new-api.example.com",
                    "enabled": true,
                    "type": "default"
