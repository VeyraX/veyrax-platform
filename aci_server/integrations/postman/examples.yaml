                "visibility": "personal",
                "createdAt": "2023-01-01T00:00:00.000Z",
                "updatedAt": "2023-01-02T00:00:00.000Z"
              }
            }
          }

  - endpoint: "/postman/create_workspace"
    examples:
      - scenario: "Create a new workspace"
        description: "Create a new Postman workspace"
        input_json: |
          {
            "name": "New Project Workspace",
            "type": "personal",
            "description": "A workspace for my new API project",
            "visibility": "personal"
          }
        output_json: |
          {
            "data": {
              "workspace": {
                "id": "c33cdbe9-707f-4e16-b41b-0370756bd462",
                "name": "New Project Workspace",
                "type": "personal",
                "description": "A workspace for my new API project",
                "visibility": "personal",
                "createdAt": "2023-05-15T10:30:00.000Z",
                "updatedAt": "2023-05-15T10:30:00.000Z"
              }
            }
          }

  - endpoint: "/postman/update_workspace"
    examples:
      - scenario: "Update a workspace"
        description: "Update an existing workspace with new data"
        input_json: |
          {
            "workspace_id": "12345678-1234-1234-1234-123456789012",
            "name": "Updated Project Workspace",
            "description": "Updated workspace description",
            "visibility": "team"
          }
        output_json: |
          {
            "data": {
              "workspace": {
                "id": "12345678-1234-1234-1234-123456789012",
                "name": "Updated Project Workspace",
                "type": "personal",
                "description": "Updated workspace description",
                "visibility": "team",
                "createdAt": "2023-01-01T00:00:00.000Z",
                "updatedAt": "2023-05-15T11:30:00.000Z"
              }
            }
          }

  - endpoint: "/postman/delete_workspace"
    examples:
      - scenario: "Delete a workspace"
        description: "Delete a workspace by its ID"
        input_json: |
          {
            "workspace_id": "12345678-1234-1234-1234-123456789012"
          }
        output_json: |
          {
            "data": {
              "id": "12345678-1234-1234-1234-123456789012",
              "uid": null,
              "name": "My Project Workspace"
            }
          }
