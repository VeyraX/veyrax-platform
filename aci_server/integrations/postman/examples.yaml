        description: "Update an existing environment with new data"
        input_json: |
          {
            "environment_id": "12345678-1234-1234-1234-123456789012",
            "environment": {
              "name": "Updated Environment",
              "values": [
                {
                  "key": "baseUrl",
                  "value": "https://updated-api.example.com",
