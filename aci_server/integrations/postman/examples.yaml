routes:
  - endpoint: "/postman/get_collections"
    examples:
      - scenario: "List all collections"
        description: "Get all collections for the authenticated user"
        input_json: |
          {
            "workspace_id": null
          }
        output_json: |
          {
            "data": {
              "collections": [
                {
                  "id": "12345678-1234-1234-1234-123456789012",
                  "name": "My API Collection",
                  "uid": "12345678",
                  "owner": "12345678",
                  "schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json",
                  "description": "A collection of API endpoints",
                  "forkLabel": null,
                  "isPublic": false,
                  "createdAt": "2023-01-01T00:00:00.000Z",
                  "updatedAt": "2023-01-02T00:00:00.000Z"
                },
                {
                  "id": "87654321-4321-4321-4321-210987654321",
                  "name": "Another Collection",
                  "uid": "87654321",
                  "owner": "12345678",
                  "schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json",
                  "description": "Another collection of API endpoints",
                  "forkLabel": null,
                  "isPublic": false,
                  "createdAt": "2023-01-03T00:00:00.000Z",
                  "updatedAt": "2023-01-04T00:00:00.000Z"
                }
              ]
            }
          }

  - endpoint: "/postman/get_collection"
    examples:
      - scenario: "Get collection by ID"
        description: "Get details of a specific collection by its ID"
        input_json: |
          {
            "collection_id": "12345678-1234-1234-1234-123456789012",
            "workspace_id": null
          }
        output_json: |
          {
            "data": {
              "collection": {
                "info": {
                  "id": "12345678-1234-1234-1234-123456789012",
                  "name": "My API Collection",
                  "uid": "12345678",
                  "owner": "12345678",
                  "schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json",
                  "description": "A collection of API endpoints",
                  "forkLabel": null,
                  "isPublic": false,
                  "createdAt": "2023-01-01T00:00:00.000Z",
                  "updatedAt": "2023-01-02T00:00:00.000Z"
                },
                "item": [
                  {
                    "id": "item-1",
                    "name": "Get Users",
                    "description": "Get a list of users",
                    "request": {
                      "method": "GET",
                      "url": {
                        "raw": "https://api.example.com/users",
                        "protocol": "https",
                        "host": ["api", "example", "com"],
                        "path": ["users"]
                      },
                      "header": []
                    },
                    "response": []
                  },
                  {
                    "id": "folder-1",
                    "name": "User Management",
                    "item": [
                      {
                        "id": "item-2",
                        "name": "Create User",
                        "request": {
                          "method": "POST",
                          "url": {
                            "raw": "https://api.example.com/users",
                            "protocol": "https",
                            "host": ["api", "example", "com"],
                            "path": ["users"]
                          },
                          "header": [
                            {
                              "key": "Content-Type",
                              "value": "application/json"
                            }
                          ],
                          "body": {
                            "mode": "raw",
                            "raw": "{\n  \"name\": \"John Doe\",\n  \"email\": \"john@example.com\"\n}"
                          }
                        },
                        "response": []
                      }
                    ]
                  }
                ],
                "variable": [
                  {
                    "key": "baseUrl",
                    "value": "https://api.example.com"
                  }
                ],
                "event": [],
                "auth": {
                  "type": "bearer",
                  "bearer": [
                    {
                      "key": "token",
                      "value": "{{authToken}}",
                      "type": "string"
                    }
                  ]
                }
              }
            }
          }

  - endpoint: "/postman/update_collection"
    examples:
      - scenario: "Update a collection"
        description: "Update an existing collection with new data"
        input_json: |
          {
            "collection_id": "12345678-1234-1234-1234-123456789012",
            "collection": {
              "info": {
                "name": "Updated API Collection",
                "description": "Updated collection description",
                "schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json"
              },
              "item": [
                {
                  "name": "Get Users",
                  "request": {
                    "method": "GET",
                    "url": {
                      "raw": "https://api.example.com/users",
                      "protocol": "https",
                      "host": ["api", "example", "com"],
                      "path": ["users"]
                    }
                  }
                }
              ]
            }
          }
        output_json: |
          {
            "data": {
              "collection": {
                "info": {
                  "id": "12345678-1234-1234-1234-123456789012",
                  "name": "Updated API Collection",
                  "uid": "12345678",
                  "owner": null,
                  "schema": null,
                  "description": null,
                  "forkLabel": null,
                  "isPublic": null,
                  "createdAt": null,
                  "updatedAt": null
                },
                "item": [],
                "variable": null,
                "event": null,
                "auth": null
              }
            }
          }

  - endpoint: "/postman/delete_collection"
    examples:
      - scenario: "Delete a collection"
        description: "Delete a collection by its ID"
        input_json: |
          {
            "collection_id": "12345678-1234-1234-1234-123456789012"
          }
        output_json: |
          {
            "data": {
              "id": "12345678-1234-1234-1234-123456789012",
              "uid": "12345678",
              "name": "My API Collection"
            }
          }

  - endpoint: "/postman/create_collection"
    examples:
      - scenario: "Create a new collection"
        description: "Create a new Postman collection"
        input_json: |
          {
            "collection": {
              "info": {
                "name": "New API Collection",
                "description": "A new collection of API endpoints",
                "schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json"
              },
              "item": [
                {
                  "name": "Get Users",
                  "request": {
                    "method": "GET",
                    "url": {
                      "raw": "https://api.example.com/users",
                      "protocol": "https",
                      "host": ["api", "example", "com"],
                      "path": ["users"]
                    }
                  }
                }
              ]
            }
          }
        output_json: |
          {
            "data": {
              "collection": {
                "info": {
                  "id": "c33cdbe9-707f-4e16-b41b-0370756bd462",
                  "name": "New API Collection",
                  "uid": "31963804-c33cdbe9-707f-4e16-b41b-0370756bd462",
                  "owner": null,
                  "schema": null,
                  "description": null,
                  "forkLabel": null,
                  "isPublic": null,
                  "createdAt": null,
                  "updatedAt": null
                },
                "item": [],
                "variable": null,
                "event": null,
                "auth": null
              }
            }
          }

  - endpoint: "/postman/get_environments"
    examples:
      - scenario: "List all environments"
        description: "Get all environments for the authenticated user"
        input_json: |
          {
            "workspace_id": null
          }
        output_json: |
          {
            "data": {
              "environments": [
                {
                  "id": "12345678-1234-1234-1234-123456789012",
                  "name": "Development Environment",
                  "uid": "12345678",
                  "owner": "12345678",
                  "values": [
                    {
                      "key": "baseUrl",
                      "value": "https://dev-api.example.com",
                      "enabled": true,
                      "type": "default"
                    },
                    {
                      "key": "apiKey",
                      "value": "dev-api-key",
                      "enabled": true,
                      "type": "secret"
                    }
                  ],
                  "isPublic": false,
                  "createdAt": "2023-01-01T00:00:00.000Z",
                  "updatedAt": "2023-01-02T00:00:00.000Z"
                },
                {
                  "id": "87654321-4321-4321-4321-210987654321",
                  "name": "Production Environment",
                  "uid": "87654321",
                  "owner": "12345678",
                  "values": [
                    {
                      "key": "baseUrl",
                      "value": "https://api.example.com",
                      "enabled": true,
                      "type": "default"
                    },
                    {
                      "key": "apiKey",
                      "value": "prod-api-key",
                      "enabled": true,
                      "type": "secret"
                    }
                  ],
                  "isPublic": false,
                  "createdAt": "2023-01-03T00:00:00.000Z",
                  "updatedAt": "2023-01-04T00:00:00.000Z"
                }
              ]
            }
