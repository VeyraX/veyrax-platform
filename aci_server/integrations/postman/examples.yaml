  - endpoint: "/postman/delete_environment"
    examples:
      - scenario: "Delete an environment"
        description: "Delete an environment by its ID"
        input_json: |
          {
            "environment_id": "12345678-1234-1234-1234-123456789012"
          }
        output_json: |
          {
            "data": {
              "id": "12345678-1234-1234-1234-123456789012",
              "uid": "12345678",
              "name": "Development Environment"
            }
          }

  - endpoint: "/postman/fork_collection"
    examples:
      - scenario: "Fork a public collection"
        description: "Fork the Salesforce Platform APIs collection to your workspace"
        input_json: |
          {
            "collection_id": "12345678-b32utmu-salesforce-platform-apis",
            "label": "My Salesforce APIs",
            "workspace": "your-workspace-id"
          }
        output_json: |
          {
            "data": {
              "collection": {
                "info": {
                  "id": "98765432-1234-5678-9012-345678901234",
                  "name": "Salesforce Platform APIs",
                  "uid": "98765432",
                  "owner": "12345678",
                  "schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json",
                  "description": "A collection of Salesforce Platform API endpoints",
                  "forkLabel": "My Salesforce APIs",
                  "isPublic": false,
                  "createdAt": "2023-05-15T10:30:00.000Z",
                  "updatedAt": "2023-05-15T10:30:00.000Z"
                },
                "item": [
                  {
                    "id": "folder-1",
                    "name": "REST API",
                    "item": []
                  },
                  {
                    "id": "folder-2",
                    "name": "SOAP API",
                    "item": []
                  },
                  {
                    "id": "folder-3",
                    "name": "Bulk API",
                    "item": []
                  }
                ],
                "variable": [],
                "event": [],
                "auth": {
                  "type": "oauth2",
                  "oauth2": []
                }
              }
            }
          }

  - endpoint: "/postman/get_workspaces"
    examples:
      - scenario: "List all workspaces"
        description: "Get all workspaces for the authenticated user"
        input_json: |
          {}
        output_json: |
          {
            "data": {
              "workspaces": [
                {
                  "id": "12345678-1234-1234-1234-123456789012",
                  "name": "My Personal Workspace",
                  "type": "personal",
                  "description": "My personal workspace for API development",
                  "visibility": "personal",
                  "createdAt": "2023-01-01T00:00:00.000Z",
                  "updatedAt": "2023-01-02T00:00:00.000Z"
                },
                {
                  "id": "87654321-4321-4321-4321-210987654321",
                  "name": "Team Workspace",
                  "type": "team",
                  "description": "Shared workspace for team collaboration",
                  "visibility": "team",
                  "createdAt": "2023-01-03T00:00:00.000Z",
                  "updatedAt": "2023-01-04T00:00:00.000Z"
                }
              ]
            }
          }

  - endpoint: "/postman/get_workspace"
    examples:
      - scenario: "Get workspace by ID"
        description: "Get details of a specific workspace by its ID"
        input_json: |
          {
            "workspace_id": "12345678-1234-1234-1234-123456789012"
          }
        output_json: |
          {
            "data": {
              "workspace": {
                "id": "12345678-1234-1234-1234-123456789012",
