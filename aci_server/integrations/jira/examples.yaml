              "updated": "2023-05-20T15:45:22Z",
              "assignee": {
                "display_name": "John Smith",
                "account_id": "5e12345678abcdef09876543"
              },
              "reporter": "Jane Doe",
              "priority": {
                "name": "Medium",
                "id": "3",
                "iconUrl": "https://company.atlassian.net/images/icons/priorities/medium.svg"
              },
              "url": "https://company.atlassian.net/browse/PROJ-126",
              "comments": [],
              "labels": [],
              "components": []
            },
            "message": "Subtask successfully created",
            "component": {
              "name": "JiraIssueCard"
            }
          }

  - endpoint: /jira/update_issue
    examples:
      - scenario: "Update an Existing Issue"
        description: "Updates the specified fields of an existing issue"
        input_json: |
          {
            "issue_id": "PROJ-123",
            "update_args": {
              "summary": "Updated Test Issue Summary",
              "description": "This is an updated description with additional details.",
              "assignee_id": "5e98765432abcdef12345678",
              "priority_id": "2",
              "labels": ["feature", "ui", "updated"]
            }
          }
        output_json: |
          {
            "data": {
              "id": "10023",
              "key": "PROJ-123",
              "summary": "Updated Test Issue Summary",
              "description": "This is an updated description with additional details.",
              "status": {
                "name": "In Progress",
                "statusCategory": {
                  "name": "In Progress",
                  "colorName": "yellow"
                }
              },
              "created": "2023-05-15T09:45:23Z",
              "updated": "2023-05-21T10:12:33Z",
              "assignee": {
                "display_name": "Sarah Johnson",
                "account_id": "5e98765432abcdef12345678"
              },
              "reporter": "Jane Doe",
              "priority": {
                "name": "High",
                "id": "2",
                "iconUrl": "https://company.atlassian.net/images/icons/priorities/high.svg"
              },
              "url": "https://company.atlassian.net/browse/PROJ-123",
              "comments": [
                {
                  "id": "10001",
                  "body": "I've started working on this feature",
                  "author": {
                    "display_name": "John Smith",
                    "account_id": "5e12345678abcdef09876543"
                  },
                  "created": "2023-05-15T10:15:23Z",
                  "updated": "2023-05-15T10:15:23Z"
                }
              ],
              "labels": ["feature", "ui", "updated"],
              "components": ["frontend"]
            },
            "message": "Issue successfully updated",
            "component": {
              "name": "JiraIssueCard"
            }
          }

  - endpoint: /jira/delete_issue
    examples:
      - scenario: "Delete an Issue"
        description: "Permanently removes the specified issue"
        input_json: |
          {
            "issue_id": "PROJ-126"
          }
        output_json: |
          {
            "status": "success",
            "message": "Issue PROJ-126 successfully deleted"
          }

