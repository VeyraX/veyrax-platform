routes:
  - endpoint: /jira/get_issues
    examples:
      - scenario: "List Jira Issues with Filters"
        description: "Retrieves a list of issues with optional filtering parameters"
        input_json: |
          {
            "filters": {
              "project_id": "10000",
              "status_id": null,
              "assignee": null,
              "created_after": "2023-01-01T00:00:00Z",
              "created_before": null,
              "priority_id": null,
              "max_results": 20
            }
          }
        output_json: |
          {
            "data": {
              "issues": [
                {
                  "key": "PROJ-123",
                  "summary": "Implement new feature",
                  "description": "We need to implement this new feature according to the design specs",
                  "status": {
                    "name": "In Progress",
                    "statusCategory": {
                      "name": "In Progress",
                      "colorName": "yellow"
                    }
                  },
                  "created": "2023-05-15T09:45:23Z",
                  "updated": "2023-05-16T14:32:17Z",
                  "assignee": {
                    "display_name": "John Smith",
                    "account_id": "5e12345678abcdef09876543"
                  },
                  "reporter": "Jane Doe",
                  "priority": {
                    "name": "Medium",
                    "id": "3",
                    "iconUrl": "https://company.atlassian.net/images/icons/priorities/medium.svg"
                  },
                  "url": "https://company.atlassian.net/browse/PROJ-123"
                },
                {
                  "key": "PROJ-124",
                  "summary": "Fix critical bug in login",
                  "description": "Users are experiencing intermittent login failures",
                  "status": {
                    "name": "To Do",
                    "statusCategory": {
                      "name": "To Do",
                      "colorName": "blue"
                    }
                  },
                  "created": "2023-05-17T11:23:45Z",
                  "updated": "2023-05-17T11:23:45Z",
                  "assignee": null,
                  "reporter": "Jane Doe",
                  "priority": {
                    "name": "High",
                    "id": "2",
                    "iconUrl": "https://company.atlassian.net/images/icons/priorities/high.svg"
                  },
                  "url": "https://company.atlassian.net/browse/PROJ-124"
                }
              ],
              "total": 2,
              "start_at": 0
            },
            "message": null,
            "component": {
              "name": "JiraIssueCard"
            }
          }

  - endpoint: /jira/get_issue
    examples:
      - scenario: "Get Specific Issue Details"
        description: "Retrieves detailed information about a specific issue by ID or key"
        input_json: |
          {
            "issue_id": "PROJ-123"
          }
        output_json: |
          {
            "data": {
              "id": "10023",
              "key": "PROJ-123",
              "summary": "Implement new feature",
              "description": "We need to implement this new feature according to the design specs",
              "status": {
                "name": "In Progress",
                "statusCategory": {
                  "name": "In Progress",
                  "colorName": "yellow"
                }
              },
              "created": "2023-05-15T09:45:23Z",
              "updated": "2023-05-16T14:32:17Z",
              "assignee": {
                "display_name": "John Smith",
                "account_id": "5e12345678abcdef09876543",
                "email": "john.smith@example.com"
              },
              "reporter": "Jane Doe",
              "priority": {
                "name": "Medium",
                "id": "3",
                "iconUrl": "https://company.atlassian.net/images/icons/priorities/medium.svg"
              },
              "url": "https://company.atlassian.net/browse/PROJ-123",
              "comments": [
                {
                  "id": "10001",
                  "body": "I've started working on this feature",
                  "author": {
                    "display_name": "John Smith",
                    "account_id": "5e12345678abcdef09876543"
                  },
                  "created": "2023-05-15T10:15:23Z",
                  "updated": "2023-05-15T10:15:23Z"
                }
              ],
              "labels": ["feature", "ui"],
              "components": ["frontend"]
            },
            "message": null,
            "component": {
              "name": "JiraIssueCard"
            }
          }

  - endpoint: /jira/create_issue
    examples:
      - scenario: "Create a New Issue"
        description: "Creates a new issue with specified attributes"
        input_json: |
          {
            "issue_args": {
              "project_id": "10000",
              "summary": "Implement authentication service",
              "issue_type_id": "10002",
              "description": "Create a new authentication service with OAuth2 support",
              "assignee_id": "5e12345678abcdef09876543",
              "priority_id": "3",
              "labels": ["backend", "security"],
              "components": ["auth-service"]
            }
          }
        output_json: |
          {
            "data": {
              "id": "10024",
              "key": "PROJ-125",
              "summary": "Implement authentication service",
              "description": "Create a new authentication service with OAuth2 support",
              "status": {
                "name": "To Do",
                "statusCategory": {
                  "name": "To Do",
                  "colorName": "blue"
                }
              },
              "created": "2023-05-20T15:32:47Z",
              "updated": "2023-05-20T15:32:47Z",
              "assignee": {
                "display_name": "John Smith",
                "account_id": "5e12345678abcdef09876543"
              },
              "reporter": "Jane Doe",
              "priority": {
                "name": "Medium",
                "id": "3",
                "iconUrl": "https://company.atlassian.net/images/icons/priorities/medium.svg"
              },
              "url": "https://company.atlassian.net/browse/PROJ-125",
              "comments": [],
              "labels": ["backend", "security"],
              "components": ["auth-service"]
            },
            "message": "Issue successfully created",
            "component": {
              "name": "JiraIssueCard"
            }
          }

      - scenario: "Create a Subtask"
        description: "Creates a subtask for an existing parent issue"
        input_json: |
          {
            "issue_args": {
              "project_id": "10000",
              "summary": "Implement token refresh mechanism",
              "issue_type_id": "10003",
              "description": "Add token refresh capability to the authentication service",
              "parent_issue_key": "PROJ-125",
              "assignee_id": "5e12345678abcdef09876543",
              "priority_id": "3"
            }
          }
        output_json: |
          {
            "data": {
              "id": "10025",
              "key": "PROJ-126",
              "summary": "Implement token refresh mechanism",
              "description": "Add token refresh capability to the authentication service",
              "status": {
                "name": "To Do",
                "statusCategory": {
                  "name": "To Do",
                  "colorName": "blue"
                }
              },
