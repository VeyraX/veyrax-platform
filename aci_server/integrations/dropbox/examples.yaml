              "has_more": false
            },
            "message": null,
            "component": {
              "name": "DropboxFileCard"
            }
          }

  - endpoint: /dropbox/search_continue
    examples:
      - scenario: "Continue Search Results"
        description: "Continues a search operation using a cursor from a previous search"
        input_json: |
          {
            "cursor": "AAHdkj38f2j38fj38fj"
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "files": [
                {
                  "id": "id:k39dk39dk2kd29dk",
