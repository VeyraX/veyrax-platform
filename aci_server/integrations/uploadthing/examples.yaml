  - endpoint: /uploadthing/upload_from_url
    examples:
      - scenario: "Upload File from URL"
        description: "Download a file from a URL and upload it to UploadThing"
        input_json: |
          {
            "url": "https://example.com/sample-file.pdf",
            "customId": "url-upload-123",
            "callbackUrl": "https://myapp.com/callback",
            "callbackSlug": "url-upload-complete",
            "routeConfig": ["blob"],
            "metadata": {
              "source": "url-upload",
              "userId": "user_789"
            }
          }
        output_json: |
          {
            "data": [
              {
                "key": "file_url_12345",
                "fileName": "sample-file.pdf",
                "fileType": "application/pdf",
                "fileUrl": "https://uploadthing.com/f/file_url_12345-sample-file.pdf",
                "contentDisposition": "inline",
                "pollingJwt": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
                "pollingUrl": "https://api.uploadthing.com/v6/pollUpload/file_url_12345",
                "customId": "url-upload-123",
                "url": "https://s3.amazonaws.com/uploadthing/...",
                "fields": {
                  "key": "file_url_12345",
                  "Content-Type": "application/pdf",
                  "Content-Disposition": "inline; filename=\"sample-file.pdf\"",
                  "bucket": "uploadthing",
                  "X-Amz-Algorithm": "AWS4-HMAC-SHA256",
