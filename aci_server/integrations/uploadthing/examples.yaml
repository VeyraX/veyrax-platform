  - endpoint: /uploadthing/rename_files
    examples:
      - scenario: "Rename Multiple Files"
        description: "Rename multiple files by their file keys"
        input_json: |
          {
            "updates": [
              {
                "fileKey": "file_123456789",
                "newName": "renamed-document.pdf"
              },
              {
                "fileKey": "file_987654321",
                "newName": "renamed-image.png"
              }
            ]
          }
        output_json: |
          {
            "data": {
              "success": true,
              "renamedCount": 2
            },
            "component": {
              "name": "UploadThingRenameResult",
              "type": "status",
              "title": "File Rename Status",
              "status": "Success",
              "message": "Successfully renamed 2 files"
            }
          }
      - scenario: "Rename Single File"
        description: "Rename a single file by its file key"
        input_json: |
          {
            "updates": [
              {
                "fileKey": "file_abcdefg",
                "newName": "important-report.docx"
              }
            ]
          }
        output_json: |
          {
            "data": {
              "success": true,
              "renamedCount": 1
            },
            "component": {
              "name": "UploadThingRenameResult",
              "type": "status",
              "title": "File Rename Status",
              "status": "Success",
              "message": "Successfully renamed 1 file"
            }
          }
          
  - endpoint: /uploadthing/delete_files
    examples:
      - scenario: "Delete Files by Keys"
        description: "Delete multiple files by their file keys"
        input_json: |
          {
            "fileKeys": ["file_123456789", "file_987654321"]
          }
        output_json: |
          {
            "data": {
              "success": true,
              "deletedCount": 2
            },
            "component": {
              "name": "UploadThingDeleteResult",
              "type": "status",
              "title": "File Deletion Status",
              "status": "Success",
              "message": "Successfully marked 2 files for deletion"
            }
          }
      - scenario: "Delete Files by Custom IDs"
        description: "Delete multiple files by their custom IDs"
        input_json: |
          {
            "customIds": ["my-custom-id-1", "document-21"]
          }
        output_json: |
          {
            "data": {
              "success": true,
              "deletedCount": 2
            },
            "component": {
              "name": "UploadThingDeleteResult",
              "type": "status",
              "title": "File Deletion Status",
              "status": "Success",
              "message": "Successfully marked 2 files for deletion"
            }
          }
          
