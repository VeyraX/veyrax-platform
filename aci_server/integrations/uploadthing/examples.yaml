                "size": 10485760,
                "customId": "presentation-2024-q1"
              }
            ],
            "routeConfig": {
              "pdf": {
                "maxFileSize": "8MB"
              },
              "doc": {
                "maxFileSize": "16MB"
              }
            },
            "metadata": {
              "projectId": "project_789",
              "departmentId": "dept_123"
            }
          }
        output_json: |
          {
            "data": [
              {
                "key": "file_abcdefg",
                "fileName": "report.pdf",
                "fileType": "application/pdf",
                "fileUrl": "https://uploadthing.com/f/file_abcdefg-report.pdf",
                "contentDisposition": "inline",
                "pollingJwt": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJmaWxlS2V5IjoiZmlsZV9hYmNkZWZnIiwiZXhwIjoxNzE5ODkwNjIxfQ.jM9PydhJPzrKaYIiHbm52Ek8JZ4J1Z6Y1xG8G6Ukr-E",
                "pollingUrl": "https://api.uploadthing.com/v6/pollUpload/file_abcdefg",
                "customId": "report-2024-q1",
                "url": "https://uploadthing-presigned-url.s3.amazonaws.com/file_abcdefg",
                "fields": {
                  "Content-Type": "application/pdf",
                  "key": "file_abcdefg",
