routes:
  - endpoint: /uploadthing/list_files
    examples:
      - scenario: "List Files"
        description: "List files with default parameters"
        input_json: |
          {
            "limit": 500,
            "offset": 0
          }
        output_json: |
          {
            "data": {
              "hasMore": false,
              "files": [
                {
                  "id": "file_123456789",
                  "customId": "my-custom-id-1",
                  "key": "file_123456789",
                  "name": "document.pdf",
                  "status": "Uploaded",
                  "size": 1024567,
                  "uploadedAt": 1717213483400
                },
                {
                  "id": "file_987654321",
                  "customId": null,
                  "key": "file_987654321",
                  "name": "image.png",
                  "status": "Uploaded",
                  "size": 2048123,
                  "uploadedAt": 1717213383400
                }
              ]
            },
            "component": {
              "name": "UploadThingFileList",
              "type": "list",
              "title": "UploadThing Files",
              "items": [
                {
                  "title": "document.pdf",
                  "subtitle": "Uploaded",
                  "description": "CustomID: my-custom-id-1",
                  "url": "file_123456789",
                  "size": "1 MB",
                  "date": "May 31, 2024"
                },
                {
                  "title": "image.png",
                  "subtitle": "Uploaded",
                  "description": "",
                  "url": "file_987654321",
                  "size": "2 MB",
                  "date": "May 31, 2024"
                }
              ]
            }
          }
      - scenario: "List Files with Pagination"
        description: "List files with custom limit and offset"
        input_json: |
          {
            "limit": 10,
            "offset": 20
          }
        output_json: |
          {
            "data": {
              "hasMore": true,
              "files": [
                {
                  "id": "file_abcdefg",
                  "customId": "document-21",
                  "key": "file_abcdefg",
                  "name": "report.docx",
                  "status": "Uploaded",
                  "size": 5048576,
                  "uploadedAt": 1717213283400
                }
              ]
            },
            "component": {
              "name": "UploadThingFileList",
              "type": "list",
              "title": "UploadThing Files",
              "items": [
                {
                  "title": "report.docx",
                  "subtitle": "Uploaded",
                  "description": "CustomID: document-21",
                  "url": "file_abcdefg",
                  "size": "5 MB",
                  "date": "May 31, 2024"
                }
              ]
            }
          }
          
  - endpoint: /uploadthing/poll_upload
    examples:
      - scenario: "Poll Upload - Still Working"
        description: "Check the status of an upload that is still in progress"
        input_json: |
          {
            "fileKey": "file_123456789"
          }
        output_json: |
          {
            "data": {
              "status": "still working"
            },
            "component": {
              "name": "UploadThingFileDetail",
              "type": "detail",
              "title": "Upload Status",
              "status": "Processing",
              "description": "Your file is currently being processed. Please check back later."
            }
          }
      - scenario: "Poll Upload - Completed"
        description: "Check the status of a completed upload"
        input_json: |
          {
            "fileKey": "file_abcdefg"
          }
        output_json: |
          {
            "data": {
              "status": "done",
              "file": {
                "fileKey": "file_abcdefg",
                "fileName": "presentation.pptx",
                "fileSize": 3145728,
                "fileType": "application/vnd.openxmlformats-officedocument.presentationml.presentation",
                "fileUrl": "https://uploadthing.com/f/file_abcdefg-presentation.pptx",
                "customId": "presentation-001",
                "callbackUrl": "https://example.com/callback",
                "callbackSlug": "presentation-upload"
              },
              "metadata": {
                "userId": "user_123",
                "projectId": "project_456"
              },
              "callbackData": {
                "processed": true,
                "thumbnailUrl": "https://example.com/thumbnails/presentation-001.jpg"
              }
            },
            "component": {
              "name": "UploadThingFileDetail",
              "type": "detail",
              "title": "Upload Complete",
              "subtitle": "presentation.pptx",
              "status": "Complete",
              "url": "https://uploadthing.com/f/file_abcdefg-presentation.pptx",
              "size": "3 MB",
              "metadata": {
                "userId": "user_123",
                "projectId": "project_456"
              }
            }
          }
          
  - endpoint: /uploadthing/get_server_callback
    examples:
      - scenario: "Get Server Callback - Still Waiting"
        description: "Check if server callback data is available but it's still waiting"
        input_json: |
          {}
        headers: |
          {
            "Authorization": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJmaWxlS2V5IjoiZmlsZV8xMjM0NTY3ODkiLCJleHAiOjE3MTk4OTA2MjF9.3sKgFEMFGgNPBouoL9Pm9_hJZYvuN9uVZ5jjlLbqTFI"
          }
        output_json: |
          {
            "data": {
              "status": "still waiting"
            },
            "component": {
              "name": "UploadThingCallbackStatus",
              "type": "status",
              "title": "Callback Status",
              "status": "Waiting",
              "message": "Waiting for callback data to be set by the server."
            }
          }
      - scenario: "Get Server Callback - Ready"
        description: "Check if server callback data is available and it's ready"
        input_json: |
          {}
        headers: |
          {
            "Authorization": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJmaWxlS2V5IjoiZmlsZV9hYmNkZWZnIiwiZXhwIjoxNzE5ODkwNjIxfQ.jM9PydhJPzrKaYIiHbm52Ek8JZ4J1Z6Y1xG8G6Ukr-E"
          }
        output_json: |
          {
            "data": {
              "status": "ok"
            },
            "component": {
              "name": "UploadThingCallbackStatus",
              "type": "status",
              "title": "Callback Status",
              "status": "Ready",
              "message": "Callback data is ready and available."
            }
          }
          
  - endpoint: /uploadthing/set_server_callback
    examples:
      - scenario: "Set Server Callback"
        description: "Set callback data for a file"
        input_json: |
          {
            "fileKey": "file_123456789",
            "callbackData": {
              "processed": true,
              "thumbnailUrl": "https://example.com/thumbnails/file_123456789.jpg",
              "metadata": {
                "width": 1920,
                "height": 1080,
                "format": "jpg"
              }
            }
          }
        output_json: |
          {
            "data": {
              "status": "ok"
            },
            "component": {
              "name": "UploadThingCallbackStatus",
              "type": "status",
              "title": "Callback Status",
              "status": "Ready",
              "message": "Callback data has been set successfully."
            }
          }
          
  - endpoint: /uploadthing/prepare_upload
    examples:
      - scenario: "Prepare Single File Upload"
        description: "Prepare a presigned URL for a single file upload"
        input_json: |
          {
            "callbackUrl": "https://example.com/callback",
            "callbackSlug": "image-upload",
            "files": [
              {
                "name": "profile.jpg",
                "size": 1048576,
                "customId": "user-profile-123"
              }
            ],
            "routeConfig": ["image"],
            "metadata": {
              "userId": "user_123",
              "albumId": "album_456"
            }
          }
        output_json: |
          {
            "data": [
              {
                "key": "file_123456789",
                "fileName": "profile.jpg",
                "fileType": "image/jpeg",
                "fileUrl": "https://uploadthing.com/f/file_123456789-profile.jpg",
                "contentDisposition": "inline",
                "pollingJwt": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJmaWxlS2V5IjoiZmlsZV8xMjM0NTY3ODkiLCJleHAiOjE3MTk4OTA2MjF9.3sKgFEMFGgNPBouoL9Pm9_hJZYvuN9uVZ5jjlLbqTFI",
                "pollingUrl": "https://api.uploadthing.com/v6/pollUpload/file_123456789",
                "customId": "user-profile-123",
                "url": "https://uploadthing-presigned-url.s3.amazonaws.com/file_123456789",
                "fields": {
                  "Content-Type": "image/jpeg",
                  "key": "file_123456789",
                  "bucket": "uploadthing"
                }
              }
            ],
            "component": {
              "name": "UploadThingPreparedUpload",
              "type": "upload",
              "title": "Prepared Uploads",
              "uploads": [
                {
                  "fileName": "profile.jpg",
                  "fileType": "image/jpeg",
                  "fileSize": "1 MB",
                  "uploadType": "Single Part",
                  "key": "file_123456789"
                }
              ]
            }
          }
      - scenario: "Prepare Multiple Files Upload"
        description: "Prepare presigned URLs for multiple files upload"
        input_json: |
          {
            "callbackUrl": "https://example.com/callback",
            "callbackSlug": "document-upload",
            "files": [
              {
                "name": "report.pdf",
                "size": 5242880,
                "customId": "report-2024-q1"
