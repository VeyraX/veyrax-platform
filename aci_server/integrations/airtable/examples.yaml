                  "id": "recBBBBBBBBBBBBBB",
                  "deleted": true
                }
              ]
            },
            "component": {
              "name": "AirtableDeletedRecordsList"
            }
          }

  - endpoint: /airtable/upload_attachment
    examples:
      - scenario: "Upload Attachment"
        description: "Upload a file attachment to a record"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "record_id": "recXXXXXXXXXXXXXX",
            "attachment_field": "Attachments",
            "content_type": "text/plain",
            "file": "SGVsbG8gd29ybGQ=",
            "filename": "example.txt"
          }
        output_json: |
          {
            "data": {
              "id": "recXXXXXXXXXXXXXX",
              "createdTime": "2023-05-10T15:32:42.000Z",
              "fields": {
                "Name": "Project Alpha",
                "Status": "Complete",
                "Score": 100,
                "Description": "This is the alpha project description",
                "Attachments": [
                  {
                    "id": "attDDDDDDDDDDDDDD",
                    "url": "https://v5.airtableusercontent.com/v3/u/20/20/1715000000000/example.txt",
                    "filename": "example.txt",
                    "size": 11,
                    "type": "text/plain"
                  }
                ]
              }
            },
            "component": {
              "name": "AirtableRecord"
            }
          }

  - endpoint: /airtable/sync_csv
    examples:
      - scenario: "Sync CSV Data"
        description: "Sync CSV data to a table"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id_or_name": "tblXXXXXXXXXXXXXX",
            "api_endpoint_sync_id": "synXXXXXXXXXXXXXX",
            "csv_data": "Name,Status,Score\nProject One,Planned,0\nProject Two,Planned,0"
          }
        output_json: |
          {
            "data": {
              "success": true
            },
            "component": {
              "name": "AirtableSyncCSVResponse"
            }
          }

  - endpoint: /airtable/create_field
    examples:
      - scenario: "Create Text Field"
        description: "Create a new single line text field in a table"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id": "tblXXXXXXXXXXXXXX",
            "name": "New Text Field",
            "type": "singleLineText",
            "description": "A new text field for storing additional information"
          }
        output_json: |
          {
            "data": {
              "id": "fldDDDDDDDDDDDDDD",
              "name": "New Text Field",
              "type": "singleLineText",
              "description": "A new text field for storing additional information"
            }
          }

      - scenario: "Create Checkbox Field"
        description: "Create a new checkbox field with custom icon and color"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id": "tblXXXXXXXXXXXXXX",
            "name": "Task Completed",
            "type": "checkbox",
            "description": "Mark when the task is completed",
            "options": {
              "color": "greenBright",
              "icon": "check"
            }
          }
        output_json: |
          {
            "data": {
              "id": "fldEEEEEEEEEEEEEE",
              "name": "Task Completed",
              "type": "checkbox",
              "description": "Mark when the task is completed",
              "options": {
                "color": "greenBright",
                "icon": "check"
              }
            }
          }

      - scenario: "Create Single Select Field"
        description: "Create a new single select field with predefined options"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id": "tblXXXXXXXXXXXXXX",
            "name": "Status",
            "type": "singleSelect",
            "description": "Current status of the project",
            "options": {
              "choices": [
                {
                  "name": "Not Started",
                  "color": "redBright"
                },
                {
                  "name": "In Progress",
                  "color": "yellowBright"
                },
                {
                  "name": "Completed",
                  "color": "greenBright"
                }
              ]
            }
          }
        output_json: |
          {
            "data": {
              "id": "fldFFFFFFFFFFFFFF",
              "name": "Status",
              "type": "singleSelect",
              "description": "Current status of the project",
              "options": {
                "choices": [
                  {
                    "id": "selXXXXXXXXXXXXXX",
                    "name": "Not Started",
                    "color": "redBright"
                  },
                  {
                    "id": "selYYYYYYYYYYYYYY",
                    "name": "In Progress",
                    "color": "yellowBright"
                  },
                  {
                    "id": "selZZZZZZZZZZZZZZ",
                    "name": "Completed",
                    "color": "greenBright"
                  }
                ]
              }
            }
          }

  - endpoint: /airtable/update_field
    examples:
      - scenario: "Update Field Name"
        description: "Update the name of an existing field"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id": "tblXXXXXXXXXXXXXX",
