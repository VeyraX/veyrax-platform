      - scenario: "Update Field Name and Description"
        description: "Update both the name and description of an existing field"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id": "tblXXXXXXXXXXXXXX",
            "column_id": "fldEEEEEEEEEEEEEE",
            "name": "Completed Status",
            "description": "Indicates whether the task has been completed or not"
          }
        output_json: |
          {
            "data": {
              "id": "fldEEEEEEEEEEEEEE",
              "name": "Completed Status",
              "type": "checkbox",
              "description": "Indicates whether the task has been completed or not",
              "options": {
                "color": "greenBright",
                "icon": "check"
              }
            }
          }

  - endpoint: /airtable/create_table
