routes:
  - endpoint: /airtable/list_records
    examples:
      - scenario: "List Records with Filters"
        description: "List records with sorting and filtering options"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id_or_name": "tblXXXXXXXXXXXXXX",
            "max_records": 3,
            "sort": [
              {
                "field": "Name",
                "direction": "asc"
              }
            ],
            "filter_by_formula": "AND({Status}='Complete', {Score}>80)"
          }
        output_json: |
          {
            "data": {
              "records": [
                {
                  "id": "recXXXXXXXXXXXXXX",
                  "createdTime": "2023-05-10T15:32:42.000Z",
                  "fields": {
                    "Name": "Project Alpha",
                    "Status": "Complete",
                    "Score": 95,
                    "Description": "This is the alpha project description"
                  }
                },
                {
                  "id": "recYYYYYYYYYYYYYY",
                  "createdTime": "2023-05-12T09:45:21.000Z",
                  "fields": {
                    "Name": "Project Beta",
                    "Status": "Complete",
                    "Score": 88,
                    "Description": "This is the beta project description"
                  }
                }
              ],
              "offset": "recYYYYYYYYYYYYYY"
            },
            "component": {
              "name": "AirtableRecordsList"
            }
          }

  - endpoint: /airtable/get_record
    examples:
      - scenario: "Get Single Record"
        description: "Retrieve a single record by its ID"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id_or_name": "tblXXXXXXXXXXXXXX",
            "record_id": "recXXXXXXXXXXXXXX"
          }
        output_json: |
          {
            "data": {
              "id": "recXXXXXXXXXXXXXX",
              "createdTime": "2023-05-10T15:32:42.000Z",
              "fields": {
                "Name": "Project Alpha",
                "Status": "Complete",
                "Score": 95,
                "Description": "This is the alpha project description"
              }
            },
            "component": {
              "name": "AirtableRecord"
            }
          }

  - endpoint: /airtable/create_record
    examples:
      - scenario: "Create Single Record"
        description: "Create a new record in a table"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id_or_name": "tblXXXXXXXXXXXXXX",
            "fields": {
              "Name": "Project Delta",
              "Status": "In Progress",
              "Score": 75,
              "Description": "This is the delta project description"
            },
            "typecast": true
          }
        output_json: |
          {
            "data": {
              "id": "recZZZZZZZZZZZZZZ",
              "createdTime": "2023-05-15T10:25:30.000Z",
              "fields": {
                "Name": "Project Delta",
                "Status": "In Progress",
                "Score": 75,
                "Description": "This is the delta project description"
              }
            },
            "component": {
              "name": "AirtableRecord"
            }
          }

  - endpoint: /airtable/create_records
    examples:
      - scenario: "Create Multiple Records"
        description: "Create multiple records in a table"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id_or_name": "tblXXXXXXXXXXXXXX",
            "records": [
              {
                "fields": {
                  "Name": "Project Epsilon",
                  "Status": "Planned",
                  "Score": 0,
                  "Description": "This is the epsilon project description"
                }
              },
              {
                "fields": {
                  "Name": "Project Zeta",
                  "Status": "Planned",
                  "Score": 0,
                  "Description": "This is the zeta project description"
                }
              }
            ],
            "typecast": true
          }
        output_json: |
          {
            "data": {
              "records": [
                {
                  "id": "recAAAAAAAAAAAA",
                  "createdTime": "2023-05-15T12:35:22.000Z",
                  "fields": {
                    "Name": "Project Epsilon",
                    "Status": "Planned",
                    "Score": 0,
                    "Description": "This is the epsilon project description"
                  }
                },
                {
                  "id": "recBBBBBBBBBBBBBB",
                  "createdTime": "2023-05-15T12:35:22.000Z",
                  "fields": {
                    "Name": "Project Zeta",
                    "Status": "Planned",
                    "Score": 0,
                    "Description": "This is the zeta project description"
                  }
                }
              ]
            },
            "component": {
              "name": "AirtableRecordsList"
            }
          }

  - endpoint: /airtable/update_record
    examples:
      - scenario: "Update Single Record"
        description: "Update a record in a table"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id_or_name": "tblXXXXXXXXXXXXXX",
            "record_id": "recXXXXXXXXXXXXXX",
            "fields": {
              "Status": "In Review",
              "Score": 92
