            }
          }

  - endpoint: /airtable/update_records
    examples:
      - scenario: "Update Multiple Records"
        description: "Update multiple records in a table"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id_or_name": "tblXXXXXXXXXXXXXX",
            "records": [
              {
                "id": "recXXXXXXXXXXXXXX",
                "fields": {
                  "Status": "Complete",
                  "Score": 100
                }
              },
              {
                "id": "recYYYYYYYYYYYYYY",
                "fields": {
                  "Status": "In Review",
                  "Score": 90
                }
              }
            ],
            "is_patch": true
          }
        output_json: |
          {
            "data": {
              "records": [
                {
                  "id": "recXXXXXXXXXXXXXX",
                  "createdTime": "2023-05-10T15:32:42.000Z",
                  "fields": {
                    "Name": "Project Alpha",
                    "Status": "Complete",
                    "Score": 100,
                    "Description": "This is the alpha project description"
                  }
                },
                {
                  "id": "recYYYYYYYYYYYYYY",
                  "createdTime": "2023-05-12T09:45:21.000Z",
                  "fields": {
                    "Name": "Project Beta",
                    "Status": "In Review",
                    "Score": 90,
                    "Description": "This is the beta project description"
                  }
                }
              ]
            },
            "component": {
              "name": "AirtableRecordsList"
            }
          }

  - endpoint: /airtable/update_records
    examples:
      - scenario: "Upsert Records"
        description: "Update or insert records based on field matching"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id_or_name": "tblXXXXXXXXXXXXXX",
            "records": [
              {
                "fields": {
                  "Name": "Project Alpha",
                  "Status": "Complete",
                  "Score": 100
                }
              },
              {
                "fields": {
                  "Name": "Project Gamma",
                  "Status": "New",
                  "Score": 0,
                  "Description": "This is a new project"
                }
              }
            ],
            "perform_upsert": {
              "fieldsToMergeOn": ["Name"]
            },
            "is_patch": true
          }
        output_json: |
          {
            "data": {
              "records": [
                {
                  "id": "recXXXXXXXXXXXXXX",
                  "createdTime": "2023-05-10T15:32:42.000Z",
                  "fields": {
                    "Name": "Project Alpha",
                    "Status": "Complete",
                    "Score": 100,
                    "Description": "This is the alpha project description"
                  }
                },
                {
                  "id": "recCCCCCCCCCCCCCC",
                  "createdTime": "2023-05-16T14:20:10.000Z",
                  "fields": {
                    "Name": "Project Gamma",
                    "Status": "New",
                    "Score": 0,
                    "Description": "This is a new project"
                  }
                }
              ],
              "createdRecords": ["recCCCCCCCCCCCCCC"],
              "updatedRecords": ["recXXXXXXXXXXXXXX"]
            },
            "component": {
              "name": "AirtableRecordsList"
            }
          }

  - endpoint: /airtable/delete_record
    examples:
      - scenario: "Delete Single Record"
        description: "Delete a record from a table"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id_or_name": "tblXXXXXXXXXXXXXX",
            "record_id": "recZZZZZZZZZZZZZZ"
          }
        output_json: |
          {
            "data": {
              "id": "recZZZZZZZZZZZZZZ",
              "deleted": true
            },
            "component": {
              "name": "AirtableDeletedRecord"
            }
          }

  - endpoint: /airtable/delete_records
    examples:
      - scenario: "Delete Multiple Records"
        description: "Delete multiple records from a table"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id_or_name": "tblXXXXXXXXXXXXXX",
            "record_ids": ["recAAAAAAAAAAAA", "recBBBBBBBBBBBBBB"]
          }
        output_json: |
          {
            "data": {
              "records": [
                {
                  "id": "recAAAAAAAAAAAA",
                  "deleted": true
