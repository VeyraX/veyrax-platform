            "data": {
              "id": "recZZZZZZZZZZZZZZ",
              "deleted": true
            },
            "component": {
              "name": "AirtableDeletedRecord"
            }
          }

  - endpoint: /airtable/delete_records
    examples:
      - scenario: "Delete Multiple Records"
        description: "Delete multiple records from a table"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id_or_name": "tblXXXXXXXXXXXXXX",
            "record_ids": ["recAAAAAAAAAAAA", "recBBBBBBBBBBBBBB"]
          }
        output_json: |
          {
            "data": {
              "records": [
                {
                  "id": "recAAAAAAAAAAAA",
                  "deleted": true
                },
                {
                  "id": "recBBBBBBBBBBBBBB",
                  "deleted": true
                }
              ]
            },
            "component": {
              "name": "AirtableDeletedRecordsList"
            }
          }

  - endpoint: /airtable/upload_attachment
    examples:
      - scenario: "Upload Attachment"
        description: "Upload a file attachment to a record"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "record_id": "recXXXXXXXXXXXXXX",
            "attachment_field": "Attachments",
            "content_type": "text/plain",
            "file": "SGVsbG8gd29ybGQ=",
            "filename": "example.txt"
          }
        output_json: |
          {
            "data": {
              "id": "recXXXXXXXXXXXXXX",
              "createdTime": "2023-05-10T15:32:42.000Z",
              "fields": {
                "Name": "Project Alpha",
                "Status": "Complete",
                "Score": 100,
                "Description": "This is the alpha project description",
                "Attachments": [
                  {
                    "id": "attDDDDDDDDDDDDDD",
                    "url": "https://v5.airtableusercontent.com/v3/u/20/20/1715000000000/example.txt",
                    "filename": "example.txt",
                    "size": 11,
                    "type": "text/plain"
                  }
                ]
              }
            },
            "component": {
              "name": "AirtableRecord"
            }
          }

  - endpoint: /airtable/sync_csv
    examples:
      - scenario: "Sync CSV Data"
        description: "Sync CSV data to a table"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
