        output_json: |
          {
            "data": {
              "id": "fldDDDDDDDDDDDDDD",
              "name": "Renamed Text Field",
              "type": "singleLineText",
              "description": "A new text field for storing additional information"
            }
          }

      - scenario: "Update Field Description"
        description: "Update the description of an existing field"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "table_id": "tblXXXXXXXXXXXXXX",
            "column_id": "fldDDDDDDDDDDDDDD",
