              },
              {
                "name": "Due Date",
                "type": "date",
                "options": {
                  "dateFormat": {
                    "name": "local"
                  }
                }
              },
              {
                "name": "Completed",
                "type": "checkbox",
                "options": {
                  "color": "greenBright",
                  "icon": "check"
                }
              }
            ]
          }
        output_json: |
          {
            "data": {
              "id": "tblXXXXXXXXXXXXXX",
              "name": "Projects",
              "description": "A list of ongoing projects",
              "primaryFieldId": "fldXXXXXXXXXXXXXX",
              "fields": [
                {
                  "id": "fldXXXXXXXXXXXXXX",
                  "name": "Project Name",
                  "type": "singleLineText",
                  "description": "Name of the project"
                },
                {
                  "id": "fldYYYYYYYYYYYYYY",
                  "name": "Description",
                  "type": "multilineText"
                },
                {
                  "id": "fldZZZZZZZZZZZZZZ",
                  "name": "Due Date",
                  "type": "date",
                  "options": {
                    "dateFormat": {
                      "name": "local"
                    }
                  }
                },
                {
                  "id": "fldAAAAAAAAAAAAAA",
                  "name": "Completed",
                  "type": "checkbox",
                  "options": {
                    "color": "greenBright",
                    "icon": "check"
                  }
                }
              ],
              "views": [
                {
                  "id": "viwXXXXXXXXXXXXXX",
                  "name": "Grid view",
                  "type": "grid"
                }
              ]
            },
            "component": {
              "name": "AirtableTableModel"
            }
          }

