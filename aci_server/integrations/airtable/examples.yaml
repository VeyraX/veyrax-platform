  - endpoint: /airtable/create_table
    examples:
      - scenario: "Create Table with Fields"
        description: "Create a new table with multiple field types"
        input_json: |
          {
            "base_id": "appXXXXXXXXXXXXXX",
            "name": "Projects",
            "description": "A list of ongoing projects",
            "fields": [
              {
                "name": "Project Name",
                "type": "singleLineText",
                "description": "Name of the project"
              },
              {
                "name": "Description",
