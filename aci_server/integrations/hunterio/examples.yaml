routes:
  - endpoint: /hunterio/domain_search
    examples:
      - scenario: "Basic Domain Search"
        description: "Search for email addresses from a domain using only required parameters"
        input_json: |
          {
            "domain": "intercom.com"
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "domain": "intercom.com",
              "disposable": false,
              "webmail": false,
              "accept_all": true,
              "pattern": "{first}",
              "organization": "Intercom",
              "description": "Faster resolutions, higher CSAT, and lighter support volumes with the only platform to combine the power of automation and human customer support.",
              "industry": "Software Development",
              "technologies": ["amazon-web-services", "facebook", "intercom", "marketo", "node-js", "react", "recaptcha", "sentry"],
              "emails": [
                {
                  "value": "ciaran@intercom.com",
                  "type": "personal",
                  "confidence": 92,
                  "sources": [
                    {
                      "domain": "github.com",
                      "uri": "http://github.com/ciaranlee",
                      "extracted_on": "2015-07-29",
                      "last_seen_on": "2017-07-01",
                      "still_on_page": true
                    }
                  ],
                  "first_name": "Ciaran",
                  "last_name": "Lee",
                  "position": "Support Engineer",
                  "seniority": "senior",
                  "department": "it",
                  "twitter": "ciaran_lee",
                  "verification": {
                    "date": "2019-12-06",
                    "status": "valid"
                  }
                },
                {
                  "value": "support@intercom.com",
                  "type": "generic",
                  "confidence": 100,
                  "sources": [
                    {
                      "domain": "intercom.com",
                      "uri": "https://www.intercom.com/contact",
                      "extracted_on": "2015-01-25",
                      "last_seen_on": "2020-02-02",
                      "still_on_page": true
                    }
                  ],
                  "verification": {
                    "date": "2020-02-02",
                    "status": "valid"
                  }
                }
              ],
              "linked_domains": []
            },
            "message": null,
            "component": {
              "name": "DomainSearchResultView"
            }
          }

      - scenario: "Domain Search with Filters"
        description: "Search for email addresses from a domain with type and department filters"
        input_json: |
          {
            "domain": "intercom.com",
            "limit": 5,
            "type": "personal",
            "department": "executive"
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "domain": "intercom.com",
              "disposable": false,
              "webmail": false,
              "accept_all": true,
              "pattern": "{first}",
