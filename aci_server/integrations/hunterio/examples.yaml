  - endpoint: /hunterio/email_finder
    examples:
      - scenario: "Basic Email Finder"
        description: "Find an email address using domain, first name, and last name"
        input_json: |
          {
            "domain": "reddit.com",
            "first_name": "Alexis",
            "last_name": "Ohanian"
          }
        output_json: |
          {
            "status_code": 200,
            "data": {
              "first_name": "Alexis",
              "last_name": "Ohanian",
              "email": "alexis@reddit.com",
              "score": 97,
              "domain": "reddit.com",
              "accept_all": false,
              "position": "Cofounder",
              "sources": [
                {
                  "domain": "redditblog.com",
                  "uri": "http://redditblog.com/2008/10/22/widgets-get-an-upgrade-and-a-firefox-extension-that-will-rock-your-world",
                  "extracted_on": "2018-10-19",
                  "last_seen_on": "2021-05-18",
                  "still_on_page": true
                }
              ],
              "verification": {
                "date": "2021-06-14",
                "status": "valid"
              }
            },
            "message": null,
            "component": {
              "name": "EmailFinderResultView"
            }
          }

      - scenario: "Email Finder with Company Name"
        description: "Find an email address using company name, first name, and last name"
        input_json: |
          {
            "company": "Stripe",
            "first_name": "Patrick",
            "last_name": "Collison"
