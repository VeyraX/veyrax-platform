                      "extracted_on": "2015-02-14",
                      "last_seen_on": "2020-02-02",
                      "still_on_page": true
                    }
                  ],
                  "first_name": "Des",
                  "last_name": "Traynor",
                  "position": "Co-founder & Chief Strategy Officer",
                  "seniority": "executive",
