version: '3.8'

services:
  whatsapp-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatsapp-bridge:latest
    container_name: whatsapp-bridge
    ports:
      - "8080:8080"  # Expose to public in production
    volumes:
      - whatsapp_data:/app/store
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  whatsapp_data:
    name: whatsapp_data_prod 