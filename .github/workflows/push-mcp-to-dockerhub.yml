name: Push MCP to Docker Hub

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'GitHub repository URL to process'
        required: true
        type: string
      dockerfile_base64:
        description: 'Base64-encoded Dockerfile content'
        required: true
        type: string
      image_name:
        description: 'Docker image name'
        required: false
        default: 'auto-generated-image'
        type: string
      auth_token:
        description: 'Authentication token (Bearer or VEYRAX_API_KEY)'
        required: true
        type: string
      repository_id:
        description: 'Repository ID for connecting to Veyrax'
        required: true
        type: string
      deployment_id:
        description: 'Deployment ID for connecting to Veyrax'
        required: true
        type: string

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Extract repo owner and name
        id: repo-info
        run: |
          REPO_URL="${{ github.event.inputs.repo_url }}"
          if [[ $REPO_URL == *"github.com"* ]]; then
            REPO_URL_TRIMMED=${REPO_URL#*github.com/}
            
            if [[ $REPO_URL_TRIMMED == *"/tree/"* ]]; then
              BASE_REPO=${REPO_URL_TRIMMED%%/tree/*}
              AFTER_TREE=${REPO_URL_TRIMMED#*/tree/*/}
              echo "subdirectory=$AFTER_TREE" >> $GITHUB_OUTPUT
              echo "Using subdirectory: $AFTER_TREE"
            elif [[ $REPO_URL_TRIMMED == *"/blob/"* ]]; then
              BASE_REPO=${REPO_URL_TRIMMED%%/blob/*}
            else
              BASE_REPO=$REPO_URL_TRIMMED
            fi
            
            BASE_REPO=${BASE_REPO%.git}
            
            REPO_OWNER=$(echo $BASE_REPO | cut -d'/' -f1)
            REPO_NAME=$(echo $BASE_REPO | cut -d'/' -f2)
            
            echo "repo_path=$BASE_REPO" >> $GITHUB_OUTPUT
            echo "repo_owner=$REPO_OWNER" >> $GITHUB_OUTPUT 
            echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
            echo "Extracted repository path: $BASE_REPO"
          else
            echo "Error: Invalid GitHub URL format"
            exit 1
          fi
          
      - name: Checkout target repository
        uses: actions/checkout@v3
        with:
          repository: ${{ steps.repo-info.outputs.repo_path }}
          path: target-repo
          
      - name: Handle subdirectory if specified
        run: |
          if [[ -n "${{ steps.repo-info.outputs.subdirectory }}" ]]; then
            echo "Subdirectory specified: ${{ steps.repo-info.outputs.subdirectory }}"
            
            if [[ -d "target-repo/${{ steps.repo-info.outputs.subdirectory }}" ]]; then
              echo "Moving contents from subdirectory to root of target-repo"
              mkdir -p temp-subdir
              # Move subdirectory contents to temp
              mv target-repo/${{ steps.repo-info.outputs.subdirectory }}/* temp-subdir/
              # Clean target-repo
              rm -rf target-repo/*
              # Move contents back to target-repo
              mv temp-subdir/* target-repo/
              # Remove temp directory
              rm -rf temp-subdir
            else
              echo "Error: Specified subdirectory not found!"
              exit 1
            fi
          fi
          
      - name: Decode and save Dockerfile
        run: |
          echo "${{ github.event.inputs.dockerfile_base64 }}" | base64 -d > target-repo/Dockerfile
          
      - name: Show Dockerfile
        run: cat target-repo/Dockerfile
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build and test Docker image locally
        uses: docker/build-push-action@v4
        with:
          context: ./target-repo
          file: ./target-repo/Dockerfile
          load: true
          tags: ${{ github.event.inputs.image_name }}:test
          
      - name: Verify Docker image works
        run: |
          echo "Testing if Docker image runs correctly..."
          docker run --rm -d --name test-container --entrypoint /bin/sh ${{ github.event.inputs.image_name }}:test -c "tail -f /dev/null" || docker run --rm -d --name test-container ${{ github.event.inputs.image_name }}:test -l
          
          sleep 5
          
          if docker ps | grep test-container; then
            echo "✅ Container started successfully!"
            echo "Basic test passed!"
            docker stop test-container
          else
            echo "Container may have exited immediately. Checking logs..."
            docker logs $(docker ps -a -q --filter "name=test-container" --latest) || true
            
            EXIT_CODE=$(docker inspect $(docker ps -a -q --filter "name=test-container" --latest) --format="{{.State.ExitCode}}")
            if [ "$EXIT_CODE" = "0" ]; then
              echo "✅ Container exited successfully with code 0!"
              echo "This is expected for services that initialize and exit cleanly."
            else
              echo "❌ Container failed with exit code $EXIT_CODE!"
              exit 1
            fi
          fi
          
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./target-repo
          file: ./target-repo/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.image_name }}:latest
          
      - name: Setup Container for User
        run: |
          if [[ "${{ github.event.inputs.auth_token }}" == Bearer* ]]; then
            AUTH_HEADER="Authorization: ${{ github.event.inputs.auth_token }}"
          else
            AUTH_HEADER="VEYRAX_API_KEY: ${{ github.event.inputs.auth_token }}"
          fi
          
          echo "Calling Veyrax API to update deployment status to 'building'..."
          curl -X POST "${{ secrets.VEYRAX_DEPLOY_BASE_URL }}/repo/connect" \
            -H "Content-Type: application/json" \
            -H "$AUTH_HEADER" \
            -d "{
              \"repository_id\": \"${{ github.event.inputs.repository_id }}\",
              \"deployment_id\": \"${{ github.event.inputs.deployment_id }}\"
            }"
