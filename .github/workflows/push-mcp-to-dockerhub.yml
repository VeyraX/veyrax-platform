name: Push MCP to Docker Hub

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'GitHub repository URL to process'
        required: true
        type: string
      dockerfile_base64:
        description: 'Base64-encoded Dockerfile content'
        required: true
        type: string
      image_name:
        description: 'Docker image name'
        required: false
        default: 'auto-generated-image'
        type: string
      auth_token:
        description: 'Authentication token (Bearer or VEYRAX_API_KEY)'
        required: true
        type: string
      repository_id:
        description: 'Repository ID for connecting to Veyrax'
        required: true
        type: string
      deployment_id:
        description: 'Deployment ID for connecting to Veyrax'
        required: true
        type: string

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    env:
      CONTEXT_ROOT: ./target-repo
    steps:
      - name: Extract repo owner and name
        id: repo-info
        run: |
          REPO_URL="${{ github.event.inputs.repo_url }}"
          REPO_PATH=${REPO_URL#*github.com/}   # strip domain
          REPO_PATH=${REPO_PATH%.git}          # strip .git if any

          # Detect /tree/<branch>/path or /blob/<branch>/path
          if [[ "$REPO_PATH" == */tree/* ]]; then
            SUBDIR=${REPO_PATH#*/tree/*/}      # after branch/
            REPO_PATH=${REPO_PATH%%/tree/*}    # owner/repo
            echo "subdirectory=$SUBDIR" >> "$GITHUB_OUTPUT"
          elif [[ "$REPO_PATH" == */blob/* ]]; then
            SUBDIR=${REPO_PATH#*/blob/*/}
            REPO_PATH=${REPO_PATH%%/blob/*}
            echo "subdirectory=$SUBDIR" >> "$GITHUB_OUTPUT"
          fi

          echo "repo_path=$REPO_PATH" >> "$GITHUB_OUTPUT"

      - name: Checkout target repository
        uses: actions/checkout@v3
        with:
          repository: ${{ steps.repo-info.outputs.repo_path }}
          path: target-repo

      - name: Detect build context
        id: ctx
        run: |
          CTX="${{ env.CONTEXT_ROOT }}"
          if [[ -n "${{ steps.repo-info.outputs.subdirectory }}" ]]; then
            CTX="$CTX/${{ steps.repo-info.outputs.subdirectory }}"
            # копируем корневой tsconfig.json в подпапку, чтобы tsc не падал
            if [[ -f ${{ env.CONTEXT_ROOT }}/tsconfig.json ]]; then
              cp ${{ env.CONTEXT_ROOT }}/tsconfig.json "$CTX/tsconfig.json"
            fi
          fi
          echo "context=$CTX" >> "$GITHUB_OUTPUT"

      - name: Decode and save Dockerfile
        run: |
          mkdir -p "${{ steps.ctx.outputs.context }}"
          echo "${{ github.event.inputs.dockerfile_base64 }}" | base64 -d > "${{ steps.ctx.outputs.context }}/Dockerfile"

      - name: Show Dockerfile
        run: cat "${{ steps.ctx.outputs.context }}/Dockerfile"
        run: cat "${{ env.CONTEXT_ROOT }}/Dockerfile"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and test Docker image locally
        uses: docker/build-push-action@v4
        with:
          context: ${{ env.CONTEXT_ROOT }}
          file: ${{ env.CONTEXT_ROOT }}/Dockerfile
          load: true
          tags: ${{ github.event.inputs.image_name }}:test

      - name: Verify Docker image works
        run: |
          docker run --rm -d --name test-container ${{ github.event.inputs.image_name }}:test tail -f /dev/null
          sleep 5
          docker ps | grep test-container >/dev/null || { echo "Container failed to start"; docker logs test-container || true; exit 1; }
          docker stop test-container

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ${{ env.CONTEXT_ROOT }}
          file: ${{ env.CONTEXT_ROOT }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.image_name }}:latest

      - name: Setup Container for User
        env:
          AUTH_TOKEN: ${{ github.event.inputs.auth_token }}
        run: |
          if [[ "$AUTH_TOKEN" == Bearer* ]]; then
            AUTH_HEADER="Authorization: $AUTH_TOKEN"
          else
            AUTH_HEADER="VEYRAX_API_KEY: $AUTH_TOKEN"
          fi
          curl -X POST "${{ secrets.VEYRAX_DEPLOY_BASE_URL }}/repo/connect" \
               -H "Content-Type: application/json" \
               -H "$AUTH_HEADER" \
               -d '{"repository_id":"${{ github.event.inputs.repository_id }}","deployment_id":"${{ github.event.inputs.deployment_id }}"}'
