name: Push MCP to Docker Hub

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'GitHub repository URL to process'
        required: true
        type: string
      dockerfile_base64:
        description: 'Base64-encoded Dockerfile content'
        required: true
        type: string
      image_name:
        description: 'Docker image name'
        required: false
        default: 'auto-generated-image'
        type: string
      auth_token:
        description: 'Authentication token (Bearer or VEYRAX_API_KEY)'
        required: true
        type: string
      repository_id:
        description: 'Repository ID for connecting to Veyrax'
        required: true
        type: string
      deployment_id:
        description: 'Deployment ID for connecting to Veyrax'
        required: true
        type: string

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    env:
      CONTEXT_ROOT: ./target-repo
    steps:
      - name: Extract repo owner and name
        id: repo-info
        run: |
          REPO_URL="${{ github.event.inputs.repo_url }}"
          REPO_PATH=${REPO_URL#*github.com/}
          REPO_PATH=${REPO_PATH%.git}
          if [[ "$REPO_PATH" == */tree/* ]]; then
            SUBDIR=${REPO_PATH#*/tree/*/}
            REPO_PATH=${REPO_PATH%%/tree/*}
            echo "subdirectory=$SUBDIR" >> "$GITHUB_OUTPUT"
          elif [[ "$REPO_PATH" == */blob/* ]]; then
            SUBDIR=${REPO_PATH#*/blob/*/}
            REPO_PATH=${REPO_PATH%%/blob/*}
            echo "subdirectory=$SUBDIR" >> "$GITHUB_OUTPUT"
          fi
          echo "repo_path=$REPO_PATH" >> "$GITHUB_OUTPUT"

      - name: Checkout target repository
        uses: actions/checkout@v3
        with:
          repository: ${{ steps.repo-info.outputs.repo_path }}
          path: target-repo

      - name: Detect build context
        id: ctx
        run: |
          CTX="${{ env.CONTEXT_ROOT }}"
          DOCKERFILE="${{ env.CONTEXT_ROOT }}/Dockerfile"
          if [[ -n "${{ steps.repo-info.outputs.subdirectory }}" ]]; then
            DOCKERFILE="${{ env.CONTEXT_ROOT }}/${{ steps.repo-info.outputs.subdirectory }}/Dockerfile"
            mkdir -p "${{ env.CONTEXT_ROOT }}/${{ steps.repo-info.outputs.subdirectory }}"
          fi
          echo "context=$CTX" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"

      - name: Decode and save Dockerfile
        run: |
          echo "${{ github.event.inputs.dockerfile_base64 }}" | base64 -d > "${{ steps.ctx.outputs.dockerfile }}"

      - name: Show Dockerfile
        run: cat "${{ steps.ctx.outputs.dockerfile }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and test Docker image locally
        id: build-test
        run: |
          BUILD_LOG_FILE="build_log.txt"
          touch $BUILD_LOG_FILE
          
          BUILD_EXIT_CODE=0
          BUILD_SUCCESS=true
          
          report_deployment_status() {
            local status="$1"
            local logs="$2"
            local auth_token="${{ github.event.inputs.auth_token }}"
            local deployment_id="${{ github.event.inputs.deployment_id }}"
            local repository_id="${{ github.event.inputs.repository_id }}"
            
            if [[ "$auth_token" == Bearer* ]]; then
              local auth_header="Authorization: $auth_token"
            else
              local auth_header="VEYRAX_API_KEY: $auth_token"
            fi
            
            local logs_escaped=$(echo "$logs" | jq -Rs .)
            
            local payload=$(jq -n \
              --arg deployment_id "$deployment_id" \
              --arg status "$status" \
              --arg build_logs "$logs_escaped" \
              --arg repository_id "$repository_id" \
              '{
                deployment_id: $deployment_id,
                status: $status,
                build_logs: $build_logs,
                repository_id: $repository_id
              }')
            
            curl -X POST "${{ secrets.VEYRAX_DEPLOY_BASE_URL }}/mcp_deployment/update-deployment-status" \
                 -H "Content-Type: application/json" \
                 -H "$auth_header" \
                 -d "$payload"
          }
          
          {
            docker build -t ${{ github.event.inputs.image_name }}:test ${{ env.CONTEXT_ROOT }} -f ${{ steps.ctx.outputs.dockerfile }} 2>&1 | tee $BUILD_LOG_FILE
            BUILD_EXIT_CODE=${PIPESTATUS[0]}
            
            if [ $BUILD_EXIT_CODE -ne 0 ]; then
              BUILD_SUCCESS=false
              BUILD_LOGS_BASE64=$(cat $BUILD_LOG_FILE | base64 -w 0)
              echo "build_logs_base64=$BUILD_LOGS_BASE64" >> "$GITHUB_OUTPUT"
              echo "build_exit_code=$BUILD_EXIT_CODE" >> "$GITHUB_OUTPUT"
              echo "build_success=false" >> "$GITHUB_OUTPUT"
              
              BUILD_LOGS_DECODED=$(echo "$BUILD_LOGS_BASE64" | base64 -d)
              report_deployment_status "failed" "$BUILD_LOGS_DECODED"
              
              echo "::error::Docker build failed. See deployment logs for details."
              exit 1
            fi
            
            docker run --rm -d --name test-container --entrypoint tail ${{ github.event.inputs.image_name }}:test -f /dev/null
            sleep 5
            if ! docker ps | grep test-container >/dev/null; then
              echo "Container failed to start" | tee -a $BUILD_LOG_FILE
              docker logs test-container >> $BUILD_LOG_FILE 2>&1 || true
              BUILD_SUCCESS=false
              BUILD_LOGS_BASE64=$(cat $BUILD_LOG_FILE | base64 -w 0)
              echo "build_logs_base64=$BUILD_LOGS_BASE64" >> "$GITHUB_OUTPUT"
              echo "build_success=false" >> "$GITHUB_OUTPUT"
              
              BUILD_LOGS_DECODED=$(echo "$BUILD_LOGS_BASE64" | base64 -d)
              report_deployment_status "failed" "$BUILD_LOGS_DECODED"
              
              echo "::error::Container failed to start. See deployment logs for details."
              exit 1
            fi
            docker stop test-container
            
            echo "build_success=true" >> "$GITHUB_OUTPUT"
          } || {
            BUILD_SUCCESS=false
            BUILD_LOGS_BASE64=$(cat $BUILD_LOG_FILE 2>/dev/null | base64 -w 0 || echo "Failed to capture logs")
            echo "build_logs_base64=$BUILD_LOGS_BASE64" >> "$GITHUB_OUTPUT"
            echo "build_success=false" >> "$GITHUB_OUTPUT"
            
            report_deployment_status "failed" "Unexpected build failure occurred"
            
            echo "::error::Unexpected failure during build or test. See deployment logs for details."
            exit 1
          }

      - name: Login to Docker Hub
        if: steps.build-test.outputs.build_success == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: steps.build-test.outputs.build_success == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ${{ env.CONTEXT_ROOT }}
          file: ${{ steps.ctx.outputs.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.image_name }}:latest

      - name: Setup Container for User
        if: steps.build-test.outputs.build_success == 'true'
        env:
          AUTH_TOKEN: ${{ github.event.inputs.auth_token }}
        run: |
          if [[ "$AUTH_TOKEN" == Bearer* ]]; then
            AUTH_HEADER="Authorization: $AUTH_TOKEN"
          else
            AUTH_HEADER="VEYRAX_API_KEY: $AUTH_TOKEN"
          fi
          curl -X POST "${{ secrets.VEYRAX_DEPLOY_BASE_URL }}/repo/connect" \
               -H "Content-Type: application/json" \
               -H "$AUTH_HEADER" \
               -d '{"repository_id":"${{ github.event.inputs.repository_id }}","deployment_id":"${{ github.event.inputs.deployment_id }}"}'
